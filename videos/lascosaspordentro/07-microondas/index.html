        const id = e.id, k = e.k;
        if (e.set === "horno") {
          const rxOn = id === "rayosx" ? ramp(t, T("DETRAS") + 0.1, T("DETRAS") + 0.9) : id === "mag-situ" || id === "rebota3d" ? 1 : 0;
          estadoH = { rx: rxOn, puerta: ["sopa", "gira-horno", "choco-horno"].includes(id) ? 1 : 0, luz: 1, gira: id !== "choco-horno", choco: id === "choco-horno", funde: 0,
            rayos: id === "rebota3d" ? ramp(t, T("PARED"), T("PARED") + 0.3) : 0, vapor: id === "rayosx" || id === "mag-situ" ? 0 : 1 };
        } else if (e.set === "mag") {
          estadoM = { corte: ["mag-arriba", "mag-elec", "mag-alas", "mag-cifra"].includes(id) ? "y" : ["mag-antena", "mag-lejos"].includes(id) ? "no" : "z",
            abre: 0, campo: ["mag-alas", "mag-cifra"].includes(id) ? 1 : id === "mag-elec" ? 0.3 : 0,
            fil: ["mag-elec", "mag-alas"].includes(id) ? 0.55 : 1.3, elec: ["mag-antena", "mag-lejos"].includes(id) ? 0 : 1, anillos: id === "mag-antena" ? ramp(t, T("OSCILAN"), T("OSCILAN") + 0.3) : id === "mag-lejos" ? 1 : 0 };
        } else if (e.set === "guia") {
          estadoG = { guia: ["guia", "caja"].includes(id) ? 1 : 0, rayos: id === "caja" ? ramp(t, T("LLEVA") + 0.25, T("LLEVA") + 0.7) * 0.8 : id === "rebota" ? 1 : 0,
            ida: id === "ondas-dos" ? 1 : id === "ondas-quietas" ? 1 - ramp(t, T("QUIETAS"), T("QUIETAS") + 0.8) : id === "lambda" ? 1 : 0,
            vuelta: id === "ondas-dos" ? ramp(t, T("CRUZARSE") - 0.4, T("CRUZARSE")) : id === "ondas-quietas" ? 1 - ramp(t, T("QUIETAS"), T("QUIETAS") + 0.8) : 0,
            quieta: id === "ondas-quietas" ? ramp(t, T("QUIETAS") - 0.1, T("QUIETAS") + 0.6) : id === "puntos" ? 1 : 0,
            puntos: id === "puntos" ? ramp(t, T("PUNTOS"), T("PUNTOS") + 0.5) : id === "ondas-quietas" ? ramp(t, T("QUIETAS") + 0.6, T("QUIETAS") + 1.2) * 0.5 : 0,
            regla: id === "lambda" ? ramp(t, T("MIDEN") + 0.2, T("MIDEN") + 0.9) : 0, congela: id === "lambda" };
        } else if (e.set === "mol") {
          const tc = T("CAMPO"); sMas.visible = sMenos.visible = ["mol-pos", "mol-neg", "mol-gira"].includes(id);
          estadoO = { campo: t >= tc ? ramp(t, tc, tc + 0.4) : 0, alinea: ramp(t, T("MOLECS") - 0.5, T("MOLECS") + 0.4), calor: ramp(t, T("CHOCAN") - 0.2, T("CALOR") + 0.6), t0: tc };
        } else if (e.set === "cuenco") {
          if (id === "borde") estadoK = { k: 1, cond: 0, ola: 0, cifras: 1, regla: 0, flechas: 0 };
          else estadoK = { k: ramp(t, T("FUERA") - 0.6, T("FUERA") + 0.4), cond: ramp(t, T("SARTEN") - 0.4, T("SARTEN") + 1.6), ola: ["cuenco", "cuenco-borde"].includes(id) ? ramp(t, T("PERO1"), T("PERO1") + 0.5) : 0,
            cifras: ["cuenco-mapa", "cuenco-centro", "cuenco-sarten"].includes(id) ? ramp(t, T("FUERA"), T("FUERA") + 0.3) : 0, regla: id === "cuenco-borde" ? 1 : 0, flechas: id === "cuenco-sarten" ? ramp(t, T("SARTEN"), T("SARTEN") + 0.4) : 0 };
        } else if (e.set === "plato") {
          const melt = ramp(t, T("DERRITE") - 0.2, T("CALIENTES") + 0.4);
          const sinPlato = ["mapa", "mapa-regla", "frio-macro"].includes(id);
          estadoP = { mapa: sinPlato || id === "gira-arriba" ? 1 : ["choco-arriba", "choco-macro", "choco-lado"].includes(id) ? 0.0 : 0.55,
            plato: !sinPlato, gira: id === "gira-arriba", bowl: id === "gira-arriba", choco: id !== "gira-arriba" && !sinPlato,
            funde: ["choco-arriba", "choco-macro", "choco-lado"].includes(id) ? 0.35 : id === "derrite" ? melt : ["fundido", "distancia", "doble", "cuenta", "resultado", "km"].includes(id) ? Math.max(melt, 0.9) : 0,
            cifras: id === "mapa-regla" ? ramp(t, T("SEPARADOS") + 0.5, T("SEPARADOS") + 1.0) : ["mapa", "frio-macro"].includes(id) ? 1 : 0,
            regla: ["mapa", "doble", "cuenta"].includes(id) ? 1 : id === "mapa-regla" ? ramp(t, T("SEPARADOS") + 0.1, T("SEPARADOS") + 0.8) : id === "distancia" ? ramp(t, T("DIST") + 0.1, T("DIST") + 0.8) : 0,
            doble: id === "doble" ? ramp(t, T("POR2") + 0.1, T("POR2") + 0.7) : id === "cuenta" ? 1 : 0,
            sopa: id === "gira-arriba" ? 1 : 0 };
        } else if (e.set === "puerta") {
          const tq = T("PUERTA");
          estadoQ = { ida: id === "puerta-corte" ? ramp(t, tq - 0.05, tq + 0.45) : 0, vuelta: id === "puerta-corte" ? ramp(t, tq + 0.45, tq + 1.1) : 0, luz: id === "puerta-corte" ? ramp(t, tq + 0.2, tq + 0.6) : 0, macro: id === "puerta-macro" ? 1 : 0 };
        }
      }

      const panelLuz0 = () => C.panel("luz0", "¿? km/s");
      const cuentaEl = document.getElementById("cuenta"), cuentaL = [...cuentaEl.querySelectorAll(".l")];
      const leyendaFilas = [...document.querySelectorAll(".leyenda .fila")];
      function overlays(t) {
        panelLuz0();
        C.panel("freq", "2,45 GHz");
        { const k = ramp(t, T("MILLONES") - 0.1, T("MILLONES") + 0.7), n = Math.round(lerp(0, 2450, k)); C.panel("osc", `${String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".")}.000.000`); }
        C.panel("cambios", "4.900.000.000");
        C.panel("temp", `${Math.round(lerp(20, 64, ramp(t, T("CALOR"), T("CALOR") + 1.2)))} °C`);
        C.panel("prof", "1,4–3,8 cm");
        C.panel("lambda", "12,2 cm");
        C.panel("sep", "6,1 cm");
        C.panel("luz", "299.792 km/s");
        // the arithmetic, line by line
        const a = ventana(t, T("FREC") - 0.9, T("VEL2"), 0.25);
        cuentaEl.style.opacity = a; cuentaEl.style.transform = `translateY(${(1 - a) * 12}px)`;
        [T("FREC") - 0.9, T("FREC") - 0.1, T("KM") - 0.6, T("KM") + 0.6].forEach((t0, i) => { const k = ramp(t, t0, t0 + 0.25); cuentaL[i].style.opacity = k; cuentaL[i].style.transform = `translateX(${(1 - k) * -14}px)`; });
        // legend rows: stack the visible ones
        let y = 0; for (const f of leyendaFilas) { const o = parseFloat(f.style.opacity || "0"); f.style.top = y + "px"; if (o > 0.01) y += 36; }
      }

      // everything but the camera for shot e; PLN.pintar places the camera and calls it twice in a cross-fade
      function dibujar(t, e) {
        estado(t, e);
        if (e.set === "horno") updHorno(t, e);
        else if (e.set === "mag") updMag(t, e);
        else if (e.set === "guia") updGuia(t, e);
        else if (e.set === "mol") updMol(t, e);
        else if (e.set === "cuenco") updCuenco(t, e);
        else if (e.set === "plato") updPlato(t, e);
        else if (e.set === "puerta") updPuerta(t, e);
        else if (e.set === "final") updFinal(t, e);
        C.renderer.toneMappingExposure = ["mag-elec", "mag-alas"].includes(e.id) ? 0.78 : ["mag-cifra", "mag-arriba"].includes(e.id) ? 0.9 : 1.05;
        overlays(t);
        C.pintar(t);
        overlays(t);
      }
      const renderAt = (t) => PLN.pintar(t, dibujar);

      // warm-up: draw every set once with all its parts visible, so no shader compiles in the middle of the video
      const bloom = C.composer.passes.find((x) => x.threshold !== undefined); if (bloom) { bloom.threshold = 0.9; bloom.strength = 0.5; }
      const bok = C.composer.passes.find((x) => x.uniforms && x.uniforms.aperture);
      for (const k in SETS) {
        for (const j in SETS) SETS[j].grupo.visible = j === k;
        const ocultos = [];
        SETS[k].grupo.traverse((o) => { if (!o.visible) { ocultos.push(o); o.visible = true; } });
        C.camera.position.copy(SETS[k].centro).add(v3(0, 10, 80)); C.camera.lookAt(SETS[k].centro); C.camera.updateMatrixWorld();
        C.renderer.compile(C.scene, C.camera);
        if (bok) { bok.enabled = true; bok.uniforms.aperture.value = 0.0002; }
        C.composer.render();
        for (const o of ocultos) o.visible = false;
      }
      window.__micro = { C, X, PLN, SETS, renderAt };
      C.arrancar(renderAt);
    </script>
  </body>
</html>
