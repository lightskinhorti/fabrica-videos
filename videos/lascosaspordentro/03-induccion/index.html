        const heatShow = ramp(t, T.DENTRO - 0.2, T.DENTRO + 0.5) * (1 - ventana(t, T.VALE - 0.2, T.APROVECHA + 0.3, 0.5));
        const heat = heatShow * (1 - 0.6 * ramp(t, T.LEVANTAS + 0.5, T.MANDA)) * (0.85 + 0.15 * Math.sin(t * 3));
        fondoMat.emissiveIntensity = 0.7 * heat; glowPan.material.opacity = 0.3 * heat;
        // the glass keeps a faint warm spot after the pan is lifted (kept faint so the coil does not look on)
        warmMat.opacity = 0.35 * ventana(t, T.CRISTAL, T.VALE, 0.4) + 0.05 * ventana(t, T.LEVANTAS + 0.4, T.MANDA + 0.8, 0.5);

        // steam while it simmers
        let hv = 0;
        for (const [a, b] of HERVOR) hv = Math.max(hv, ventana(t, a, b, 1.0));
        steam.forEach((s, i) => {
          const ph = ((t * 0.22 + hash(i)) % 1 + 1) % 1;
          s.position.set((hash(i + 3) - 0.5) * 6 + Math.sin(t * 0.7 + i) * 0.6 * ph, 1.6 + 6 * ph, (hash(i + 7) - 0.5) * 6);
          // thin wisps: a lot less while explaining, so they never cover the pan
          s.scale.setScalar(1.6 + 2.6 * ph); s.material.opacity = hv * Math.sin(Math.PI * ph) * 0.12 * (1 - 0.75 * xr);
        });

        // magnet: flies to the tilted base and sticks; fades when the pan goes back down
        const mIn = ramp(t, T.PEGA - 0.9, T.PEGA - 0.05);
        const stuck = acero.g.localToWorld(v3(0, -0.22, 0));
        iman.position.copy(v3(3, 6, 18).lerp(stuck, mIn));
        iman.quaternion.copy(acero.g.quaternion);
        imanMat.opacity = ramp(t, T.PEGA - 1.0, T.PEGA - 0.7) * (1 - ramp(t, T.PEGA + 1.3, T.PEGA + 1.7));
        iman.visible = imanMat.opacity > 0.01;

        // efficiency bars behind the hob: induction 85 %, gas 32 %
        const grow = ramp(t, T.APROVECHA - 0.2, T.APROVECHA + 0.8) * (1 - ramp(t, T.ZUMBIDO, T.ZUMBIDO + 0.6));
        const h1 = Math.max(0.001, 8.5 * grow), h2 = Math.max(0.001, 3.2 * grow);
        bar1.scale.y = h1; bar1.position.y = h1 / 2; bar2.scale.y = h2; bar2.position.y = h2 / 2;
        bar1.visible = bar2.visible = grow > 0.01;
        barTop1.position.set(-2.6, h1, -12); barTop2.position.set(2.6, h2, -12);

        // display
        const blink = Math.floor(t * 2.5) % 2 === 0;
        let est = power > 0.5 ? "nivel" : "";
        if ((aluOn && t > T.RECONOCE - 0.3) || (t > T.INSTANTE - 0.3 && t < T.MANDA + 0.9)) est = blink ? "sin" : "";
        if (est !== dispKey) { drawDisplay(est); dispKey = est; }
        // 20 to 100 kHz, depending on the hob (fuentes.md)
        C.panel("frec", "20.000 a 100.000");

        C.mirar(camAt(t));
        C.pintar(t);
      }

      C.arrancar(renderAt);
    </script>
  </body>
</html>
