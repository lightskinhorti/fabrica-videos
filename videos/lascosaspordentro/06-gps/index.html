        { t: "PERO", mas: -0.1, corte: true, ...rel(QW, -3.4, 2.8, 11) },
        { t: "CUARTO", mas: -0.15, ...rel(QW, -2.9, 2.4, 10) },
        { t: "CUARTO", mas: -0.1, corte: true, ...rel(TRI, -12, 5, 47) },
        { t: "EUROPA", mas: -0.15, ...rel(TRI, -15, 5, 45) },
        { t: "EUROPA", mas: -0.1, corte: true, ...rel(EAW, 22, 28, 62) },
        { t: "AHORA", mas: -0.15, ...rel(EAW, 12, 30, 66) },
        { t: "AHORA", mas: -0.1, corte: true, ...rel(CLK, 3.2, -2.4, 6.4) },
        { t: "RELATIVIDAD", mas: -0.15, ...rel(CLK, 2.8, -2.1, 5.8) },
        { t: "RELATIVIDAD", mas: -0.1, corte: true, ...rel(DGC, -7, 1.5, 74) },
        { t: "AJUSTAN", mas: -0.15, ...rel(DGC, -5, 1.2, 70) },
        { t: "AJUSTAN", mas: -0.1, corte: true, ...rel(CLK, 1.0, -3.0, 7.4) },
        { t: "SINO", mas: -0.15, ...rel(CLK, 0.8, -2.7, 6.8) },
        { t: "SINO", mas: -0.1, corte: true, ...rel(MPR, 0, 42, 30) },
        { t: "MANDA", mas: -0.15, ...rel(MPR, 0, 46, 33) },
        { t: "MANDA", mas: -0.1, corte: true, ...rel(PHC, -5, 3.5, 42) },
        { t: D, ...rel(PHC, -8, 5.5, 56) },
      ]);

      // ---------- each set, frame by frame ----------
      function updMovil(t) {
        const xr = Math.max(ventana(t, T.ESCUCHA - 0.1, T.FINAL, 0.25), ventana(t, T.CALCULA - 0.1, T.MEDIRLO, 0.25), ventana(t, T.PERO - 0.1, T.CUARTO, 0.25));
        bodyMat.opacity = 1 - 0.8 * xr; bodyMat.depthWrite = xr < 0.05;
        screenMat.opacity = 1 - 0.92 * xr; screenMat.depthWrite = xr < 0.05;
        const ph = frac(t * 0.8);
        dotW.opacity = dotB.opacity = 1 - xr; precMat.opacity = 0.2 * (1 - xr);
        dotPulse.scale.setScalar(1 + 2.2 * ph); pulsoMat.opacity = 0.6 * (1 - ph) * (1 - xr);
        antMat.emissiveIntensity = 0.5 * ventana(t, T.ESCUCHA, T.FINAL, 0.3) * (0.6 + 0.4 * Math.sin(t * 6));
        pistaMat.emissiveIntensity = 0.35 * Math.max(ventana(t, T.CALCULA, T.MEDIRLO, 0.3), ventana(t, T.BARATO, T.CUARTO, 0.3));
        chipMat.emissiveIntensity = 0.3 * ventana(t, T.CALCULA, T.MEDIRLO, 0.3) * (0.75 + 0.25 * Math.sin(t * 7));
        cuarzoMat.emissiveIntensity = 0.3 * ventana(t, T.BARATO, T.CUARTO, 0.3) * (0.7 + 0.3 * Math.sin(t * 9));
        // waves come down to the antenna while the phone listens (opening and ending)
        const on = Math.max(ventana(t, -1, T.FINAL, 0.3), ventana(t, T.MANDA - 0.2, D + 1, 0.3));
        const SRC = ANT.clone().add(v3(0, 18, 0));
        dotG.visible = xr < 0.98;
        arcos.forEach((m, i) => {
          const f = frac(t * 0.5 + i / 5), r = 18 * (0.12 + 0.88 * f);
          m.position.copy(SRC); m.scale.setScalar(r);
          m.material.opacity = on * 0.9 * Math.sin(Math.PI * f) ** 0.6;
        });
      }
      function updSat(t) {
        const xr = Math.max(0.55 * ventana(t, T.FINAL - 0.1, T.AHI, 0.25), ventana(t, T.ATOMICOS - 0.2, T.SENAL, 0.25), ventana(t, T.AHORA - 0.1, T.RELATIVIDAD, 0.2), ventana(t, T.AJUSTAN - 0.1, T.SINO, 0.2));
        foilMat.opacity = 1 - 0.8 * xr; foilMat.depthWrite = xr < 0.05;
        // the clocks beat: faster for "deprisa", slower once they are adjusted
        const ritmo = t >= T.DEPRISA - 0.2 && t < T.RELATIVIDAD ? 4 : t >= T.AJUSTAN ? 0.8 : 1.6;
        const latido = 0.65 + 0.35 * Math.sin(t * Math.PI * 2 * ritmo);
        relojMat.emissiveIntensity = 0.04 + 0.28 * xr * latido;
        nucleos.forEach((s) => (s.material.opacity = 0.28 * xr * latido));
        heroGlow.material.opacity = 0.35 * (0.6 + 0.4 * Math.sin(t * Math.PI * 2 * 1.6));
        satHero.position.y = heroGlow.position.y = 0.15 * Math.sin(t * 0.8);
        const emit = ventana(t, T.REPITE - 0.2, T.SENAL, 0.3);
        conchas.forEach((m, i) => {
          const f = frac(t * 0.55 + i / 3);
          m.scale.setScalar(0.5 + 5.5 * f); m.material.uniforms.op.value = emit * (1 - f) * 0.6;
        });
      }
      function updDiag(t) {
        const k = clamp((t - T.VIAJA) / (T.DECIMA + 0.6 - T.VIAJA));
        const viajando = k > 0 && k < 1;
        pulso.position.set(0, lerp(Y0, Y1, k), 0.3);
        pulso.material.opacity = viajando ? 0.9 : k >= 1 ? 0.9 * (1 - ramp(t, T.DECIMA + 0.6, T.DECIMA + 1.3)) : 0;
        ondaD.scale.setScalar(Math.max(0.01, (Y0 - Y1) * k)); ondaD.material.opacity = viajando ? 0.85 : 0;
        rayaMat.opacity = 0.25 + 0.5 * ventana(t, T.MIDE, T.CALCULA, 0.3);
        screenD.emissiveIntensity = 0.8 + 0.8 * ventana(t, T.DECIMA + 0.5, T.CALCULA, 0.2);
        const rv = ventana(t, T.RELATIVIDAD - 0.1, T.AJUSTAN, 0.2);
        latSat.material.opacity = rv * 0.75 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 3));
        latMovil.material.opacity = rv * 0.6 * (0.5 + 0.5 * Math.sin(t * Math.PI * 2 * 1));
      }
      function updMapa(t) {
        const esRegion = t >= T.SINO - 0.1;
        mapMat.emissiveMap = esRegion ? region.tex : ciudad.tex;
        // the region tile is bigger, so its far edge stays out of the shot
        plano.scale.setScalar(esRegion ? 1.8 : 1); canto.scale.set(esRegion ? 1.8 : 1, 1, esRegion ? 1.8 : 1);
        const k = esRegion ? clamp((t - T.CRECERIA) / (T.DIA2 + 0.4 - T.CRECERIA)) : ramp(t, T.ERROR, T.METROS + 0.2);
        const off = (esRegion ? DIR_R : DIR_C).clone().multiplyScalar((esRegion ? 10 : 7.5) * k);
        fantasma.position.set(off.x, 0.04, off.z);
        fantasma.visible = k > 0.02;
        const ph = frac(t * 0.8);
        real.children[0].scale.setScalar(1 + 0.25 * ph); fantasma.children[0].scale.setScalar(1 + 0.25 * ph);
        // dashed ruler between the real dot and the wrong one
        const len = off.length(), ang = Math.atan2(-off.z, off.x);
        for (let i = 0; i < 16; i++) {
          dummy.position.set(off.x * (i + 0.5) / 16, 0.06, off.z * (i + 0.5) / 16);
          dummy.rotation.set(0, ang, 0); dummy.scale.set(Math.max(0.001, (len / 16) * 0.55), 1, 1); dummy.updateMatrix(); regla.setMatrixAt(i, dummy.matrix);
        }
        regla.instanceMatrix.needsUpdate = true;
        reglaMat.opacity = k > 0.02 ? 0.85 : 0;
        reglaAnc.position.set(off.x * 0.5, 0.1, off.z * 0.5);
      }
      function updTierra(t) {
        const tri = t >= T.CON1 - 0.12 && t < T.EUROPA - 0.12 ? 1 : 0, wide = 1 - tri;
        // constellations (orbits drawn far faster than real: one turn per minute)
        const nVis = t < T.CON1 ? Math.round(31 * ramp(t, T.SATS - 0.4, T.SATS + 0.9)) : 31;
        GPS.sats.forEach((s, i) => { dummy.position.copy(posSat(GPS, i, t)); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(i < nVis ? 1 : 0.001); dummy.updateMatrix(); GPS.inst.setMatrixAt(i, dummy.matrix); });
        GPS.inst.instanceMatrix.needsUpdate = true;
        GPS.mat.opacity = wide; GPS.inst.visible = wide > 0; GPS.ringMat.opacity = 0.15 * wide * (t < T.CON1 ? ramp(t, T.AHI, T.SATS + 0.6) : 1);
        const gal = wide * ramp(t, T.GALILEO - 0.3, T.GALILEO + 0.5) * (t < T.RELATIVIDAD ? 1 : 0);
        GAL.sats.forEach((s, i) => { dummy.position.copy(posSat(GAL, i, t)); dummy.scale.setScalar(1); dummy.updateMatrix(); GAL.inst.setMatrixAt(i, dummy.matrix); });
        GAL.inst.instanceMatrix.needsUpdate = true;
        GAL.mat.opacity = gal; GAL.inst.visible = gal > 0.01; GAL.ringMat.opacity = 0.13 * gal;
        galAnc.position.copy(posSat(GAL, 3, t));
        destacado.position.copy(posSat(GPS, 2, t)); destacado.material.opacity = 0.8 * ventana(t, T.RELATIVIDAD, T.AJUSTAN, 0.2);
        // trilateration
        const g = [T.CON1, T.DOS, T.TRES, T.CUARTO].map((a) => ramp(t, a + 0.05, a + 1.2));
        esferas.forEach((m, i) => {
          m.scale.setScalar(Math.max(0.001, radios[i] * g[i]));
          m.material.uniforms.op.value = tri * (g[i] > 0.001 ? 0.6 + 0.6 * (1 - g[i]) : 0);
          m.visible = tri > 0 && g[i] > 0.001;
        });
        minis.forEach((m, i) => (m.visible = tri > 0 && (i < 3 || t >= T.CUARTO - 0.2)));
        esfAnc.position.copy(S[0]).add(v3(0.85, 0.1, 0.5).normalize().multiplyScalar(radios[0] * g[0]));
        aroMat.opacity = tri * ramp(t, T.CIRCULO - 0.2, T.CIRCULO + 0.5) * (1 - 0.5 * ramp(t, T.CUARTO, T.CUARTO + 1));
        const p2a = tri * ramp(t, T.QUEDAN, T.QUEDAN + 0.4) * (1 - ramp(t, T.CUARTO + 0.6, T.CUARTO + 1.5));
        p2Mat.opacity = p2a; p2Halo.material.opacity = 0.7 * p2a; p2.visible = p2a > 0.01;
        const tu = Math.max(ventana(t, T.ERES - 0.1, T.PERO, 0.3), ventana(t, T.CORREGIR - 0.4, T.EUROPA, 0.3));
        pinHalo.material.opacity = 0.55 + 0.45 * tu; pinHalo.scale.setScalar(1.2 + 1.4 * tu);
        pinMat.color.setHex(0x4d8bff);
      }

      // ---------- frame ----------
      function renderAt(t) {
        const cam = camAt(t);
        let act = "movil", best = Infinity;
        for (const k in SETS) { const d = SETS[k].c.distanceTo(cam.q); if (d < best) { best = d; act = k; } }
        for (const k in SETS) SETS[k].g.visible = k === act;
        const S0 = SETS[act];
        C.key.position.copy(S0.c).add(v3(-14, 30, 16).multiplyScalar(S0.s)); C.key.intensity = K0 * S0.s * S0.s * (S0.k ?? 1);
        C.warm.position.copy(S0.c).add(v3(6, 4, 6).multiplyScalar(S0.s)); C.warm.distance = 22 * S0.s; C.warm.intensity = W0 * S0.s * S0.s;
        if (bokeh) bokeh.uniforms.aperture.value = APER * S0.dof;
        ({ movil: updMovil, sat: updSat, diag: updDiag, mapa: updMapa, tierra: updTierra })[act](t);

        // data panels
        C.panel("envia", "NADA");
        C.panel("reloj", "¿?");
        C.panel("sats", String(Math.round(31 * ramp(t, T.SATS - 0.4, T.SATS + 0.9))));
        C.panel("alt", "20.200 km");
        const h = Math.max(0, t - T.HORA);
        C.panel("hora", "18:00:" + String(Math.floor(h) % 60).padStart(2, "0") + "," + String(Math.floor(frac(h) * 1e6)).padStart(6, "0"));
        C.panel("crono", coma(0.067 * clamp((t - T.VIAJA) / (T.DECIMA + 0.6 - T.VIAJA)), 3) + " s");
        C.panel("dist", "20.200 km");
        C.panel("err", "0,000001 s");
        C.panel("nsat", t < T.DOS ? "1" : t < T.TRES ? "2" : "3");
        C.panel("nsat4", "4");
        C.panel("gana", coma(0.000038 * clamp((t - T.GANAN) / (T.DIA1 + 0.3 - T.GANAN)), 6) + " s");
        C.panel("deriva", Math.round(10 * clamp((t - T.CRECERIA) / (T.DIA2 + 0.4 - T.CRECERIA))) + " km");

        C.mirar(cam);
        C.pintar(t);
      }

      C.arrancar(renderAt);
    </script>
  </body>
</html>
