          { "id": "div", "titulo": "ENTRE 2, QUINCE VECES", "desde": "DIVIDES", "hasta": "MANDA", "x": 330, "y": 470 }

          { "tipo": "pop", "en": "CHIP" },
          { "tipo": "brillo", "en": "DIAPASON" },
          { "tipo": "sube", "en": "ELEC" },
          { "tipo": "pop", "en": "DOBLA" },
          { "tipo": "chip", "en": "DEVUELVE" },
          { "tipo": "zumbido", "desde": "VIBRA", "hasta": "SALTA", "volumen": 0.5 },

    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};

    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { crearPorDentro } from "./comun/pordentro.js";

      const C = crearPorDentro(THREE);
      const { T, D, scene, v3, ramp, ventana, hash, canvasTex, brillo } = C;
      // 1 unit = 1 mm: a 42 mm watch, a quartz can of 6 mm; the key light is softer for such shiny, small metal
      C.key.intensity *= 0.4;
      const dummy = new THREE.Object3D();
      const acero = new THREE.MeshPhysicalMaterial({ color: 0xc9ccd2, metalness: 1, roughness: 0.28 });
      const tubo = (pts, r, mat) => new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, r, 8, false), mat);

      // ---------- watch: strap, case, bezel, dial, hands, glass ----------
      const reloj = new THREE.Group(); scene.add(reloj);
      const correa = new THREE.MeshPhysicalMaterial({ color: 0x2a1d16, roughness: 0.75, sheen: 0.4 });
      for (const s of [-1, 1]) { const c = new THREE.Mesh(new RoundedBoxGeometry(22, 3, 46, 3, 1.2), correa); c.position.set(0, 3, s * 40); reloj.add(c); }
      const caseMat = new THREE.MeshPhysicalMaterial({ color: 0xc9ccd2, metalness: 1, roughness: 0.4, transparent: true });
      // open at the top: a closed cylinder would put its metal lid over the dial
      const caja = new THREE.Mesh(new THREE.CylinderGeometry(21, 21.5, 9, 96, 1, true), caseMat); caja.position.y = 4.5; reloj.add(caja);
      caseMat.side = THREE.DoubleSide;
      const tapa = new THREE.Group(); reloj.add(tapa);
      const bisel = new THREE.Mesh(new THREE.TorusGeometry(20.3, 1.0, 16, 96), acero); bisel.rotation.x = Math.PI / 2; bisel.position.y = 9.2; tapa.add(bisel);
      const esfera = canvasTex(1024, 1024, () => {});
      const dialMat = new THREE.MeshStandardMaterial({ map: esfera.tex, roughness: 0.5, transparent: true });
      const dial = new THREE.Mesh(new THREE.CircleGeometry(19.6, 96), dialMat); dial.rotation.x = -Math.PI / 2; dial.position.y = 8.6; tapa.add(dial);
      const manoMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.3, metalness: 0.4 });
      const mano = (w, l, mat, y) => { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.25, l), mat); m.position.z = -l / 2 + 2; g.add(m); g.position.y = y; tapa.add(g); return g; };
      const horas = mano(1.4, 10, manoMat, 8.9), minutos = mano(1.0, 15, manoMat, 9.1);
      const segMat = new THREE.MeshStandardMaterial({ color: 0xff5a2a, roughness: 0.4, emissive: 0xff3a10, emissiveIntensity: 0.2 });
      const segundos = mano(0.4, 18, segMat, 9.3);
      // unlit: a lit glass top mirrors the spot light and turns the whole dial white
      const glassMat = new THREE.MeshBasicMaterial({ color: 0xdfe8f0, transparent: true, opacity: 0.06, depthWrite: false });
      const cristalTapa = new THREE.Mesh(new THREE.CylinderGeometry(19.8, 19.8, 0.6, 96), glassMat); cristalTapa.position.y = 9.8; tapa.add(cristalTapa);
      horas.rotation.y = -((10 + 9 / 60) / 12) * Math.PI * 2; minutos.rotation.y = -(9 / 60) * Math.PI * 2;

      // ---------- movement: plate, button cell, chip, quartz can with its tuning fork, stepping motor, gears ----------
      const mov = new THREE.Group(); reloj.add(mov);
      const placa = new THREE.Mesh(new THREE.CylinderGeometry(19, 19, 1, 96), new THREE.MeshStandardMaterial({ color: 0x1d3a2c, roughness: 0.6 })); placa.position.y = 1.2; mov.add(placa);
      const pilaMat = new THREE.MeshPhysicalMaterial({ color: 0x8e9198, metalness: 1, roughness: 0.45, emissive: 0x7fe0a0, emissiveIntensity: 0 });
      const pila = new THREE.Mesh(new THREE.CylinderGeometry(5.8, 5.8, 2.1, 64), pilaMat); pila.position.set(-8, 2.8, 5); mov.add(pila);
      const chipMat = new THREE.MeshPhysicalMaterial({ color: 0x141518, roughness: 0.3, metalness: 0.3, emissive: 0xffa040, emissiveIntensity: 0 });
      const chip = new THREE.Mesh(new THREE.BoxGeometry(4, 0.8, 4), chipMat); chip.position.set(7, 2.1, -3); mov.add(chip);
      const canMat = new THREE.MeshPhysicalMaterial({ color: 0xc9ccd2, metalness: 1, roughness: 0.3, transparent: true });
      const can = new THREE.Mesh(new THREE.CapsuleGeometry(1.1, 5, 8, 24), canMat); can.rotation.z = Math.PI / 2; can.position.set(6, 2.9, 6); mov.add(can);
      // tuning fork inside the can, along x: a base and two prongs that bend in z
      const cuarzoMat = new THREE.MeshPhysicalMaterial({ color: 0x8a9db3, roughness: 0.35, transparent: true, opacity: 0.9, emissive: 0xffd27a, emissiveIntensity: 0 });
      const horquilla = new THREE.Group(); horquilla.position.set(3.6, 2.9, 6); mov.add(horquilla);
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.35, 1.4), cuarzoMat); base.position.x = 0.7; horquilla.add(base);
      const puntas = [-1, 1].map((s) => { const g = new THREE.Group(); g.position.set(1.4, 0, s * 0.42); horquilla.add(g); const p = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.35, 0.42), cuarzoMat); p.position.x = 1.8; g.add(p); return g; });
      const cobre = new THREE.MeshPhysicalMaterial({ color: 0xc06a32, metalness: 1, roughness: 0.34, emissive: 0xff6a12, emissiveIntensity: 0 });
      mov.add(tubo([v3(5, 2.6, -2), v3(4.5, 2.7, 2), v3(4, 2.8, 5.4)], 0.18, cobre));
      // stepping motor: copper coil, steel stator, magnet rotor; three gears up to the hands
      const bobinaMat = new THREE.MeshPhysicalMaterial({ color: 0xc06a32, metalness: 1, roughness: 0.4, emissive: 0xff6a12, emissiveIntensity: 0 });
      const bobina = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 7, 40), bobinaMat);
      bobina.rotation.x = Math.PI / 2; bobina.position.set(-7, 3, -7); mov.add(bobina);
      const estator = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 11), acero); estator.position.set(-4.6, 2.5, -7.5); mov.add(estator);
      const rotor = new THREE.Group(); rotor.position.set(-3, 3, -12.5); mov.add(rotor);
      rotor.add(new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 1, 32), new THREE.MeshPhysicalMaterial({ color: 0x3a3d44, metalness: 0.8, roughness: 0.3 })));
      rotor.add(new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.05, 0.5), new THREE.MeshStandardMaterial({ color: 0xff5a2a })));
      const oro = new THREE.MeshPhysicalMaterial({ color: 0xd4b06a, metalness: 1, roughness: 0.35 });
      const engranajes = [[0.5, -9, 2.4], [2.4, -5.5, 3.2], [0, 0, 4.2]].map(([x, z, r], i) => {
        const g = new THREE.Group(); g.position.set(x, 3.6 + i * 0.6, z); mov.add(g);
        g.add(new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.4, 48), oro));
        for (let k = 0; k < 18; k++) { const a = (k / 18) * Math.PI * 2, tooth = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), oro); tooth.position.set((r + 0.2) * Math.cos(a), 0, (r + 0.2) * Math.sin(a)); g.add(tooth); }
        return g;
      });
      mov.add(tubo([v3(5, 2.6, -4.5), v3(0, 3, -6), v3(-4, 3.2, -5)], 0.18, cobre));
      // sparks for the electricity (chip <-> fork, chip -> motor)
      const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffb060, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      const NS = 24, sparks = new THREE.InstancedMesh(new THREE.SphereGeometry(0.22, 8, 6), sparkMat, NS); mov.add(sparks);
      const curva1 = new THREE.CatmullRomCurve3([v3(5, 2.6, -2), v3(4.5, 2.7, 2), v3(4, 2.8, 5.4)]);
      const curva2 = new THREE.CatmullRomCurve3([v3(5, 2.6, -4.5), v3(0, 3, -6), v3(-4, 3.2, -5)]);
      const halo = brillo("255,210,122"); halo.scale.set(10, 10, 1); halo.material.depthTest = false; horquilla.add(halo); halo.position.x = 3;

      C.pieza("pila", pila, v3(5.8, 1, 0));
      C.pieza("chip", chip, v3(2, 0.4, 0));
      C.pieza("cristal", can, v3(0, 1.1, 0));
      C.pieza("punta", puntas[1], v3(3.6, 0.2, 0.2));
      C.pieza("motor", bobina, v3(1.7, 0, 0));
      C.pieza("aguja", segundos, v3(0, 0.2, -14));

      // dial face: markers and a generic name
      function drawDial() {
        const g = esfera.g, w = 1024;
        const r = g.createRadialGradient(w / 2, w / 2, 40, w / 2, w / 2, w / 2); r.addColorStop(0, "#1b2230"); r.addColorStop(1, "#0d1118");
        g.fillStyle = r; g.fillRect(0, 0, w, w);
        g.translate(w / 2, w / 2);
        for (let i = 0; i < 60; i++) {
          g.save(); g.rotate((i / 60) * Math.PI * 2); g.fillStyle = i % 5 ? "rgba(255,255,255,0.5)" : "#ffffff";
          if (i % 5) g.fillRect(-2, -480, 4, 22); else g.fillRect(-7, -480, 14, 60);
          g.restore();
        }
        g.fillStyle = "rgba(255,255,255,0.7)"; g.font = "700 40px Inter"; g.textAlign = "center"; g.fillText("QUARTZ", 0, 200);
        g.setTransform(1, 0, 0, 1, 0, 0); esfera.tex.needsUpdate = true;
      }
      let dialDrawn = false;

      // ---------- story ----------
      const CAN = v3(6, 2.9, 6), CHIPP = v3(7, 2.1, -3), MOT = v3(-5, 3, -9), PILAP = v3(-8, 2.8, 5);
      const rel = (q, x, y, z) => ({ p: q.clone().add(v3(x, y, z)), q: q.clone() });
      const camAt = C.camara([
        { t: 0, ...rel(v3(0, 9, 2), -12, 80, 58) },
        { t: "ABRIR", mas: -0.3, ...rel(v3(0, 9, 2), -11, 74, 54) },
        { t: "ABRIR", mas: 0.7, ...rel(v3(0, 10, 0), -55, 75, 100) },
        { t: "PILA", mas: -0.3, ...rel(v3(0, 10, 0), -52, 72, 96) },
        { t: "PILA", mas: 0.4, ...rel(PILAP, -16, 30, 32) },
        { t: "CHIP", mas: -0.3, ...rel(PILAP, -15, 28, 30) },
        { t: "CHIP", mas: 0.4, ...rel(CHIPP, -14, 26, 28) },
        { t: "DIAPASON", mas: -0.3, ...rel(CHIPP, -13, 24, 26) },
        { t: "CUARZO", mas: -0.2, corte: true, ...rel(CAN, -6, 12, 18) },
        { t: "ELEC", mas: -0.3, ...rel(CAN, -5, 11, 17) },
        { t: "ELEC", mas: 0.4, ...rel(v3(5, 2.8, 2), -9, 14, 20) },
        { t: "VIBRA", mas: -0.3, ...rel(v3(5, 2.8, 2), -8, 13, 18) },
        { t: "VIBRA", mas: 0.2, corte: true, ...rel(v3(6.5, 2.9, 6), -2, 9, 16) },
        { t: "CONTANDO", mas: -0.3, ...rel(v3(6.5, 2.9, 6), -1.5, 8.5, 15) },
        { t: "CONTANDO", mas: 0.3, corte: true, ...rel(v3(3, 2.6, 0), -14, 26, 30) },
        { t: "MOTOR", mas: -0.3, ...rel(v3(3, 2.6, 0), -13, 25, 28) },
        { t: "MOTOR", mas: 0.2, corte: true, ...rel(MOT, -12, 18, 20) },
        { t: "AGUJA", mas: -0.3, ...rel(MOT, -11, 17, 19) },
        { t: "AGUJA", mas: 0.4, ...rel(v3(0, 26, -4), -10, 42, 34) },
        { t: "SALTA", mas: 0.3, ...rel(v3(0, 9, -3), -10, 70, 50) },
        { t: "QUINCE", mas: -0.4, ...rel(v3(0, 9, -3), -11, 66, 47) },
        { t: "QUINCE", mas: -0.1, corte: true, ...rel(v3(0, 5, 0), -40, 70, 95) },
        { t: "PILA2", mas: -0.3, ...rel(v3(0, 5, 0), -38, 67, 90) },
        { t: "PILA2", mas: 0.2, corte: true, ...rel(PILAP, -16, 34, 34) },
        { t: "NUMERO2", mas: -0.3, ...rel(PILAP, -15, 32, 32) },
        { t: "NUMERO2", mas: 0.2, corte: true, ...rel(CHIPP, -10, 18, 20) },
        { t: "MANDA", mas: -0.3, ...rel(CHIPP, -9, 17, 19) },
        { t: "MANDA", mas: 0.1, corte: true, ...rel(v3(0, 9, 2), -14, 84, 64) },
        { t: D, ...rel(v3(0, 9, 2), -12, 78, 58) },
      ]);

      // thousands with a dot always (toLocaleString leaves 8192 without it in Spanish)
      const miles = (x) => String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

      // ---------- frame ----------
      function renderAt(t) {
        if (!dialDrawn) { drawDial(); dialDrawn = true; }
        // the dial with the hands lifts while explaining; the watch closes for "salta" and the end
        const open = ventana(t, T.ABRIR, T.SALTA, 0.9);
        tapa.position.y = 16 * open; tapa.rotation.x = -0.12 * open;
        const xray = Math.max(ventana(t, T.PILA2 - 0.2, T.NUMERO2 + 0.2, 0.4), ventana(t, T.NUMERO2, T.MANDA, 0.4));
        dialMat.opacity = 1 - 0.85 * xray; caseMat.opacity = 1 - 0.8 * Math.max(open, xray);
        caseMat.depthWrite = caseMat.opacity > 0.95; dialMat.depthWrite = dialMat.opacity > 0.95;
        // second hand: one step every whole second, as a real quartz watch
        segundos.rotation.y = -(Math.floor(t) / 60) * Math.PI * 2;
        segMat.emissiveIntensity = 0.2 + 0.6 * ventana(t, T.AGUJA, T.QUINCE, 0.3);

        // electricity: chip -> fork at "electricidad", fork -> chip at "devuelve", chip -> motor with every pulse
        const toFork = ventana(t, T.ELEC, T.DOBLA + 0.4, 0.2), back = ventana(t, T.DEVUELVE, T.EMPUJON, 0.2);
        const vib = ramp(t, T.EMPUJON, T.VIBRA + 0.3);
        const pulseT = t % 1, toMotor = t >= T.PULSO && t < T.SALTA ? ventana(pulseT, 0, 0.35, 0.05) : 0;
        sparkMat.opacity = Math.max(toFork, back, toMotor, vib * 0.35 * (t < T.CONTANDO ? 1 : 0));
        for (let i = 0; i < NS; i++) {
          const u = ((i / NS) + t * 0.9) % 1;
          const pos = toMotor > 0 ? curva2.getPointAt(Math.min(1, (pulseT / 0.35 + (i / NS) * 0.3) % 1)) : curva1.getPointAt(back > 0 ? 1 - u : u);
          dummy.position.copy(pos); dummy.scale.setScalar(0.8 + 0.4 * hash(i)); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); sparks.setMatrixAt(i, dummy.matrix);
        }
        sparks.instanceMatrix.needsUpdate = true;
        cobre.emissiveIntensity = 0.5 * Math.max(toFork, back, toMotor);
        chipMat.emissiveIntensity = 0.8 * Math.max(ventana(t, T.CHIP, T.DIAPASON, 0.3), back, ventana(t, T.CONTANDO, T.SALTA, 0.3) * (0.5 + 0.5 * toMotor), ventana(t, T.DIVIDES, T.MANDA, 0.3));
        bobinaMat.emissiveIntensity = 0.6 * toMotor;
        pilaMat.emissiveIntensity = 0.08 * Math.max(ventana(t, T.PILA, T.CHIP, 0.3), ventana(t, T.PILA2, T.NUMERO2, 0.3));

        // the quartz fork: the can turns to x-ray, it bends once, then vibrates (drawn much slower than real)
        const see = ventana(t, T.CUARZO - 0.3, T.SALTA, 0.4);
        canMat.opacity = 1 - 0.8 * see; canMat.depthWrite = see < 0.05;
        const bend = 0.09 * ramp(t, T.DOBLA - 0.1, T.DOBLA + 0.3) * (1 - ramp(t, T.DEVUELVE, T.DEVUELVE + 0.5));
        const osc = vib * 0.07 * Math.sin(t * 2 * Math.PI * 3.2);
        puntas.forEach((p, i) => (p.rotation.y = (i ? -1 : 1) * (bend + osc)));
        cuarzoMat.emissiveIntensity = 0.03 * see + 0.14 * Math.max(toFork, back, vib * (0.6 + 0.4 * Math.abs(Math.sin(t * 2 * Math.PI * 3.2))));
        halo.material.opacity = 0.12 * vib * see;

        // stepping motor: half a turn per pulse; gears follow
        const steps = t >= T.PASO ? Math.floor(t) - Math.floor(T.PASO) + ramp(t % 1, 0, 0.15) : 0;
        rotor.rotation.y = steps * Math.PI;
        engranajes.forEach((g, i) => (g.rotation.y = (steps * (i % 2 ? -0.35 : 0.2)) / (i + 1)));

        // panels: the open question "¿?", then the figure, the count, the drift, the battery, and the halving
        C.panel("vib", t < T.RITMO ? "¿?" : "32.768");
        C.panel("cuenta", miles(Math.floor((t % 1) * 32768)));
        C.panel("deriva", "± 15 s");
        C.panel("pila", "1 a 3 años");
        const n = Math.max(0, Math.min(15, Math.floor((t - T.DIVIDES) / Math.max(0.12, (T.UNO - T.DIVIDES) / 15))));
        C.panel("div", miles(32768 / 2 ** n));

        C.mirar(camAt(t));
        C.pintar(t);
      }

      C.arrancar(renderAt);
    </script>
