        const f3 = ramp(t, T.CENTRADO - 0.05, T.CENTRADO + 0.5);
        let field = Math.max(f1, f2, f3);
        field *= 1 + 0.5 * ventana(t, T.SUBE, T.BAJA, 0.25) - 0.45 * ventana(t, T.BAJA, T.BAJA + 1.4, 0.25);
        const leak = ventana(t, T.CENTRADO, T.CAIGA, 0.4);
        const answering = ventana(t, T.CONTESTA, T.SUBE, 0.2), blink = morse(t, T.CONTESTA);
        const show = field * (1 - ramp(t, T.MANDA - 0.2, T.MANDA + 0.5)) * (1 - answering * 0.55 * (1 - blink));
        const yTop = pp.y + 0.08, coilC = movil.localToWorld(v3(0, 0.08, 0));
        rings.forEach((ring, i) => {
          const ph = ((0.5 * t + i / NR) % 1 + 1) % 1;
          const r = lerp(1.0, 2.4 + 1.8 * leak, ph);
          ring.scale.set(r, r, 1);
          ring.position.set(lerp(0, coilC.x, ph * (1 - leak)), lerp(0.8, yTop, ph), lerp(0, coilC.z, ph * (1 - leak)));
          ringMat[i].opacity = show * Math.sin(Math.PI * ph) * 0.75 * (1 - 0.4 * leak);
        });
        campoAnc.position.set(1.9, (0.9 + yTop) / 2, 0.4);
        const pk = ping(t);
        pingMat.opacity = pk >= 0 ? (1 - pk) * 0.9 : 0;
        pingRing.scale.setScalar(1 + 2.4 * Math.max(0, pk)); pingRing.position.set(0, 0.9 + 1.4 * Math.max(0, pk), 0);

        // coils: the base glows while it sends, the phone coil when it receives (less when off-centre)
        const flash = ramp(t, T.BOBINA, T.BOBINA + 0.25) * (1 - ramp(t, T.BOBINA + 1.0, T.BOBINA + 1.7));
        cobreBase.emissiveIntensity = Math.max(0.55 * flash, 0.35 * field * (0.85 + 0.15 * Math.sin(t * 9)), pk >= 0 ? 0.5 * (1 - pk) : 0);
        const recv = clamp(field) * (1 - 0.6 * leak) * (1 - answering * 0.6 * (1 - blink));
        const flashM = ramp(t, T.OTRA, T.OTRA + 0.25) * (1 - ramp(t, T.OTRA + 1.0, T.OTRA + 1.7));
        cobreMovil.emissiveIntensity = Math.max(0.55 * flashM, 0.5 * recv * ramp(t, T.CORRIENTE, T.CORRIENTE + 0.5));
        const cur = recv * ramp(t, T.CORRIENTE, T.CORRIENTE + 0.5) * (1 - ramp(t, T.MANDA - 0.2, T.MANDA + 0.4));
        sparkMat.opacity = cur;
        for (let i = 0; i < NP; i++) {
          const u = (((i / NP) + t * 0.08) % 1 + 1) % 1;
          dummy.position.copy(espMovil.getPointAt(u)); dummy.position.y += 0.03;
          const s = cur * (0.8 + 0.5 * hash(i)); dummy.scale.set(s, s, s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
          sparks.setMatrixAt(i, dummy.matrix);
        }
        sparks.instanceMatrix.needsUpdate = true;
        const trace = ventana(t, T.CARACOL - 0.3, T.OTRA, 0.3);
        const head = clamp((t - T.CARACOL + 0.3) / 1.8);
        cometMat.opacity = trace;
        for (let i = 0; i < NC; i++) {
          dummy.position.copy(espBase.getPointAt(Math.max(0, head - i * 0.006))); dummy.position.y += 0.04;
          const s = trace * (1 - i / NC); dummy.scale.set(s, s, s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
          comet.setMatrixAt(i, dummy.matrix);
        }
        comet.instanceMatrix.needsUpdate = true;
        chipMat.emissiveIntensity = 0.9 * ventana(t, T.CHIP - 0.1, T.BATERIA + 0.4, 0.25) + 0.25 * cur;
        fillMat.opacity = 0.55 * ventana(t, T.BATERIA - 0.1, T.EMPEZAR, 0.3) * (0.8 + 0.2 * Math.sin(t * 6));
        fill.scale.z = 0.4 + 0.6 * ramp(t, T.BATERIA, T.BATERIA + 1.5); fill.position.z = 2.5 + 3.9 * (1 - fill.scale.z);

        // the coin: falls on the base, nobody answers, it would heat up; then it goes
        const drop = ramp(t, T.MONEDA - 0.15, T.MONEDA + 0.25), gone = ramp(t, T.CENTRADO - 1.4, T.CENTRADO - 0.7);
        const cp = v3(0.4, lerp(5.5, 1.16, drop), 0.6);
        cp.y += drop >= 1 ? Math.max(0, Math.sin((t - T.MONEDA - 0.25) * 12)) * 0.25 * Math.exp(-(t - T.MONEDA - 0.25) * 6) : 0;
        cp.lerp(v3(14, 4, 6), gone);
        coin.position.copy(cp); coin.visible = t > T.MONEDA - 0.2 && gone < 1;
        const hot = ventana(t, T.CALIENTA - 0.1, T.CALIENTA + 1.8, 0.4) * (1 - gone);
        coinMat.emissiveIntensity = 0.9 * hot;
        heatCoin.position.copy(cp).add(v3(0, 0.4, 0)); heatCoin.material.opacity = 0.7 * hot;

        // heat from the coils when they are not aligned
        const heat = ventana(t, T.CALOR - 0.2, T.IMANES + 0.4, 0.5) * (0.75 + 0.25 * Math.sin(t * 4));
        heatA.position.copy(coilC).add(v3(0, 0.5, 0)); heatB.position.set(0, 1.2, 0);
        heatA.material.opacity = 0.55 * heat; heatB.material.opacity = 0.45 * heat;

        // magnets light up, then pull the phone to the centre
        const mag = ventana(t, T.IMANES - 0.1, T.MANDA, 0.3);
        imanBase.emissiveIntensity = 0.9 * mag; imanMovil.emissiveIntensity = 0.9 * mag;

        // LED: white while charging, amber with each test ping, red when nobody answers
        const red = ventana(t, T.NADIE, T.CENTRADO - 0.8, 0.2);
        if (red > 0.5) ledMat.color.setRGB(1, 0.15, 0.1);
        else if (pk >= 0) ledMat.color.setRGB(1, 0.6, 0.2).multiplyScalar(1 - 0.7 * pk);
        else if (field > 0.2) ledMat.color.setRGB(0.85, 1, 0.9);
        else ledMat.color.setRGB(0.25, 0.25, 0.25);

        // screen
        const cargando = (t >= T.TAP && t < T.EMPEZAR) || (t >= T.CONTESTA && t < T.MONEDA - 1.2) || t >= T.CENTRADO;
        const pct = Math.floor(34 + 7 * t / D);
        if (pct + "" + cargando !== screenKey) { drawScreen(pct, cargando); screenKey = pct + "" + cargando; }

        // finger
        let away = 12;
        for (const [a0, a1, b0, b1h] of HOLD) away = Math.min(away, 12 * (1 - ramp(t, a0, a1)) + 12 * ramp(t, b0, b1h));
        F.colocar(movil.localToWorld(v3(1.9, 0.82, 4.2)), v3(0.7, 0.7, -0.1), away);

        C.mirar(camAt(t));
        C.pintar(t);
      }

      C.arrancar(renderAt);
    </script>
