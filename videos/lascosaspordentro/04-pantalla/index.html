    <script type="module">

      const tipMat = new THREE.MeshPhysicalMaterial({ color: 0xd6d8dc, metalness: 1, roughness: 0.35 });

      // a sausage, its round tip at the group's origin
      const salchicha = new THREE.Group(); scene.add(salchicha);
      const sMesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.85, 9, 8, 24), new THREE.MeshPhysicalMaterial({ color: 0xb4553a, roughness: 0.45, clearcoat: 0.5 }));
      sMesh.position.y = 5.35; salchicha.add(sMesh);
      function colocarSalchicha(contact, dir, away) {
        const d = dir.clone().normalize(), z = UP.clone().sub(d.clone().multiplyScalar(d.dot(UP))).normalize(), x = new THREE.Vector3().crossVectors(d, z).normalize();

      const DIR = v3(0.75, 0.62, 0.2), DIR2 = v3(0.62, 0.62, 0.48);

      // label anchors
      const toqueAnc = new THREE.Object3D(), marcaAnc = new THREE.Object3D(); scene.add(toqueAnc, marcaAnc);
      C.pieza("cristal", glass, v3(3.4, 0.05, 2.0));
      C.pieza("rejilla", grid, v3(colX(7), 0, rowZ(4)));
      C.pieza("cruce", grid, v3(colX(6), 0, rowZ(9)));
      C.pieza("chip", chip, v3(0.7, 0.1, 0));
      C.pieza("toque", toqueAnc, v3(0, 0, 0));
      C.pieza("marca", marcaAnc, v3(0, 0, 0));
      C.pieza("gota", drops[1], v3(0.5, 0, 0));

      // display: a photo-like landscape that can zoom, and a ripple where it is touched
      function drawScreen(zoom) {
        const g = scr.g, w = 680, h = 1460;
        g.save(); g.translate(w / 2, h * 0.55); g.scale(zoom, zoom); g.translate(-w / 2, -h * 0.55);
        const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, "#1d3a5c"); sky.addColorStop(0.55, "#d9895a"); sky.addColorStop(1, "#2a2230");
        g.fillStyle = sky; g.fillRect(-w, -h, 3 * w, 3 * h);
        g.fillStyle = "#ffd59a"; g.beginPath(); g.arc(w * 0.62, h * 0.47, 70, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#3b2f45"; g.beginPath(); g.moveTo(-w, h * 0.62); g.lineTo(w * 0.2, h * 0.42); g.lineTo(w * 0.45, h * 0.56); g.lineTo(w * 0.75, h * 0.38); g.lineTo(2 * w, h * 0.6); g.lineTo(2 * w, 2 * h); g.lineTo(-w, 2 * h); g.fill();
        g.fillStyle = "#1f1a28"; g.beginPath(); g.moveTo(-w, h * 0.72); g.lineTo(w * 0.35, h * 0.6); g.lineTo(2 * w, h * 0.74); g.lineTo(2 * w, 2 * h); g.lineTo(-w, 2 * h); g.fill();
        g.restore();
        g.fillStyle = "rgba(255,255,255,0.9)"; g.font = "700 64px Inter"; g.textAlign = "center"; g.fillText("20:00", w / 2, 120);
        scr.tex.needsUpdate = true;
      }
      let zoomKey = -1;
      const rippleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      const ripple = new THREE.Mesh(new THREE.TorusGeometry(1, 0.04, 8, 64), rippleMat); ripple.rotation.x = Math.PI / 2; movil.add(ripple);
      const glow = brillo("255,170,90"); glow.scale.set(1.6, 1.6, 1); glow.material.depthTest = false; movil.add(glow);

      // ---------- story ----------
      // touch points on the screen (x, z), in cm from the centre
      const P1 = [1.0, 1.5], P2 = [-0.9, -1.8], P3 = [0.4, 0.6], P4 = [0.6, 2.6], P5 = [-0.5, 1.2], P6 = [0.8, -0.6];
      const camAt = C.camara([
        { t: 0, p: v3(-4, 17, 15), q: v3(0.5, 1, 1.0) },
        { t: "QUITAR", mas: -0.3, p: v3(-4.4, 16.4, 14.4), q: v3(0.5, 1, 1.0) },
        { t: "QUITAR", mas: 0.7, p: v3(-13, 7.5, 12), q: v3(0, 2.2, 0) },
        { t: "REJILLA", mas: -0.2, p: v3(-12.4, 7.4, 11.6), q: v3(0, 2.2, 0) },
        { t: "REJILLA", mas: 0.6, p: v3(-3, 20, 8), q: v3(0, 2.2, 0.5) },
        { t: "CRUCE", mas: -0.3, p: v3(-2.8, 19.4, 7.8), q: v3(0, 2.2, 0.5) },
        { t: "CRUCE", mas: 0.5, p: v3(-2, 13, 7), q: v3(-0.5, 2.2, -1) },
        { t: "ACERCAR", mas: -0.5, p: v3(-1.8, 12.6, 6.8), q: v3(-0.5, 2.2, -1) },
        { t: "ACERCAR", mas: 0.4, p: v3(-9, 11, 10), q: v3(-0.9, 2.6, -1.8) },
        { t: "CHIP", mas: -0.4, p: v3(-8.6, 10.6, 9.6), q: v3(-0.9, 2.6, -1.8) },
        { t: "CHIP", mas: 0.4, p: v3(-3, 18, 11), q: v3(0, 2.2, 1.5) },
        { t: "VARIOS", mas: -0.4, p: v3(-2.8, 17.4, 10.6), q: v3(0, 2.2, 1.5) },
        { t: "VARIOS", mas: 0.4, p: v3(-4, 18, 13), q: v3(0.4, 2.5, 0.6) },
        { t: "GUANTES", mas: -0.4, p: v3(-3.8, 17.6, 12.6), q: v3(0.4, 2.5, 0.6) },
        { t: "GUANTES", mas: 0.4, p: v3(-6, 13, 12), q: v3(0.6, 2.8, 2.6) },
        { t: "MOJADA", mas: -0.4, p: v3(-5.8, 12.6, 11.6), q: v3(0.6, 2.8, 2.6) },
        { t: "MOJADA", mas: 0.4, p: v3(-3, 17, 12), q: v3(0, 3, 0.6) },
        { t: "COREA", mas: -0.2, p: v3(-2.8, 16.6, 11.6), q: v3(0, 3, 0.6) },
        { t: "COREA", mas: 0.6, p: v3(-6, 13, 12), q: v3(-0.5, 3, 1.2) },
        { t: "APRETAR", mas: -0.3, p: v3(-5.8, 12.6, 11.6), q: v3(-0.5, 3, 1.2) },
        { t: "APRETAR", mas: 0.4, p: v3(-7, 12, 12), q: v3(0.4, 3.4, -0.4) },
        { t: "MANDA", mas: -0.2, p: v3(-6.6, 11.6, 11.6), q: v3(0.4, 3.4, -0.4) },
        { t: "MANDA", mas: 0.9, p: v3(-4, 17, 15), q: v3(0.5, 1, 1.0) },

      ].map((k) => ({ ...k, p: k.q.clone().add(k.p.clone().sub(k.q).multiplyScalar(1.7)) })));

      // ---------- frame ----------
      function renderAt(t) {
        // exploded view: grid and glass rise while explaining, and close at the end

        const faint = 1 - 0.75 * ventana(t, T.LUZ, T.CRUCE, 0.4);

        // 2. one finger takes part of the field

        // 3. two fingers, pinch to zoom

        const PA = [P3[0] - 0.9 - 0.9 * pinch, P3[1] - 1.2 - 1.2 * pinch], PB = [P3[0] + 0.9 + 0.9 * pinch, P3[1] + 1.2 + 1.2 * pinch];
        if (a3 > 0) { add(PA[0], PA[1], a3, true); add(PB[0], PB[1], a3, true); }
        // 4. glove (does not conduct), then glove with metal threads

        if (a4 > 0) add(P4[0], P4[1], a4, false);
        if (a5 > 0) add(P4[0], P4[1], a5, true);

        if (wetSig > 0) DROPS.forEach(([x, z]) => touches.push({ x, z, k: wetSig, conduce: true }));

        if (a6 > 0) add(P5[0], P5[1], a6, true);
        if (a7 > 0) add(P6[0], P6[1], a7, true);

        const fShow = ramp(t, T.CRUCE - 0.2, T.CRUCE + 0.5) * ex;
        fieldMat.opacity = fShow * 0.9;
        let k = 0;
        for (let r = 0; r < NROW; r++) for (let c = 0; c < NCOL; c++) {
          let drain = 0;
          for (const q of touches) if (q.conduce) drain += q.k * Math.exp(-((colX(c) - q.x) ** 2 + (rowZ(r) - q.z) ** 2) / 0.9);
          const s = Math.max(0.05, 1 - 0.85 * Math.min(1, drain)) * (0.8 + 0.2 * Math.sin(t * 3 + r + c));

        });

        // fingers and the sausage on the glass
        const glassPt = (x, z) => movil.localToWorld(v3(x, top, z));
        const awayOf = (a) => (1 - a) * 9;
        const gloved = a4 > 0 || a5 > 0;
        F1.finger.children[0].material = gloved ? glove : skin; nail.visible = !gloved; tip.visible = a5 > 0;
        let f1 = null;
        if (a1 > 0) f1 = [P1, a1]; else if (a2 > 0) f1 = [P2, a2]; else if (a3 > 0) f1 = [PB, a3];
        else if (a4 > 0) f1 = [P4, a4]; else if (a5 > 0) f1 = [P4, a5]; else if (a7 > 0) f1 = [P6, a7];
        if (f1) F1.colocar(glassPt(f1[0][0], f1[0][1]), DIR, awayOf(f1[1]));
        else F1.colocar(glassPt(0, 0), DIR, 12);
        if (a3 > 0) F2.colocar(glassPt(PA[0], PA[1]), DIR2, awayOf(a3));
        else F2.colocar(glassPt(0, 0), DIR2, 12);
        colocarSalchicha(glassPt(P5[0], P5[1]), v3(0.6, 0.7, 0.4), a6 > 0 ? awayOf(a6) : 12);
        if (lead) toqueAnc.position.copy(glassPt(lead.x, lead.z).add(v3(0.6, 0.3, 0)));

        const tq = conductors.find((q) => q.k > 0.5);
        if (tq) { const ph = (t * 1.6) % 1; ripple.position.set(tq.x, 0.82, tq.z); ripple.scale.setScalar(0.4 + 1.6 * ph); rippleMat.opacity = (1 - ph) * 0.6; glow.position.set(tq.x, 0.9, tq.z); glow.material.opacity = 0.25; }

        screenMat.emissiveIntensity = 0.7 * (1 - 0.35 * ex);

        C.mirar(camAt(t));
        C.pintar(t);
      }

      C.arrancar(renderAt);
