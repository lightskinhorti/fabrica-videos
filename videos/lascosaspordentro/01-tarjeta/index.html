        if (lift > 0) { p.lerp(C2.p, lift); p.y += Math.sin(lift * Math.PI) * 0.9; yaw = lerp(yaw, C2.yaw, lift); }
        p.y += lift >= 1 ? Math.sin((t - T.ACERCAR) * 1.6) * 0.04 : 0;
        const aside = ventana(t, T.SEGUNDO - 0.1, T.CERCA + 0.4, 0.6);
        const up = ramp(t, T.CERCA + 0.2, T.CERCA + 1.1), down = ramp(t, T.LEERLA - 0.2, T.LEERLA + 0.9);
        p.add(AWAY.clone().multiplyScalar(aside));
        // 2.6 cm over the reader -> 7.5 cm (too far) -> 4 cm
        p.y += 4.9 * up * (1 - down) + 1.4 * down;
        const leave = ramp(t, T.ESPANA - 0.2, T.ESPANA + 0.9), back = ramp(t, T.PIN + 2.0, T.PIN + 3.2);
        p.add(AWAY.clone().multiplyScalar(1.6 * leave));
        p.lerp(CF.p, back); yaw = lerp(yaw, CF.yaw, back);
        card.position.copy(p);
        card.rotation.set(Math.sin(lift * Math.PI) * -0.12 * (1 - back), yaw, 0);

        // cutaway: the top layer lifts, then stays as an x-ray until the card leaves
        const open = ramp(t, T.ABRIR, T.ABRIR + 1.1);
        const settle = ramp(t, T.DATAFONO - 0.6, T.DATAFONO + 0.4);
        const close = ramp(t, T.ESPANA, T.ESPANA + 1.0);
        topGroup.position.y = LT + 1.9 * open * (1 - settle);
        topGroup.rotation.z = 0.06 * open * (1 - settle);
        const op = lerp(lerp(1, lerp(0.3, 0.14, settle), open), 1, close);
        topMat.opacity = op; coreMat.opacity = op; topMat.depthWrite = op > 0.95;
        topMat.emissive.setHex(0x8a919c); topMat.emissiveIntensity = (0.12 * open * (1 - settle) + 0.05 * settle) * (1 - close);
        topMat.clearcoat = lerp(0.8, 0.1, open * (1 - close));
        top.castShadow = op > 0.6;
        plateGroup.position.y = 0.9 * ventana(t, T.CHIP - 0.2, T.DATAFONO, 0.5);

        // the copper flashes when named, and a comet traces its turns
        const flash = ramp(t, T.COBRE, T.COBRE + 0.25) * (1 - ramp(t, T.COBRE + 1.0, T.COBRE + 1.7));
        const trace = ventana(t, T.VUELTAS - 0.1, T.CHIP, 0.3);
        const head = Math.min(1, Math.max(0, (t - T.VUELTAS) / (T.ANTENA - T.VUELTAS + 0.4)));
        cometMat.opacity = trace;
        for (let i = 0; i < NC; i++) {
          dummy.position.copy(coilCurve.getPointAt(Math.max(0, head - i * 0.005))); dummy.position.y += 0.02;
          const s = trace * (1 - i / NC); dummy.scale.set(s, s, s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
          comet.setMatrixAt(i, dummy.matrix);
        }
        comet.instanceMatrix.needsUpdate = true;

        // the terminal turns to x-ray to show its antenna, then the field rises from it
        const xr = ventana(t, T.ANTENA2 - 0.2, T.ACERCAR, 0.6);
        termMat.opacity = 1 - 0.78 * xr; termMat.depthWrite = xr < 0.05; body.castShadow = xr < 0.4;
        const field1 = ramp(t, T.CAMPO, T.CAMPO + 0.6) * (1 - ramp(t, T.SEGUNDO + 0.3, T.SEGUNDO + 1.0));
        const field2 = ventana(t, T.CERCA, T.ESPANA + 0.4, 0.5);
        const field = Math.max(field1, field2);
        termCopper.emissiveIntensity = 0.25 * xr + 0.45 * field * (0.85 + 0.15 * Math.sin(t * 9));
        const answering = ventana(t, T.CONTESTA, T.CODIGO, 0.2);
        const blink = morse(t);
        const phase = 0.42 * (t - T.CAMPO) + 0.9 * Math.max(0, t - T.VECES);
        rings.forEach((ring, i) => {
          const ph = ((phase + i / NR) % 1 + 1) % 1, r = 1.2 + ph * 5.2;
          ring.scale.set(r, r, 1); ring.position.set(0, 1.7 + ph * 4.2, -3.7);
          ringMat[i].opacity = field * Math.sin(Math.PI * ph) * 0.6 * (1 - answering * 0.5 * (1 - blink));
        });

        // current in the copper: when the card is over the reader, and again at 4 cm (not at 9 cm)
        const cur1 = ramp(t, T.CORRIENTE, T.CORRIENTE + 0.5) * (1 - ramp(t, T.SEGUNDO + 0.3, T.SEGUNDO + 1.0));
        const cur2 = ramp(t, T.LEERLA + 0.4, T.LEERLA + 0.9) * (1 - ramp(t, T.ESPANA - 0.3, T.ESPANA + 0.3));
        const cur = Math.max(cur1, cur2);
        copper.emissiveIntensity = Math.max(0.5 * flash, 0.55 * cur * (0.85 + 0.15 * Math.sin(t * 9)));
        sparkMat.opacity = cur;
        for (let i = 0; i < NP; i++) {
          const u = (((i / NP) + (t - T.CORRIENTE) * 0.11) % 1 + 1) % 1;
          dummy.position.copy(coilCurve.getPointAt(u)); dummy.position.y += 0.02;
          const s = cur * (0.8 + 0.5 * hash(i)); dummy.scale.set(s, s, s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
          sparks.setMatrixAt(i, dummy.matrix);
        }
        sparks.instanceMatrix.needsUpdate = true;
        const chipOn = Math.max(ramp(t, T.ENCIENDE, T.ENCIENDE + 0.3) * (1 - ramp(t, T.SEGUNDO + 0.3, T.SEGUNDO + 1.0)), cur2);
        const chipGlow = chipOn * lerp(1, 0.25 + 0.75 * blink, answering);
        gold.emissiveIntensity = 0.55 * chipGlow + 0.3 * ventana(t, T.DORADOS, T.DATAFONO, 0.3) * (0.7 + 0.3 * Math.sin(t * 5));
        dieMat.emissiveIntensity = 0.8 * chipGlow;
        halo.material.opacity = chipGlow * (0.6 + 0.08 * Math.sin(t * 7));

        // the code: born above the chip, a copy appears and is crossed out, the real one flies into the reader
        card.updateMatrixWorld();
        const chipW = card.localToWorld(v3(CHIP.x, LT, CHIP.z));
        const born = ramp(t, T.CODIGO, T.CODIGO + 0.8), into = ramp(t, T.SEGUNDO - 0.5, T.SEGUNDO + 0.1);
        code.position.copy(chipW.clone().add(v3(0, 0.5 + 1.3 * born, 0)).lerp(R.clone().add(v3(0, 0.4, 0)), into));
        code.material.opacity = born * (1 - ramp(t, T.SEGUNDO - 0.05, T.SEGUNDO + 0.15));
        code.scale.set(2.0 * (1 - 0.6 * into), 0.5 * (1 - 0.6 * into), 1);
        copy.position.copy(chipW.clone().add(v3(2.0, 0.9, 0.8)));
        copy.material.opacity = ventana(t, T.COPIA, T.SEGUNDO + 0.2, 0.3);

        // the gauge grows from the screen up to the card, 4 cm
        const g = ventana(t, T.CENTIMETROS - 0.3, T.ESPANA, 0.3), gh = 4 * ramp(t, T.CENTIMETROS - 0.3, T.CENTIMETROS + 0.3);
        gaugeMat.opacity = g; bar.scale.set(1, Math.max(0.001, gh), 1); bar.position.y = gh / 2;
        ticks[0].position.y = 0; ticks[1].position.y = gh;

        // screen
        const pressed = tp.filter((x) => t >= x).length;
        let st = "listo", dots = 0;
        if (t >= tp[3] + 0.6) st = "pagado";
        else if (t >= T.ESPANA) { st = "pin"; dots = pressed; }
        else if (t >= T.CERCA) st = "importe";
        else if (t >= T.SEGUNDO) st = "pagado";
        else if (t >= T.CONTESTA) st = "leyendo";
        else if (t >= T.IMPORTE) st = "importe";
        if (st + dots !== screenKey) { drawScreen(st, dots); screenKey = st + dots; }
        screen.material.emissiveIntensity = 0.85 * (1 - 0.35 * xr);

        // finger: taps the card, pushes it, holds it over the reader and takes it away; later types the PIN
        const cardContact = card.localToWorld(v3(1.6, LT * 2 + 0.01 + (topGroup.position.y - LT), 0.6));
        if (t < T.ACERCAR - 0.8) {
          const tapIn = ramp(t, 0.0, T.TAP), tapOut = ramp(t, T.TAP + 0.35, T.TAP + 0.9);
          const gone = ramp(t, T.SLIDE1 + 0.25, T.SLIDE1 + 0.9);
          const away = t < T.SLIDE0 - 0.4 ? (1 - tapIn) * 7 + tapOut * 1.2 : lerp(1.2, 0, ramp(t, T.SLIDE0 - 0.4, T.SLIDE0)) + gone * 12;
          F.colocar(cardContact, v3(-0.5, 0.72, -0.48), away);
        } else if (t < T.ESPANA + 1.2) {
          // it leaves once the card is over the reader (it would cover the close-ups) and comes back to move it aside
          const off = ramp(t, T.ACERCAR + 2.4, T.ACERCAR + 3.2) * (1 - ramp(t, T.SEGUNDO - 1.0, T.SEGUNDO - 0.2));
          const away = (1 - ramp(t, T.ACERCAR - 0.8, T.ACERCAR)) * 7 + off * 12 + ramp(t, T.ESPANA + 0.3, T.ESPANA + 1.2) * 12;
          F.colocar(cardContact, v3(-0.5, 0.72, -0.48), away);
        } else {
          const dir = v3(0.75, 0.62, 0.15);
          let contact = PRESS[0], away = (1 - ramp(t, T.ESPANA + 1.2, tp[0])) * 9;
          for (let i = 0; i < tp.length - 1; i++) {
            if (t >= tp[i] && t < tp[i + 1]) {
              const k = (t - tp[i]) / (tp[i + 1] - tp[i]);
              contact = PRESS[i].clone().lerp(PRESS[i + 1], ramp(k, 0.2, 0.8)); away = 0.9 * Math.sin(Math.PI * k);
            }
          }
          if (t >= tp[3]) { contact = PRESS[3]; away = ramp(t, tp[3] + 0.15, tp[3] + 0.9) * 12; }
          F.colocar(contact, dir, away);
        }

        C.mirar(camAt(t));
        C.pintar(t);
      }

      C.arrancar(renderAt);
    </script>
  </body>
</html>
