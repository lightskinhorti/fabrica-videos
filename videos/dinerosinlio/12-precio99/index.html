      tl.to({}, { duration: 26 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import { crearDinero, COLOR } from "./comun/dinero.js";
      const $ = (id) => document.getElementById(id);
      const K = COLOR;

      // ---------- drawings this video needs, in the account's flat style ----------
      const DIBUJOS = {
        // a price tag: the first digit can be boxed in gold ("d") or the 9s ("d9"); alto = font size in px
        precio: (texto = "2,99 €", marca = "", alto = 220, ancho = 820) => {
          let t = texto;
          if (marca === "d") t = `<span class="d">${texto[0]}</span>${texto.slice(1)}`;
          if (marca === "d9") t = texto.replace(/9/g, '<span class="d">9</span>');
          return `<div class="precio" style="width:${ancho}px; font-size:${alto}px; line-height:1.15; padding:10px 0">${t}</div>`;
        },
        // a flat side-view car
        coche: (w = 480) => {
          const h = Math.round(w * 0.42);
          const f = (s) => `<path d="M24 118 V92 Q26 74 50 70 L104 66 L132 30 Q138 22 150 22 H258 Q272 22 280 32 L308 66 L362 72 Q388 78 388 98 V118 Z" ${s ? "" : `fill="${K.azul}" stroke="${K.tinta}" stroke-width="8" stroke-linejoin="round"`}/>`;
          return `<svg width="${w}" height="${h}" viewBox="0 0 420 176"><g transform="translate(10 10)">${f(true).replace("<path", `<path fill="${K.tinta}"`)}${f(false)}
            <path d="M140 38 H184 V66 H120 Z" fill="${K.blanco}" stroke="${K.tinta}" stroke-width="6" stroke-linejoin="round"/>
            <path d="M198 38 H256 Q264 38 270 46 L288 66 H198 Z" fill="${K.blanco}" stroke="${K.tinta}" stroke-width="6" stroke-linejoin="round"/>
            <circle cx="100" cy="122" r="34" fill="${K.tinta}"/><circle cx="100" cy="122" r="14" fill="${K.oro}"/>
            <circle cx="310" cy="122" r="34" fill="${K.tinta}"/><circle cx="310" cy="122" r="14" fill="${K.oro}"/></g></svg>`;
        },
      };
      for (const el of document.querySelectorAll("[data-dibujo]")) el.innerHTML = DIBUJOS[el.dataset.dibujo](...JSON.parse(el.dataset.args || "[]"));

      const C = crearDinero();
      const { T } = C;
      const filaClase = (id, clase, on) => { const b = $(id); if (b) b.parentElement.classList.toggle(clase, on); };

      function renderAt(t) {
        filaClase("filaA", "marca", t >= T.BARATO && t < T.CAMBIA);
        filaClase("filaB", "marca", t >= T.CAMBIA && t < T.NUMERO + 0.6);
        filaClase("filaC", "marca", t >= T.NUMERO + 0.6);
        C.pintar(t);
      }

      C.arrancar(renderAt);
    </script>
  </body>
</html>
