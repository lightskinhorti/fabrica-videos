        coche: (d, az, el) => ({ mira: pt(car, 0, 0.9, 0), dist: d, az, el }),
        faros: (d, az, el) => ({ mira: pt(car, 2.0, 0.9, 0), dist: d, az, el }),
        rueda: (d, az, el) => ({ mira: pt(car, 1.5, 0.5, 0.98), dist: d, az, el }),
        volante: (d, az, el) => ({ mira: pt(car, 0.2, 1.4, 0), dist: d, az, el }),
        cola: (d, az, el) => ({ mira: pt(car, -2.0, 0.9, 0), dist: d, az, el }),
        obj: (o, k, d, az, el, y = 0) => ({ mira: entre(o, k, y), dist: d * 1.3, az, el }),
        luna: (d, az, el) => ({ mira: pt(luna, -3, 6, 1), dist: d, az, el }),
      };
      // a new framing every ~2.4 s, alternating close and wide, plus beats tied to the voice (each object, as its card comes in)
      const FORZADAS = [
        [-1, F.coche(12.5, -84, 5)], [0.85, F.cara(4.4, -26, 3), 0.9],
        [2.5, F.coche(10.5, -22, 8), 1.1],
        [tEsp - 0.9, F.obj(karman, 0.6, 8.0, -28, 4), 1.1], [tEst - 1.0, F.obj(estacion, 0.7, 7.0, -24, 5), 1.1],
        [tSat - 1.0, F.obj(satelite, 0.7, 7.0, -26, 4), 1.1], [tVue - 1.0, F.obj(mini1, 0.7, 6.2, -24, 4), 1.1],
        [tMit - 1.0, F.obj(hito, 0.7, 9.0, -26, 5), 1.1], [tLle - 1.2, F.luna(24, -30, 4), 1.4],
        [tDie - 0.8, F.obj(mini2, 0.7, 6.0, -22, 5), 1.0], [tOch - 0.8, F.volante(4.4, -20, 8), 1.0],
        [tLuz - 0.8, F.coche(17, -32, 10), 1.2], [tNasa - 0.9, F.obj(cohete, 0.6, 9.5, -22, 5), 1.0],
        [tCie - 0.6, F.coche(9.0, -30, 5), 1.1], [tPreg - 0.7, F.coche(10.0, -18, 12), 1.2],
      ];
      const CERCA = [F.cara(3.9, -12, 3), F.rueda(4.8, -50, 6), F.faros(5.0, -40, 5), F.volante(4.2, 20, 12), F.cara(4.4, -70, 4), F.cola(5.4, -140, 5)];
      const LEJOS = [F.coche(10.2, -50, 8), F.coche(9.0, 10, 9), F.coche(11.0, -100, 6), F.coche(8.6, -35, 2), F.coche(10.0, 40, 10), F.coche(9.4, -70, 4)];
      const ENC0 = FORZADAS.map(([t, e, dur]) => ({ t, ...e, dur }));
      for (let t = 4.8, k = 0; t < D - 3.2; t += 1.8, k++) if (!FORZADAS.some(([ft]) => t > ft - 0.9 && t < ft + 1.3)) ENC0.push({ t, ...(k % 2 ? LEJOS : CERCA)[(k >> 1) % 6], dur: 0.9 });
      ENC0.sort((a, b) => a.t - b.t);
      const ENCUADRES = [];
      ENC0.forEach((e, i) => ENCUADRES.push(i > 1 ? { ...e, t: Math.max(e.t, ENCUADRES[i - 1].t + 1.3) } : e));
      function encuadre(t) {
        let i = 0;
        while (i + 1 < ENCUADRES.length && t >= ENCUADRES[i + 1].t) i++;
        const b = ENCUADRES[i], a = ENCUADRES[Math.max(0, i - 1)];
        const k = i === 0 ? 1 : smooth(clamp((t - b.t) / (b.dur || 1.5)));
        const mira = a.mira().lerp(b.mira(), k);
        let dist = lerp(a.dist, b.dist, k), az = lerp(a.az, b.az, k), el = lerp(a.el, b.el, k);
        dist *= 1 + 0.04 * Math.sin(t * 0.37);
        az += 2 * Math.sin(t * 0.23) + 8 * C.impulso(t);
        return { mira, dist, az, el };
      }

      // ---------- sky by distance: blue, dark blue, black (the stars come in with it) ----------
      const SKY = [[0, "#4fc3f7", "#d6f2ff"], [10, "#2a8fd8", "#7fd0f5"], [22, "#0b2a5e", "#143c7a"], [34, "#02081a", "#040c24"], [46, "#000104", "#01030a"], [90, "#000104", "#01030a"]];
      const clamp01 = (x) => clamp(x, 0, 1);
      const pregEl = document.getElementById("pregunta");
      scene.fog = null;
      const luzDia = (y) => 1 - clamp01((y - 14) / 22);

      function renderAt(t) {
        const y = C.yAt(t), vy = (C.yAt(t + 1 / 30) - C.yAt(t - 1 / 30)) * 15; // y: distance on the log scale (= the car's x); vy: speed
        car.position.set(y, 0.02 * Math.sin(t * 9) + 0.01, 0);
        car.rotation.z = 0.012 * Math.sin(t * 7.3); car.rotation.x = 0.01 * Math.sin(t * 5.1);
        ruedas.forEach((r) => (r.rotation.z = -t * 16));
        P.animar(t);
        // ---- light and sky by distance ----
        C.hemi.intensity = 1.3 * (0.55 + 0.45 * luzDia(y));
        C.fondo(SKY, y);
        estrellasMat.opacity = clamp01((y - 16) / 14);
        // ---- the globe, the ring and the miniatures ----
        const pulso = 0.5 + 0.5 * Math.sin(t * 6), kVue = clamp01((t - (tVue - 0.3)) / 0.4) * (1 - clamp01((t - (tMit - 0.9)) / 0.3));
        anillo.visible = kVue > 0.01; anillo.scale.setScalar(1 + 0.012 * pulso);
        mini1.userData.bola.rotation.y = t * 0.8; mini2.userData.bola.rotation.y = t * 0.8; mini1.userData.aro.rotation.z = t * 0.7; mini2.userData.aro.rotation.z = t * 0.7;
        mini1.position.y = yO + 0.2 + 0.1 * Math.sin(t * 1.3); mini2.position.y = yO + 0.2 + 0.1 * Math.sin(t * 1.3 + 1);
        mini2.visible = t > tDie - 1.2 && t < tOch;
        hito.visible = t > tMit - 1.8;
        estacion.rotation.y = 0.5 + 0.12 * Math.sin(t * 0.5); satelite.rotation.y = 0.6 + 0.15 * Math.sin(t * 0.6);
        karman.children[0].material.opacity = 0.14 + 0.06 * Math.sin(t * 3);
        // ---- the rocket arrives before you ----
        const uC = clamp01((t - (tNasa - 0.5)) / 1.7);
        cohete.visible = t > tNasa - 0.5;
        cohete.position.set(lerp(sLun - 44, sLun - 4.6, 1 - Math.pow(1 - uC, 3)), yO + 0.2, zO);
        llama.scale.set(1, (0.7 + 0.5 * Math.sin(t * 40)) * (1 - 0.7 * uC), 1);
        // ---- the road lines, the speed lines (they stream back, so the car is always going) ----
        dashes.forEach((d, i) => { const x = y - 14 + (((i * 2.4 - t * 11 - y) % 96) + 96) % 96; d.position.x = x; d.visible = x > -3 && x < sLun + 2.6; });
        lineas.forEach((l) => { const u = l.userData, x = y + 26 - ((((u.h * 60 + t * 34) % 60) + 60) % 60) - 12; l.position.set(x, u.y, u.z); l.visible = y > 0 || true; });
        // ---- the stars follow the camera (they are at infinity) ----
        scene.updateMatrixWorld();
        const E = encuadre(t);
        const dir = v3(Math.sin(E.az * RAD) * Math.cos(E.el * RAD), Math.sin(E.el * RAD), Math.cos(E.az * RAD) * Math.cos(E.el * RAD));
        const right = v3(Math.cos(E.az * RAD), 0, -Math.sin(E.az * RAD));
        const target = E.mira.clone().addScaledVector(right, 0.075 * E.dist); target.y += 0.09 * E.dist;
        camera.position.copy(target).addScaledVector(dir, E.dist);
        camera.lookAt(target);
        estrellas.position.copy(camera.position);
        // the character looks at the camera (never more than ~60 degrees from the road)
        const loc = kid.worldToLocal(camera.position.clone());
        head.rotation.y = clamp(Math.atan2(loc.x, loc.z) * 0.85, -1.05, 1.05) + 0.12 * Math.sin(t * 0.9); head.rotation.x = 0.04 + 0.03 * Math.sin(t * 1.7);
        camera.updateMatrixWorld(); C.escala(target, E.dist);
        scene.updateMatrixWorld();
        C.pintar(t, y);
        const kq = ramp(t, tPreg - 0.3, tPreg + 0.25);
        // the question sits where the marker's cards go, which the fixed title moves down
        pregEl.style.top = 700 + C.titulo.desplazamiento(t) + "px";
        pregEl.style.opacity = kq; pregEl.style.transform = `scale(${0.92 + 0.08 * kq})`;
        tarjetas(t);
      }
      await C.arrancar(renderAt);
    </script>
  </body>
</html>
