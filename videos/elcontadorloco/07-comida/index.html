          if (!c.g.visible) continue;
          const squash = c.kin > 0.7 ? 0.25 * Math.sin((Math.PI * (c.kin - 0.7)) / 0.3) : 0;
          c.g.position.set(-gap - c.L / 2, (1 - ease(c.kin)) * c.H * 2.5, c.z);
          c.g.scale.set(1 + squash * 0.5, 1 - squash, 1 + squash * 0.5).multiplyScalar(1 - ease(c.kout));
          left = Math.min(left, lerp(-0.12, -gap - c.L - 0.05, ease(c.kin) * (1 - ease(c.kout))));
        }
        // the character stands behind, between the objects and the heap (to the left while everything is tiny)
        const charVis = A.persona ? ramp(t, A.persona.t - 0.7, A.persona.t + 0.2) : 1;
        kid.position.x = lerp(-0.35, 0, clamp((gap - 0.1) / 0.2));
        left = Math.min(left, lerp(-0.12, kid.position.x - 0.7, charVis));
        // heap: pieces appear one by one (one every 150 g), then the whole heap grows
        const hx = gap + Rw;
        heap.position.set(hx, 0, 0); heap.scale.setScalar(S);
        core.visible = Rl > 0.07; core.scale.set(Rl * 0.93, HK * Rl, Rl * 0.93);
        const n = m <= 0 ? 0 : Math.min(NI, 1 + Math.floor(m / MI));
        for (const T of TIPOS) { let k = 0; while (k < T.lista.length && T.lista[k].i < n) k++; T.mesh.count = k; }
        const s0 = Math.cbrt(clamp(m / MI)) * primero.s;
        T0.mesh.setMatrixAt(0, m4.compose(v3(0, T0.hy * s0, 0), primero.q, v3(s0, s0, s0))); T0.mesh.instanceMatrix.needsUpdate = true;
        const topL = HK * Rl + 0.04, Hw = topL * S;
        cima.position.set(hx, Hw + 0.02 * S, 0);
        cayendo.forEach((f, i) => {
          const k = (t * 1.1 + i / 3) % 1, caida = Math.max(0.35, 1.6 * Rl) * S;
          f.visible = m > 3 && m < 5000 && k < 0.95;
          f.position.set(hx + (hash(i + 40) - 0.5) * 0.4 * Rl * S, Hw + (1 - k * k) * caida, (hash(i + 41) - 0.5) * 0.3 * Rl * S);
          f.rotation.set(t * (1 + i), t * 0.7, 0.3 * Math.sin(t * 3 + i)); f.scale.setScalar(S);
        });
        enterrar(hx, Rw);
        // the character looks at each new object, then back at the heap; up as the heap grows
        P.animar(t);
        const mira = comps.reduce((s, c) => Math.max(s, ramp(t, c.a.t - 0.2, c.a.t + 0.3) * (1 - ramp(t, c.a.t + 1.8, c.a.t + 2.4))), 0);
        kidHead.rotation.y = lerp(0.45, -0.55, mira) + Math.sin(t * 0.9) * 0.06;
        kidHead.rotation.x = lerp(0.3, -0.35, clamp(Hw / 2.2));
        // frame heap + objects (+ the whole character from "persona adulta" on) between the HUD and the captions;
        // it opens on the kitchen and goes down to the floor as the first grams appear
        const estab = 1 - ramp(t, tZ0, tZ1);
        const right = hx + Rw * 1.08 + 0.04;
        const hS = Math.max(Hw, objH, 1.85 * charVis, lerp(0.07, 1.9, estab));
        const width = Math.max(right - left, lerp(0, 5.2, estab));
        const cx = lerp((left + right) / 2, -1.2, estab);
        const kFin = smooth(clamp((y - yVida) / (yFin - yVida)));
        const Hv = Math.max((width / 0.5625) * 1.12, hS / 0.25) * (1 + 0.1 * kFin);
        const sway = Math.sin(t * 0.5) * 0.015 * Hv;
        const dist = (Hv / 0.6886) * (1 + 0.12 * ramp(t, D - 4.5, D - 1));
        // small shots look down at the floor, so the character's legs stay out of the way
        const kChico = clamp((1.4 - Hv) / 0.9);
        camera.position.set(cx + sway, hS * 0.5 + Hv * (0.14 + 0.5 * kChico + 0.08 * kFin), dist);
        camera.lookAt(cx, hS * 0.5, 0);
        camera.updateMatrixWorld(); C.escala(v3(cx, hS * 0.5, 0), dist);
        scene.fog.near = Math.max(120, dist * 1.4); scene.fog.far = Math.max(900, dist * 6);
        const [, bot] = C.fondo(SKY, y);
        scene.fog.color.set(bot);
        C.pintar(t, y);
        // counter in grams / kilos with decimals; for every home in Spain the clock is one year
        const [num, unit] = fmt(m);
        altEl.innerHTML = `${num}<small>${unit}</small>`;
        if (m > VIDA * 1.01) { sinceEl.textContent = "TODA ESPAÑA EN"; clockEl.textContent = "1 año"; }
        else sinceEl.textContent = C.ESC.desde;
      }
      await C.arrancar(renderAt);
    </script>
  </body>
