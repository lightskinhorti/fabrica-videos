        { t: tL6 - 0.2, mira: pt(body, 0, 1.0, 0.4), dist: 8.4, az: 24, el: 7 },
        { t: tFue - 0.4, mira: pt(head, 0, -0.5, 0.6), dist: 5.0, az: 12, el: 4 },
        { t: tDos - 0.5, mira: pt(head, 0, -0.4, 0.6), dist: 3.9, az: 8, el: 3 },
        { t: tApenas - 0.6, mira: pt(body, 0, 1.8, 0.4), dist: 6.2, az: 18, el: 5 },
        { t: tNunca - 0.4, mira: pt(body, 0, 1.6, 0.4), dist: 7.6, az: 26, el: 8 },
      ];
      // times strictly increasing, whatever the voice does
      const ENCUADRES = [];
      ENC0.forEach((e, i) => ENCUADRES.push(i > 1 ? { ...e, t: Math.max(e.t, ENCUADRES[i - 1].t + 1.2) } : e));
      function encuadre(t) {
        let i = 0;
        while (i + 1 < ENCUADRES.length && t >= ENCUADRES[i + 1].t) i++;
        const b = ENCUADRES[i], a = ENCUADRES[Math.max(0, i - 1)];
        const k = i === 0 ? 1 : smooth(clamp((t - b.t) / (b.dur || 1.8)));
        const mira = a.mira().lerp(b.mira(), k);
        let dist = lerp(a.dist, b.dist, k), az = lerp(a.az, b.az, k), el = lerp(a.el, b.el, k);
        // a slow drift so the shot is never still, a last pull back, and the swing of the start around him
        dist *= 1 + 0.05 * Math.sin(t * 0.37) + 0.5 * ramp(t, D - 4.2, D - 0.6);
        az += 2 * Math.sin(t * 0.23) + 20 * C.impulso(t);
        return { mira, dist, az, el };
      }

      // ---------- light and window by story: night (first night), day, golden (years), cold laboratory light ----------
      const altEl = document.getElementById("alt"), sinceEl = document.getElementById("since"), clockEl = document.getElementById("clock");
      const tMiradas = [...CARDS.map((c) => c.t), tFinal];
      const C_NOCHE = new THREE.Color(0x0d1b45), C_DIA = new THREE.Color(0x8fd3ff), C_ORO = new THREE.Color(0xffc27a), C_ALBA = new THREE.Color(0xffa45c);
      const SOL = new THREE.Color(0xfff1dc), LUNA = new THREE.Color(0x9fb8ff);
      const bell = (t, a, b, c, d) => ramp(t, a, b) * (1 - ramp(t, c, d));
      const noche = (t) => bell(t, tPrim - 0.6, tPrim + 0.2, tPrim + 3.0, tPrim + 3.8);

      function renderAt(t) {
        const m = nochesAt(t), y = Y(m), an = anos(t), n = noche(t), ring = suena(t);
        // ---- the character: alive (blinks and reacts to each card), a beard with the years ----
        P.animar(t);
        const kB = smooth(clamp((an - 1) / 5));
        barba.visible = kB > 0.02; barba.scale.set(1, Math.max(0.02, kB), Math.max(0.3, kB));
        const cansado = 0.45 + 0.55 * smooth(clamp(an / 4));
        ojeras.forEach((o) => { o.scale.set(1, 0.85 + 0.5 * cansado, 1); });
        // a red nose while he has the cold
        const cat = bell(t, tSem + 0.3, tSem + 1.2, tAnos - 1.4, tAnos - 0.4);
        nariz.visible = cat > 0.02; nariz.scale.setScalar(Math.max(0.01, cat));
        // the reaction to each card is a curious look (brows up, a small "o"), never a scare
        const mira = tMiradas.reduce((s, tc) => { const d = t - tc; return d > -0.2 && d < 2.6 ? Math.max(s, d < 0.25 ? ease((d + 0.2) / 0.45) : Math.exp(-(d - 0.25) / 0.9)) : s; }, 0) * 0.7;
        // yawn at frame 0 (hand on his face), a second one on the last line
        const bostezo = Math.max(1 - ramp(t, 0.9, 1.8), bell(t, tL10 + 2.6, tL10 + 3.2, tL10 + 4.6, tL10 + 5.2));
        // micro-sleep on "en vela": head drops, eyes shut, then he wakes up with a jerk
        const cabeceo = bell(t, tVela - 0.2, tVela + 0.35, tVela + 1.0, tVela + 1.35);
        const [lids, brows, pupils] = [[head.children[7], head.children[12]], [head.children[8], head.children[13]], [head.children[6], head.children[11]]];
        const boca = head.children[15], [labios, dientes, esq1, esq2] = boca.children;
        const kb = (t + 0.7) % 3.4, blink = kb < 0.14 ? Math.sin((Math.PI * kb) / 0.14) : 0;
        // heavy lids all the time, wide open for a moment when something surprises him
        const abierto = (0.55 + 0.3 * mira) * (1 - 0.9 * Math.max(bostezo, cabeceo)) * (1 - 0.6 * blink);
        lids.forEach((l) => (l.scale.y = Math.max(0.001, abierto)));
        brows.forEach((b, i) => { b.position.y = 0.5 + 0.1 * mira - 0.05 * cansado; b.rotation.z = (i ? -1 : 1) * (0.08 * mira + 0.1 * cansado * (1 - mira)); });
        pupils.forEach((pu, i) => { pu.position.x = (i ? 1 : -1) * 0.5; pu.scale.setScalar(1 + 0.1 * mira); });
        const wO = Math.max(mira * 0.8, bostezo);
        labios.scale.set(1 - 0.2 * wO, 0.16 + 0.55 * wO, 1);
        labios.position.y = -0.08 * wO - 0.12 * bostezo;
        dientes.visible = false;
        [esq1, esq2].forEach((c, i) => { c.visible = wO < 0.4; c.position.x = (i ? 1 : -1) * 0.3; });
        // ---- arms: the right one goes to his face when he yawns ----
        const brazo = arms[0], bob = 0.03 * Math.sin(t * 1.3);
        brazo.rotation.set(lerp(-0.05 + bob, -2.0, bostezo), 0, lerp(0.12, 0.62, bostezo));
        brazo.scale.y = lerp(1, 1.27, bostezo);
        arms[1].rotation.x = -0.1 * mira; arms[1].rotation.z = 0.1 + 0.3 * mira + 0.03 * Math.sin(t * 1.1);
        // ---- head: tired sway, the sneeze, the nod ----
        const ds = t - tRes;
        const estornudo = ds < -0.35 || ds > 1.2 ? 0 : ds < 0 ? -0.32 * ease((ds + 0.35) / 0.35) : ds < 0.14 ? lerp(-0.32, 0.5, ds / 0.14) : 0.5 * Math.exp(-(ds - 0.14) * 3.3);
        head.rotation.x = 0.1 + 0.04 * Math.sin(t * 0.8) + 0.1 * bostezo * -1 + estornudo + 0.75 * cabeceo;
        head.rotation.y = -0.12 + 0.1 * Math.sin(t * 0.5) + 0.1 * mira;
        GOTAS.forEach(({ m: g, j }) => {
          const u = (t - tRes - 0.12) / 0.55;
          g.visible = u > 0 && u < 1;
          if (!g.visible) return;
          const a = j * 2.4;
          g.position.set(0.5 * Math.sin(a) * u, -0.35 - 0.5 * u * u + 0.2 * Math.cos(a) * u, 1.35 + 3.6 * u * (0.6 + 0.4 * (j % 3) / 2));
          g.scale.setScalar(1 - 0.5 * u); g.material.opacity = 0.9 * (1 - u);
        });
        // ---- the alarm clock rings: it shakes and the marks flicker ----
        RELOJ.rotation.z = ring * 0.09 * Math.sin(t * 70); RELOJ.position.y = TOP + 0.15 + ring * 0.006 * Math.abs(Math.sin(t * 35));
        ONDAS.forEach(({ m: o, sx, j }) => {
          const on = ring > 0.05 && Math.sin(t * 30 + j * 2) > -0.3;
          o.visible = on; o.position.copy(RELOJ.position).add(v3(sx * (0.2 + 0.06 * j), 0.13 + 0.03 * j, 0.0));
        });

        // ---- light: the first night is dark and bluish, a golden room with the years, cold light in the laboratory ----
        const dorado = bell(t, tAnos + 1.5, tAnos + 3, tFue - 1, tFue + 0.5);
        const lab = ramp(t, tFue, tFue + 1.2);
        const ven = new THREE.Color().copy(C_ALBA).lerp(C_DIA, ramp(t, 0.8, 2.5)).lerp(C_NOCHE, n).lerp(C_ORO, dorado).lerp(C_DIA, lab * 0.7);
        VENT.color.copy(ven);
        LAMP.color.setHex(n > 0.3 ? 0xffe7a6 : 0xb5a98a);
        C.hemi.intensity = lerp(1.35, 0.85, n); C.key.intensity = lerp(2.3, 0.9, n); C.key.color.copy(SOL).lerp(LUNA, n).lerp(C_ORO, dorado * 0.5);

        // ---- camera ----
        scene.updateMatrixWorld();
        const E = encuadre(t);
        const dir = v3(Math.sin(E.az * RAD) * Math.cos(E.el * RAD), Math.sin(E.el * RAD), Math.cos(E.az * RAD) * Math.cos(E.el * RAD));
        const right = v3(Math.cos(E.az * RAD), 0, -Math.sin(E.az * RAD));
        const target = E.mira.clone().addScaledVector(right, 0.075 * E.dist);
        camera.position.copy(target).addScaledVector(dir, E.dist);
        camera.lookAt(target);
        camera.updateMatrixWorld(); C.escala(target, E.dist);
        const top = "#" + new THREE.Color(0x2b3a6b).lerp(ven, 0.3).getHexString(), bot = "#" + new THREE.Color(0x9fc4e8).getHexString();
        C.fondo([[0, top, bot], [1, top, bot]], 0);
        scene.updateMatrixWorld();
        C.pintar(t, y);
        // counter: nights; the clock, how long he has slept 6 hours a night
        const cuantas = Math.round(m + 0.01);
        altEl.innerHTML = `${miles(cuantas)}<small>${cuantas === 1 ? "noche" : "noches"}</small>`;
        sinceEl.textContent = C.ESC.desde;
        clockEl.textContent = reloj(m);
        tarjetas(t);
      }
      await C.arrancar(renderAt);
    </script>
  </body>
