      [[-1.3, 0.8, 105], [-0.45, 0.8, 110], [0.45, 0.8, 110], [1.3, 0.8, 105], [-0.9, -0.6, 135], [0.9, -0.6, 135], [0, -0.9, 138], [0, 0, 172.5]].forEach(([x, z, h]) => {
        const w = h > 170 ? 0.5 : 0.32; const t = spanBox(w, w, 45, h * 0.94, PIEDRA); t.position.x = x; t.position.z = z; sagrada.add(t);
        sagrada.add(at(cone(w * 0.6, Y(h) - Y(h * 0.94) + 0.3, PIEDRA), x, Y(h * 0.94) + (Y(h) - Y(h * 0.94)) / 2, z));
      });
      const tower = new THREE.Group(); tower.position.set(3.6, 0, -3.4); scene.add(tower);
      tower.add(spanBox(1.8, 1.8, 0, 225, mat(0x5fa8d8, { roughness: 0.3, metalness: 0.2 })));
      tower.add(spanBox(1.95, 1.95, 225, 249, mat(0x9fe8c8, { emissive: 0x3fbf8f, emissiveIntensity: 0.4 })));

      // ---------- the sky: clouds, Everest, planes, edge of space, Earth, stars, Moon (as in the elevator) ----------
      const clouds = new THREE.Group(); scene.add(clouds);
      for (let i = 0; i < 22; i++) {
        const c = new THREE.Group(); const n = 3 + Math.floor(hash(i + 20) * 3);
        for (let j = 0; j < n; j++) c.add(at(new THREE.Mesh(new THREE.IcosahedronGeometry(0.7 + hash(i * 7 + j) * 0.6, 0), mat(0xffffff, { roughness: 1 })), j * 0.8 - n * 0.4, hash(i * 3 + j) * 0.4, hash(i * 5 + j) * 0.5));
        c.position.set((hash(i + 40) - 0.5) * 16, Y(800 + hash(i + 60) * 2500), -2 - hash(i + 80) * 9);
        if (Math.abs(c.position.x) < 1.6 && c.position.z > -3) c.position.x += 3.5 * Math.sign(c.position.x || 1);
        clouds.add(c);
      }
      const peak = new THREE.Group(); peak.position.set(2.4, 0, -10); scene.add(peak);
      function summit(r, h0, h1, snowFrom, x, z, rockC) {
        const g = new THREE.Group(); g.position.set(x, 0, z);
        const hh = Y(h1) - Y(h0), sh = Y(h1) - Y(snowFrom);
        g.add(at(new THREE.Mesh(new THREE.ConeGeometry(r, hh, 7, 1), mat(rockC)), 0, Y(h0) + hh / 2, 0));
        g.add(at(new THREE.Mesh(new THREE.ConeGeometry(r * (sh / hh) * 1.03, sh, 7, 1), mat(0xf4f7fb)), 0, Y(h1) - sh / 2 + 0.02, 0));
        return g;
      }
      peak.add(summit(4.2, 4500, 8849, 7000, 0, 0, 0x6b6e7a));
      peak.add(summit(3.2, 4500, 7200, 6200, -9, -4, 0x5b5e6a));
      for (let i = 0; i < 12; i++) peak.add(at(new THREE.Mesh(new THREE.IcosahedronGeometry(1.1 + hash(i + 500) * 0.8, 0), mat(0xffffff, { roughness: 1 })), (hash(i + 510) - 0.5) * 22, Y(4300) + hash(i + 520) * 0.6, -3 + (hash(i + 530) - 0.5) * 8));
      function plane(c) {
        const p = new THREE.Group();
        p.add(at(box(2.6, 0.38, 0.38, mat(0xffffff)), 0, 0, 0));
        p.add(at(box(0.6, 0.06, 2.6, mat(c)), 0.1, 0, 0));
        p.add(at(box(0.4, 0.6, 0.06, mat(c)), -1.15, 0.3, 0));
        p.add(at(box(0.3, 0.06, 0.9, mat(c)), -1.15, 0.05, 0));
        return p;
      }
      const planes = [plane(0xff6a2b), plane(0x2b6fd8)];
      planes[0].position.set(0, Y(10500), -3); planes[1].position.set(0, Y(11800), -6); planes[1].rotation.y = Math.PI;
      planes.forEach((p) => scene.add(p));
      const edge = at(box(60, 0.05, 0.05, glow(0x8ff3ff, 0.9)), 0, Y(100000), -3); scene.add(edge);
      const moon = new THREE.Group(); moon.position.set(2.2, Y(384400000), -8); moon.scale.setScalar(0.75); scene.add(moon);
      moon.add(new THREE.Mesh(new THREE.IcosahedronGeometry(2.6, 1), mat(0xc9c9c4, { roughness: 1 })));
      for (let i = 0; i < 9; i++) {
        const d = v3(hash(i + 1) - 0.5, hash(i + 2) - 0.5, hash(i + 3) * 0.6 + 0.2).normalize().multiplyScalar(2.45);
        const cr = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25 + hash(i + 4) * 0.35, 0), mat(0x9a9a95, { roughness: 1 })); cr.position.copy(d); moon.add(cr);
      }
      const earth = new THREE.Group(); scene.add(earth);
      const eg = new THREE.IcosahedronGeometry(24, 3).toNonIndexed(); const col = [];
      const pos = eg.attributes.position;
      for (let i = 0; i < pos.count; i += 3) {
        const cx = (pos.getX(i) + pos.getX(i + 1) + pos.getX(i + 2)) / 3, cz = (pos.getZ(i) + pos.getZ(i + 1) + pos.getZ(i + 2)) / 3;
        const land = Math.sin(cx * 0.31) + Math.cos(cz * 0.27 + 1.3) + Math.sin((cx + cz) * 0.17) > 1.1;
        const c = new THREE.Color(land ? 0x5bb35b : 0x2a7fd4); for (let k = 0; k < 3; k++) col.push(c.r, c.g, c.b);
      }
      eg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
      earth.add(new THREE.Mesh(eg, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 })));
      earth.add(new THREE.Mesh(new THREE.SphereGeometry(25.2, 48, 32), new THREE.MeshBasicMaterial({ color: 0x8fd0ff, transparent: true, opacity: 0.18, side: THREE.BackSide, depthWrite: false })));
      const starGeo = new THREE.BufferGeometry(); const sp = [];
      for (let i = 0; i < 700; i++) { const a = hash(i) * Math.PI * 2, b = (hash(i + 900) - 0.5) * Math.PI, r = 120; sp.push(r * Math.cos(b) * Math.cos(a), r * Math.sin(b), r * Math.cos(b) * Math.sin(a) - 40); }
      starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
      const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false })); scene.add(stars);

      const SKY = [[0, "#3fc4ff", "#a8e4ff"], [30, "#1592f0", "#7fd0ff"], [41, "#0a3f9e", "#3d8fe0"], [50, "#060c2c", "#0b2a6a"], [58, "#02030a", "#05081a"]];
      C.etiquetas({
        "PASA LA SILLA": [chair, v3(0, Y(0.9), -0.45)], "TOCA EL TECHO": [ceiling, v3(1.2, 0, 0.7)], "MÁS QUE UNA FAROLA": [farola, v3(0.4, Y(9), 0)],
        "PASA LA TORRE DE CRISTAL": [tower, v3(0, Y(249), 0)], "PASA EL EVEREST": [peak, v3(0, Y(8849), 0)], "EN EL ESPACIO": [edge, v3(6, 0, 0)],
      }, [top, v3(0, 0, 0)]);

      function renderAt(t) {
        const y = C.yAt(t);
        // reveal the pile up to its height
        pile.count = Math.max(1, Math.min(CAPAS, Math.ceil(y / PASO)));
        top.position.set(0, y, 0);
        falling.forEach((f, i) => { const k = (t * 1.3 + i / 3) % 1; f.position.set((hash(i + 40) - 0.5) * 0.5, y + 0.15 + (1 - k) * 2.5, (hash(i + 41) - 0.5) * 0.4); f.rotation.set(0, t * (1 + i), 0.3 * Math.sin(t * 3 + i)); f.visible = k < 0.95; });
        // camera follows the top of the pile, pulling back as it climbs
        const dist = 13.5 + 0.06 * y + 3 * ramp(t, D - 4.5, D - 1);
        const sway = Math.sin(t * 0.6) * 0.5;
        camera.position.set(2.6 + sway, y + 1.6 + 0.02 * y, dist);
        camera.lookAt(0.3, y + 0.45 + 0.012 * y, 0);
        camera.updateMatrixWorld();
        key.position.set(-6, y + 9, 7); key.target.position.set(0, y, 0);
        head.rotation.x = -0.2 - 0.4 * clamp(y / 4); head.rotation.y = 0.3 + Math.sin(t * 0.9) * 0.15;
        const [, bot] = C.fondo(SKY, y);
        scene.fog.color.set(bot); scene.fog.near = 25 + clamp((y - 40) / 15) * 200; scene.fog.far = 70 + clamp((y - 40) / 15) * 300;
        stars.material.opacity = clamp((y - 44) / 8); stars.position.y = y;
        hemi.intensity = 1.3 - 0.6 * clamp((y - 45) / 10);
        earth.visible = y > 43;
        const gap = 3 + clamp((y - 45) / 41) * 60;
        earth.position.set(-2, y - 24 - gap, -18 - gap * 0.6); earth.rotation.y = t * 0.03;
        planes[0].position.x = -10 + ((t * 2.2) % 20); planes[1].position.x = 10 - ((t * 1.6) % 20);
        moon.rotation.y = t * 0.05; clouds.position.x = Math.sin(t * 0.1) * 0.6;
        C.pintar(t, y);
      }
      await C.arrancar(renderAt);
    </script>
