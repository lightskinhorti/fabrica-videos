        P.animar(t);
        const sp = sorpresa(t);
        const incl = 0.14 + 0.12 * kViejo - 0.12 * sp;
        body.rotation.x = incl;
        const hy = 3.5, hz = 0.1;
        head.position.set(0, 1.6 + hy * Math.cos(incl) - hz * Math.sin(incl), hy * Math.sin(incl) + hz * Math.cos(incl));
        // looks down at the phone; at every landmark he looks up, surprised, then back down
        head.rotation.x = lerp(0.42, -0.08, sp) - incl * 0.3;
        head.rotation.y = 0.04 * Math.sin(t * 0.6) + 0.18 * sp;
        // both hands on the phone, the right thumb scrolling
        arms.forEach((a, i) => {
          const sx = i ? 1 : -1;
          a.rotation.x = -1.2 + (i ? 0.05 * Math.max(0, Math.sin(t * 7)) : 0);
          a.rotation.z = -sx * 0.55;
        });
        // the phone lifts a little when he looks up
        movil.position.y = 1.78 + 0.1 * sp; movil.rotation.x = -0.55 + 0.15 * sp;
        // what is on the screen changes every so often (a feed scrolling)
        const feed = Math.floor(t / 0.7);
        pantalla.material.color.setHex([0x8fd8ff, 0xffe08a, 0xffb0cf, 0xa6f08e, 0xc7b5ff][Math.floor(hash(feed + 5) * 5)]);
        luzMovil.color.copy(pantalla.material.color).lerp(new THREE.Color(0xffffff), 0.3);
        // beard from 19, grey from 50, white at 80; glasses from 42
        const kB = smooth(clamp((edad - 18) / 6));
        barba.visible = kB > 0.02; barba.scale.set(1, Math.max(0.02, kB), Math.max(0.3, kB));
        cBarba.copy(BR).lerp(GR, smooth(clamp((edad - 48) / 18))).lerp(BL, smooth(clamp((edad - 66) / 16)));
        BARBA.color.copy(cBarba); PELO.color.copy(cBarba);
        const kGaf = clamp((edad - 41.5) / 0.6);
        gafas.visible = kGaf > 0; gafas.scale.setScalar(kGaf < 1 ? 1 + 0.25 * Math.sin(Math.PI * kGaf) : 1);
        for (const p of piernas) { p.cad.rotation.x = -Math.PI / 2 + 0.05 + 0.03 * Math.sin(t * 0.8); p.rod.rotation.x = Math.PI / 2 - 0.12 + 0.12 * Math.sin(t * 1.7 + p.cad.position.x * 3) * (1 - kViejo); }

        // ---- camera: the character close up for the hook, then him and the whole wall (lit, then ghost) ----
        const xL = -1.95, xR = Math.max(1.3, X0 + lado + 0.15), yT = Math.max(1.4, YB + lado + 0.1);
        const ancho = xR - xL, cx = (xL + xR) / 2;
        let Hv = Math.max((ancho / 0.5625) * 1.1, yT / 0.31);
        let tx = cx, ty = yT * 0.5;
        // the hook: his face and the phone; it opens up during the question and the data line
        const estab = 1 - smooth(clamp((t - tZ0) / (tZ1 - tZ0)));
        Hv = lerp(Hv, 3.3, estab); tx = lerp(tx, -0.6, estab); ty = lerp(ty, 0.78, estab);
        Hv *= 1 + 0.08 * ramp(t, D - 4.5, D - 0.8);
        const dist = Hv / 0.6886;
        const az = lerp(-11 + 3 * Math.sin(t * 0.15), -20, estab) * RAD, el = lerp(9, 6, estab) * RAD;
        const target = v3(tx, ty, -0.5);
        camera.position.set(target.x + Math.sin(az) * Math.cos(el) * dist, target.y + Math.sin(el) * dist, target.z + Math.cos(az) * Math.cos(el) * dist);
        camera.lookAt(target);
        camera.updateMatrixWorld(); C.escala(target, dist);
        const pxCelda = (PASO / Hv) * H;
        const lejos = pxCelda < 15;
        marcos.visible = pants.visible = !lejos; pantHoy.visible = pantHoy.visible && !lejos;
        planoL.visible = lejos; planoG.visible = nG > 0;
        if (lejos) lienzoLuz(nVis, frac);
        if (nG > 0) lienzoFantasma(nVis, G0 + nG);
        // sun from the front-left, so the wall and his face are lit
        C.key.position.set(target.x - 0.35 * dist, target.y + 0.8 * dist, target.z + 0.6 * dist);
        // evening and night: lights go down, the screens and windows glow
        const noche = smooth(clamp((y - yNoche0) / (yNoche1 - yNoche0)));
        C.hemi.intensity = 1.3 * lerp(1, 0.32, noche); C.key.intensity = 2.4 * lerp(1, 0.22, noche); C.rim.intensity = 1.2 * lerp(1, 0.5, noche);
        ventanas.visible = noche > 0.15;
        scene.fog.near = Math.max(120, dist * 1.4); scene.fog.far = Math.max(900, dist * 6);
        const [, bot] = C.fondo(SKY, y);
        scene.fog.color.set(bot);
        scene.updateMatrixWorld();
        const txt = enDias(v);
        extraEl.textContent = txt; extraEl.style.opacity = txt ? 1 : 0; extraEl.style.transform = "none";
        C.pintar(t, y);
        // the HUD here is taller than usual (extra line and note): labels never go under it
        const topMin = hudEl.offsetTop + hudEl.offsetHeight + 18;
        labEls.forEach((el, k) => {
          if (!(parseFloat(el.style.opacity) > 0)) return;
          const top = parseFloat(el.style.top);
          if (top < topMin) { el.style.top = topMin + "px"; if (lineas[k]) lineas[k].setAttribute("y2", topMin + el.offsetHeight / 2); }
        });

        // ---- HUD: minutes, then hours; the time it took; and how many whole days that is ----
        altEl.innerHTML = hud(v);
        sinceEl.textContent = C.ESC.desde;
        clockEl.textContent = reloj(v);

        // ---- his age, above his head, once he gets the phone ----
        head.getWorldPosition(tmp); tmp.y += 0.42;
        const pe = toScreen(tmp), kE = ramp(t, tEstrena, tEstrena + 0.4);
        edadEl.textContent = `${Math.floor(edad + 1e-6)} AÑOS`;
        edadEl.style.opacity = kE;
        edadEl.style.left = clamp(pe.x - edadEl.offsetWidth / 2, 30, W - 30 - edadEl.offsetWidth) + "px";
        edadEl.style.top = clamp(pe.y - edadEl.offsetHeight - 26, 640, 1150) + "px";
      }
      await C.arrancar(renderAt);
    </script>
  </body>
