      cat.add(shadow(0.3, 0.17));

      // ---------- our character, between the comparison and the cat ----------
      const { kid, head: kidHead } = C.personaje(); kid.scale.setScalar(0.246); kid.position.set(0, 0, 0.25); kid.rotation.y = -0.35; scene.add(kid);
      scene.add(at(shadow(0.4, 0.25), 0, 0, 0.25));

      // ---------- the comparisons (each faces +x, real size; L = length, H = height) ----------
      function perro() {
        const g = new THREE.Group(), A = mat(0xe2b46a), B = mat(0xc89a52);
        g.add(at(box(0.85, 0.32, 0.3, A), 0, 0.55, 0));
        for (const [x, z] of [[0.3, 0.1], [0.3, -0.1], [-0.3, 0.1], [-0.3, -0.1]]) g.add(at(box(0.09, 0.42, 0.09, A), x, 0.21, z));
        const h = at(box(0.26, 0.24, 0.24, A), 0.5, 0.8, 0); g.add(h);
        h.add(at(box(0.14, 0.12, 0.16, A), 0.17, -0.05, 0)); h.add(at(box(0.04, 0.05, 0.06, mat(0x2b1d1a)), 0.25, -0.01, 0));
        for (const z of [-0.13, 0.13]) h.add(at(box(0.1, 0.16, 0.04, B), -0.02, -0.03, z));
        const t = at(box(0.05, 0.32, 0.05, A), -0.46, 0.68, 0); t.rotation.z = 0.8; g.add(t);
        return { g, L: 1.05, H: 0.95 };
      }
      function leon() {
        const g = new THREE.Group(), A = mat(0xd9a55a), M = mat(0x9a5a2a);
        g.add(at(box(1.6, 0.62, 0.6, A), 0, 0.95, 0));
        for (const [x, z] of [[0.6, 0.2], [0.6, -0.2], [-0.6, 0.2], [-0.6, -0.2]]) g.add(at(box(0.17, 0.66, 0.17, A), x, 0.33, z));
        g.add(at(box(0.5, 0.75, 0.82, M), 0.78, 1.25, 0));
        const h = at(box(0.42, 0.4, 0.42, A), 1.0, 1.25, 0); g.add(h);
        h.add(at(box(0.16, 0.16, 0.24, mat(0xf0c07a)), 0.25, -0.08, 0)); h.add(at(box(0.04, 0.06, 0.1, mat(0x2b1d1a)), 0.34, -0.02, 0));
        const t = at(box(0.06, 0.75, 0.06, A), -0.95, 1.05, 0); t.rotation.z = 1.0; g.add(t); g.add(at(box(0.14, 0.16, 0.14, M), -1.27, 1.25, 0));
        return { g, L: 2.4, H: 1.7 };
      }
      function oso() {
        const g = new THREE.Group(), A = mat(0xf3efe2);
        g.add(at(box(2.0, 0.95, 0.95, A), 0, 1.0, 0));
        for (const [x, z] of [[0.7, 0.3], [0.7, -0.3], [-0.7, 0.3], [-0.7, -0.3]]) g.add(at(box(0.3, 0.6, 0.3, A), x, 0.3, z));
        const h = at(box(0.5, 0.45, 0.45, A), 1.15, 1.15, 0); g.add(h);
        h.add(at(box(0.22, 0.2, 0.26, A), 0.3, -0.08, 0)); h.add(at(box(0.05, 0.07, 0.11, mat(0x1d1f3a)), 0.42, -0.03, 0));
        for (const z of [-0.17, 0.17]) h.add(at(box(0.08, 0.1, 0.08, A), -0.1, 0.26, z));
        return { g, L: 2.6, H: 1.5 };
      }
      function vaca() {
        const g = new THREE.Group(), A = mat(0xf7f7f2), B = mat(0x2b2b33);
        g.add(at(box(2.2, 1.0, 0.8, A), 0, 1.25, 0));
        [[-0.5, 1.4, 0.41, 0.6, 0.5], [0.4, 1.1, 0.41, 0.5, 0.4], [0.1, 1.5, -0.41, 0.7, 0.45], [-0.6, 1.05, -0.41, 0.4, 0.35]].forEach(([x, y, z, w, h]) => g.add(at(box(w, h, 0.02, B), x, y, z)));
        for (const [x, z] of [[0.8, 0.25], [0.8, -0.25], [-0.8, 0.25], [-0.8, -0.25]]) g.add(at(box(0.16, 0.8, 0.16, A), x, 0.4, z));
        g.add(at(box(0.3, 0.15, 0.3, PINK), -0.5, 0.7, 0));
        const h = at(box(0.5, 0.45, 0.4, A), 1.3, 1.55, 0); g.add(h);
        h.add(at(box(0.16, 0.22, 0.36, PINK), 0.3, -0.12, 0));
        for (const z of [-0.18, 0.18]) { const c = at(cone(0.05, 0.22, mat(0xe8dcc0), 5), -0.05, 0.3, z); c.rotation.x = z > 0 ? -0.5 : 0.5; h.add(c); }
        return { g, L: 2.7, H: 1.9 };
      }
      function coche() {
        const g = new THREE.Group(), R = mat(0xd63a3a, { roughness: 0.4, metalness: 0.2 }), GL = glow(0x9fd8ff, 0.95);
        g.add(at(box(4.3, 0.7, 1.8, R), 0, 0.65, 0));
        g.add(at(box(2.3, 0.62, 1.62, R), -0.25, 1.3, 0));
        for (const z of [-0.82, 0.82]) g.add(at(box(2.0, 0.42, 0.02, GL), -0.25, 1.32, z));
        g.add(at(box(0.02, 0.45, 1.4, GL), 0.91, 1.32, 0));
        for (const [x, z] of [[1.35, 0.92], [1.35, -0.92], [-1.35, 0.92], [-1.35, -0.92]]) { const w = at(cyl(0.34, 0.34, 0.24, mat(0x22242e), 14), x, 0.34, z); w.rotation.x = Math.PI / 2; g.add(w); }
        for (const z of [-0.6, 0.6]) g.add(at(box(0.04, 0.16, 0.3, glow(0xfff2c4)), 2.16, 0.75, z));
        return { g, L: 4.3, H: 1.62 };
      }
      function elefante() {
        const g = new THREE.Group(), A = mat(0x8c8f99), T = mat(0xf4efe2);
        g.add(at(box(4.0, 2.3, 2.3, A), 0, 2.6, 0));
        for (const [x, z] of [[1.4, 0.75], [1.4, -0.75], [-1.4, 0.75], [-1.4, -0.75]]) g.add(at(box(0.75, 1.5, 0.75, A), x, 0.75, z));
        const h = at(box(1.4, 1.5, 1.4, A), 2.3, 3.0, 0); g.add(h);
        for (const z of [-0.9, 0.9]) { const e = at(box(0.15, 1.6, 1.3, mat(0x7d808a)), -0.2, 0.1, z); e.rotation.y = z > 0 ? -0.35 : 0.35; h.add(e); }
        [[0.85, -0.6, 0.38], [0.95, -1.15, 0.34], [1.05, -1.65, 0.3]].forEach(([x, y, s]) => h.add(at(box(s, 0.6, s, A), x, y, 0)));
        for (const z of [-0.36, 0.36]) { const tu = at(cone(0.1, 0.8, T, 5), 0.9, -0.75, z); tu.rotation.z = -2.2; h.add(tu); }
        return { g, L: 5.4, H: 3.9 };
      }
      function ballena() {
        const g = new THREE.Group(), A = mat(0x4f6d8f), B = mat(0x9fb3c8);
        g.add(at(box(18, 3.4, 3.8, A), 0, 1.9, 0));
        g.add(at(box(6, 2.9, 3.5, A), 11.5, 1.65, 0));
        for (let i = 0; i < 6; i++) g.add(at(box(5.5, 0.1, 3.6, B), 11 - i * 0.2, 0.25 + i * 0.12, 0));
        g.add(at(box(5, 2.0, 2.4, A), -11.2, 1.4, 0));
        g.add(at(box(2.2, 0.4, 7.5, A), -14.5, 1.2, 0));
        for (const z of [-2.2, 2.2]) g.add(at(box(3.0, 0.3, 1.2, A), 5.5, 0.9, z));
        for (const z of [-1.76, 1.76]) g.add(at(box(0.2, 0.3, 0.3, mat(0x1d1f3a)), 13.8, 2.2, z));
        return { g, L: 31, H: 3.6 };
      }
      const MODELOS = { "LABRADOR": perro, "LEÓN": leon, "OSO POLAR": oso, "VACA": vaca, "COCHE": coche, "ELEFANTE": elefante, "BALLENA AZUL": ballena };
      // each comparison stays on stage from its landmark until the next comparison arrives
      const comps = [];
      for (const a of anchors) {
        const fab = MODELOS[a.hito.etiqueta];
        if (!fab) continue;
        const m = fab(); m.a = a; m.x = -0.5 - m.L / 2; m.g.add(shadow(m.L * 0.55, Math.max(0.35, m.L * 0.16))); m.g.visible = false; scene.add(m.g);
        comps.push(m);
      }
      comps.forEach((m, i) => (m.fin = comps[i + 1] ? comps[i + 1].a.t - 0.3 : Infinity));

      const labPos = { "PERSONA ADULTA": [kid, v3(0, 7.3, 0)], "TU GATO A LOS 15 AÑOS": [cat, v3(0.2, 0.48, 0)] };
      for (const m of comps) labPos[m.a.hito.etiqueta] = [m.g, v3(m.L * 0.25, m.H, 0)];
      C.etiquetas(labPos, [cat, v3(0.2, 0.48, 0)]);

      // the years go by: the afternoon turns golden at the very end
      const SKY = [[7, "#4fbfff", "#cfefff"], [38, "#4fbfff", "#cfefff"], [52, "#ff9a5a", "#ffe0b8"]];

      function renderAt(t) {
        const y = C.yAt(t), w = V(y), s = Math.cbrt(w / 4);
        // fatter as it grows: wider and a little rounder, same legs
        const fat = 1 + 0.18 * clamp(Math.log10(w / 4) / 2);
        cat.scale.setScalar(s); torso.scale.set(1, fat, fat * 1.08);
        cat.position.set(0.45 + 0.34 * s, 0, 0);
        head.rotation.y = -0.55 + Math.sin(t * 0.8) * 0.12; tail.rotation.z = 0.45 + Math.sin(t * 2.1) * 0.2;
        const catFront = cat.position.x + 0.37 * s, catH = 0.48 * s;
        // comparisons: drop in with a bounce, pop out when the next arrives
        let left = -0.5, objH = 0;
        for (const m of comps) {
          const kin = clamp((t - (m.a.t - 0.35)) / 0.55), kout = clamp((t - m.fin) / 0.3);
          const vis = kin * (1 - kout);
          m.g.visible = vis > 0.001;
          if (!m.g.visible) continue;
          const squash = kin > 0.7 ? 0.25 * Math.sin(Math.PI * (kin - 0.7) / 0.3) : 0;
          m.g.position.set(m.x, (1 - ease(kin)) * m.H * 2.5, 0);
          m.g.scale.set(1 + squash * 0.5, 1 - squash, 1 + squash * 0.5).multiplyScalar(1 - ease(kout));
          left = Math.min(left, lerp(-0.5, -0.6 - m.L, ease(kin) * (1 - ease(kout))));
          objH = Math.max(objH, m.H * vis);
        }
        // the kid keeps looking up at the cat
        kidHead.rotation.x = -0.15 - 0.45 * clamp((catH - 0.6) / 3);
        // frame cat + kid + comparison inside the band between the HUD and the captions
        // at the start the whole character is in shot (1.8 m), so the cat looks as small as it is
        const right = catFront + 0.15 * s, width = right - left, hS = Math.max(catH, objH, 1.8);
        const Hv = Math.max((width / 0.5625) * 1.12, hS / 0.25), cx = (left + right) / 2;
        const sway = Math.sin(t * 0.5) * 0.015 * Hv;
        const dist = (Hv / 0.6886) * (1 + 0.12 * ramp(t, D - 4.5, D - 1));
        camera.position.set(cx + sway, hS * 0.5 + Hv * 0.14, dist);
        camera.lookAt(cx, hS * 0.5, 0);
        camera.far = Math.max(400, dist * 6); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
        key.position.set(cx - Hv * 0.5, Hv, Hv * 0.7); key.target.position.set(cx, 0, 0);
        C.fondo(SKY, y);
        C.pintar(t, y);
      }
      await C.arrancar(renderAt);
    </script>
  </body>
