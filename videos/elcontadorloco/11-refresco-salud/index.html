        camera.position.copy(target).addScaledVector(dir, E.dist);
        camera.lookAt(target);
        camera.updateMatrixWorld(); C.escala(target, E.dist);
        scene.fog.near = Math.max(120, E.dist * 1.4); scene.fog.far = Math.max(900, E.dist * 6);
        const [, bot] = C.fondo(SKY, y);
        scene.fog.color.set(bot);
        scene.updateMatrixWorld();
        C.pintar(t, y);
        // counter: grams, then kilos of sugar; the clock, how long the habit has lasted
        altEl.innerHTML = hud(m);
        sinceEl.textContent = C.ESC.desde;
        clockEl.textContent = reloj(dias);
        tarjetas(t);
      }
      await C.arrancar(renderAt);
    </script>
