          const kin = clamp((t - (c.t - 0.12)) / 0.35), kout = clamp((t - c.hasta) / 0.3), vis = ease(kin) * (1 - kout);
          c.el.style.top = top + "px";
          c.el.style.opacity = vis;
          c.el.style.transform = `translateY(${(1 - ease(kin)) * 26}px) scale(${0.94 + 0.06 * ease(kin)})`;
          const [obj, local] = c.punto(), p = toScreen(obj.localToWorld(local.clone()));
          const on = vis > 0.01 && p.z < 1;
          [c.ln, c.dot].forEach((e) => e.setAttribute("opacity", on ? vis : 0));
          if (vis > 0.01) fase(c, t);
          if (!on) continue;
          const cy = clamp(p.y, top + 50, top + c.el.offsetHeight - 50);
          c.ln.setAttribute("x1", p.x); c.ln.setAttribute("y1", p.y); c.ln.setAttribute("x2", 556); c.ln.setAttribute("y2", cy);
          c.dot.setAttribute("cx", p.x); c.dot.setAttribute("cy", p.y);
        }
      }

      // ---------- the camera: a new framing every 2 or 3 s, travelling smoothly from one to the next ----------
      const tmpA = v3(0, 0, 0), tmpB = v3(0, 0, 0);
      const pt = (obj, x, y, z) => () => obj.localToWorld(v3(x, y, z));
      const entre = (obj, k, y = 0) => () => cap.getWorldPosition(tmpA).clone().lerp(obj.getWorldPosition(tmpB), k).add(v3(0, y, 0));
      const F = {
        cara: (d, az, el) => ({ mira: pt(head, 0, -0.3, 0.5), dist: d, az, el }),
        cap: (d, az, el) => ({ mira: pt(cap, 0, 0, 0), dist: d, az, el }),
        lampara: (d, az, el) => ({ mira: pt(lamparas[0], 0.4, 0, 0.3), dist: d, az, el }),
        base: (d, az, el) => ({ mira: pt(cap, 0, -1.1, 0), dist: d, az, el }),
        motor: (d, az, el) => ({ mira: pt(cap, 1.6, -0.25, 0), dist: d, az, el }),
        obj: (o, k, d, az, el, y = 0) => ({ mira: entre(o, k, y), dist: d * 1.3, az, el }),
      };
      // a new framing every ~2.4 s, alternating close and wide, plus beats tied to the voice (each object, as its card comes in)
      const FORZADAS = [
        [-1, F.cap(9.4, 14, 5)], [0.85, F.cara(4.0, 8, 3), 0.9],
        [2.6, F.cap(10.5, 24, -6), 1.1],
        [tDos - 0.9, F.lampara(5.0, 18, 6), 1.1], [tBuc - 1.0, F.obj(buzo, 0.8, 7.0, 22, 4), 1.1],
        [tMed - 1.0, F.obj(rape, 0.8, 7.0, 20, 3), 1.1], [tBal - 1.0, F.obj(ballena, 0.8, 9.5, 18, 3), 1.1],
        [tTit - 1.0, F.obj(titanic, 0.85, 10.5, 16, 5), 1.1], [tHad - 1.0, F.obj(paredes.children[0], 0.7, 9.5, 20, 2), 1.1],
        [tPez - 1.0, F.obj(babosa, 0.8, 6.6, 22, 3), 1.1], [tFon - 0.9, F.base(6.5, 20, 12), 1.1],
        [tPres - 0.7, F.cara(4.6, 10, 2), 1.0], [tEv - 0.8, F.obj(everest, 0.45, 15.5, 16, 5, 2.5), 1.3],
        [tVolver - 0.5, F.cap(11.0, 8, -34), 1.2], [tPreg - 0.7, F.cap(10.0, 18, -28), 1.2],
      ];
      const CERCA = [F.cara(3.9, -8, 3), F.lampara(4.6, 24, 7), F.motor(5.0, 30, 8), F.base(6.0, 14, 14), F.cara(4.2, 22, 2), F.cap(6.2, 6, 4)];
      const LEJOS = [F.cap(10.2, 30, 8), F.cap(9.0, -18, 10), F.cap(11.0, 12, -10), F.cap(8.6, 36, 3), F.cap(10.0, -8, 14), F.cap(9.4, 24, -4)];
      const ENC0 = FORZADAS.map(([t, e, dur]) => ({ t, ...e, dur }));
      for (let t = 4.8, k = 0; t < D - 3.2; t += 1.8, k++) if (!FORZADAS.some(([ft]) => t > ft - 0.9 && t < ft + 1.3)) ENC0.push({ t, ...(k % 2 ? LEJOS : CERCA)[(k >> 1) % 6], dur: 0.9 });
      ENC0.sort((a, b) => a.t - b.t);
      const ENCUADRES = [];
      ENC0.forEach((e, i) => ENCUADRES.push(i > 1 ? { ...e, t: Math.max(e.t, ENCUADRES[i - 1].t + 1.3) } : e));
      function encuadre(t) {
        let i = 0;
        while (i + 1 < ENCUADRES.length && t >= ENCUADRES[i + 1].t) i++;
        const b = ENCUADRES[i], a = ENCUADRES[Math.max(0, i - 1)];
        const k = i === 0 ? 1 : smooth(clamp((t - b.t) / (b.dur || 1.5)));
        const mira = a.mira().lerp(b.mira(), k);
        let dist = lerp(a.dist, b.dist, k), az = lerp(a.az, b.az, k), el = lerp(a.el, b.el, k);
        dist *= 1 + 0.04 * Math.sin(t * 0.37);
        az += 2 * Math.sin(t * 0.23) + 25 * C.impulso(t);
        return { mira, dist, az, el };
      }

      // ---------- depth: light, colour, fog ----------
      const SKY = [[0, "#4fc3f7", "#d6f2ff"], [0.9, "#1ea0e6", "#4fd0f5"], [8, "#1488d4", "#2aa6e8"], [16, "#0b5f9e", "#1280c0"], [23, "#073a6e", "#0a4f8a"], [27, "#041a38", "#052a52"], [30, "#020c1c", "#031428"], [34, "#010610", "#02101f"], [41, "#000308", "#010a14"]];
      const clamp01 = (x) => clamp(x, 0, 1);
      const altEl = document.getElementById("alt");
      const pregEl = document.getElementById("pregunta");
      const tmpC = new THREE.Color();
      scene.fog = new THREE.Fog(0x0a4f8a, 30, 80);

      function renderAt(t) {
        const y = C.yAt(t), vy = (C.yAt(t + 1 / 30) - C.yAt(t - 1 / 30)) * 15; // y: depth on the log scale; vy: speed
        const enSuperficie = 1 - clamp01(y / 0.9);
        const oleaje = Math.sin(t * 1.6) * 0.1 * enSuperficie;
        cap.position.set(0, -y + oleaje, 0); cap.rotation.z = 0.05 * Math.sin(t * 1.1) * (0.4 + enSuperficie); cap.rotation.x = 0.03 * Math.sin(t * 0.8);
        // ---- the character: alive (blinks and reacts at each landmark), looks around, then down ----
        P.animar(t);
        head.rotation.y = Math.sin(t * 0.9) * 0.3; head.rotation.x = 0.1 + 0.2 * clamp01((y - 28) / 10);
        // ---- light by depth ----
        const sol01 = 1 - clamp01((y - 10) / 18);
        C.hemi.intensity = 1.3 * (0.05 + 0.95 * sol01 * sol01);
        C.key.intensity = 2.4 * sol01 * sol01 * sol01;
        lampara.intensity = 15 * clamp01((y - 14) / 14); lampara.distance = 0;
        lamparaBase.intensity = 10 * clamp01((y - 30) / 8);
        const [, bot] = C.fondo(SKY, y);
        scene.fog.color.set(bot);
        scene.fog.near = lerp(30, 4, clamp01((y - 22) / 8)); scene.fog.far = lerp(80, 24, clamp01((y - 22) / 10));
        rayos.forEach((r, i) => { r.material.opacity = (0.11 + 0.04 * Math.sin(t * 0.8 + i)) * (1 - clamp01(y / 22)); r.position.x += 0; });
        // ---- the surface: waves, and the sky parts below the camera ----
        for (let i = 0; i < marPos.count; i++) marPos.setZ(i, marBase[i * 3 + 2] + 0.16 * Math.sin(marBase[i * 3] * 0.6 + t * 1.5) * Math.cos(marBase[i * 3 + 1] * 0.5 + t * 1.1));
        marPos.needsUpdate = true; mar.geometry.computeVertexNormals();
        barco.position.y = 0.15 + 0.07 * Math.sin(t * 1.3); barco.rotation.z = 0.04 * Math.sin(t * 1.1);
        sol.visible = y < 1.5;
        // ---- creatures ----
        peces.forEach((f) => { const u = f.userData; f.position.set(((u.x0 + t * u.v + 9) % 18) - 9 - 2, u.y + 0.2 * Math.sin(t * 2 + u.ph), u.z); f.rotation.y = 0; f.children[1].rotation.y = 0.5 * Math.sin(t * 9 + u.ph); });
        pez.visible = y < 22;
        buzo.position.y = S(332) + 0.12 * Math.sin(t * 1.4); buzo.children[3].rotation.z = 0;
        lure.scale.setScalar(1 + 0.25 * Math.sin(t * 5)); rape.position.y = S(1000) + 0.2 + 0.08 * Math.sin(t * 1.1);
        aguas.forEach((j) => { const u = j.userData; j.position.set(u.x + 0.3 * Math.sin(t * 0.7 + u.ph), u.y + 0.25 * Math.sin(t * 1.1 + u.ph), u.z); });
        colaB.rotation.y = 0.35 * Math.sin(t * 1.7); ballena.position.y = S(2992) + 0.1 + 0.1 * Math.sin(t * 0.9);
        titanic.rotation.z = 0.1 + 0.01 * Math.sin(t * 0.5);
        colaP.rotation.y = 0.5 * Math.sin(t * 4); babosa.position.y = S(8336) + 0.08 * Math.sin(t * 1.3);
        anfipodos.forEach((a) => { const u = a.userData; a.position.set(u.x + 0.3 * Math.sin(t * 0.6 + u.ph), FONDO_Y + 0.08, u.z); a.rotation.y = 0.8 * Math.sin(t * 0.5 + u.ph); });
        everest.visible = t > tEv - 1.2;
        // ---- marine snow: a fixed lattice around the capsule, so it streams by as you sink ----
        for (let i = 0; i < NN; i++) {
          nPos[i * 3] = (hash(i + 600) - 0.5) * 16;
          nPos[i * 3 + 1] = -y + (((hash(i + 700) * 22 + y + 11 + 0.15 * t * (0.5 + hash(i))) % 22) - 11);
          nPos[i * 3 + 2] = -5 + hash(i + 800) * 10;
        }
        nieveGeo.attributes.position.needsUpdate = true; nieveMat.opacity = 0.55 * clamp01(0.3 + y / 8);
        // ---- camera ----
        scene.updateMatrixWorld();
        const E = encuadre(t);
        const dir = v3(Math.sin(E.az * RAD) * Math.cos(E.el * RAD), Math.sin(E.el * RAD), Math.cos(E.az * RAD) * Math.cos(E.el * RAD));
        const right = v3(Math.cos(E.az * RAD), 0, -Math.sin(E.az * RAD));
        const target = E.mira.clone().addScaledVector(right, 0.075 * E.dist); target.y += 0.09 * E.dist;
        camera.position.copy(target).addScaledVector(dir, E.dist);
        // the camera never goes below the seabed
        camera.position.y = Math.max(camera.position.y, FONDO_Y + 0.35);
        camera.lookAt(target);
        camera.updateMatrixWorld(); C.escala(target, E.dist);
        scene.updateMatrixWorld();
        C.pintar(t, y);
        const kq = ramp(t, tPreg - 0.3, tPreg + 0.25);
        pregEl.style.opacity = kq; pregEl.style.transform = `scale(${0.92 + 0.08 * kq})`;
        tarjetas(t);
      }
      await C.arrancar(renderAt);
    </script>
  </body>
