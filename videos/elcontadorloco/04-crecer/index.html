        for (const [x, z] of [[0.7, 0.25], [0.7, -0.25], [-0.7, 0.25], [-0.7, -0.25]]) g.add(at(box(0.17, 1.75, 0.17, A), x, 0.87, z));
        const n = at(box(0.36, 2.5, 0.36, A), 0.85, 3.6, 0); n.rotation.z = -0.2; g.add(n);
        const h = at(box(0.75, 0.38, 0.36, A), 1.2, 5.05, 0); g.add(h);
        for (const z of [-0.1, 0.1]) h.add(at(box(0.06, 0.25, 0.06, B), -0.15, 0.3, z));
        h.add(at(box(0.03, 0.08, 0.06, mat(0x1d1f3a)), 0.1, 0.06, 0.18));
        return { g, L: 2.6, H: 5.5, top: v3(1.2, 5.3, 0) };
      }
      function edificio() {
        const g = new THREE.Group();
        g.add(at(box(8, 9, 8, mat(0xf0e2cf)), 0, 4.5, 0));
        g.add(at(box(8.4, 0.4, 8.4, mat(0xb5532e)), 0, 9.1, 0));
        windows(g, 8, 9, 8, 3, 4);
        return { g, L: 8.4, H: 9.3 };
      }
      function ballena() {
        // standing on its tail, so its length reads as a height
        const g = new THREE.Group(), w = new THREE.Group(), A = mat(0x4f6d8f), B = mat(0x9fb3c8);
        w.add(at(box(18, 3.4, 3.8, A), 0, 0, 0));
        w.add(at(box(6, 2.9, 3.5, A), 11.5, -0.25, 0));
        for (let i = 0; i < 5; i++) w.add(at(box(5.5, 0.1, 3.6, B), 11 - i * 0.2, -1.7 + i * 0.12, 0));
        w.add(at(box(5, 2.0, 2.4, A), -11.2, -0.5, 0));
        w.add(at(box(2.2, 0.4, 7.5, A), -14.5, -0.7, 0));
        for (const z of [-2.2, 2.2]) w.add(at(box(3.0, 0.3, 1.2, A), 5.5, -1.0, z));
        for (const z of [-1.76, 1.76]) w.add(at(box(0.3, 0.3, 0.2, mat(0x1d1f3a)), 13.6, 0.3, z));
        w.rotation.z = Math.PI / 2; w.position.y = 15.6; g.add(w);
        return { g, L: 4, H: 30.1 };
      }
      function giralda() {
        const g = new THREE.Group(), BR = mat(0xd9a066), ST = mat(0xf0dcb0);
        g.add(at(box(13.6, 70, 13.6, BR), 0, 35, 0));
        for (let f = 0; f < 6; f++) g.add(at(box(2, 5, 0.2, glow(0x3b2a20, 0.9)), 0, 12 + f * 10, 6.85));
        g.add(at(box(11, 16, 11, ST), 0, 78, 0));
        g.add(at(box(8, 8, 8, BR), 0, 90, 0));
        g.add(at(box(5, 5, 5, ST), 0, 96.5, 0));
        g.add(at(cone(2.5, 4, mat(0xc9a24a), 8), 0, 101, 0));
        g.add(at(box(0.6, 3, 0.6, mat(0x5b4a2a)), 0, 104, 0));
        return { g, L: 13.6, H: 105.5 };
      }
      function sagrada() {
        const g = new THREE.Group(), S = mat(0xd8c9a8), S2 = mat(0xc9b68f);
        g.add(at(box(60, 45, 40, S2), 0, 22.5, 0));
        const torre = (x, z, h, r) => { g.add(at(cyl(r * 0.75, r, h - r * 3, S, 10), x, (h - r * 3) / 2, z)); g.add(at(cone(r * 0.75, r * 3, S, 10), x, h - r * 1.5, z)); };
        for (const x of [-20, -7, 7, 20]) { torre(x, 18, 105, 4); torre(x, -18, 110, 4); }
        for (const [x, z] of [[-12, 8], [12, 8], [-12, -8], [12, -8]]) torre(x, z, 135, 5);
        torre(0, -10, 138, 5);
        torre(0, 0, 166, 7);
        g.add(at(box(1.2, 8, 1.2, glow(0xffffff)), 0, 168.5, 0)); g.add(at(box(6, 1.2, 1.2, glow(0xffffff)), 0, 169.5, 0));
        return { g, L: 60, H: 172.5 };
      }
      function cristal() {
        const g = new THREE.Group();
        g.add(at(box(40, 225, 40, mat(0x5fa8d8, { roughness: 0.3, metalness: 0.2 })), 0, 112.5, 0));
        g.add(at(box(42, 24, 42, mat(0x9fe8c8, { emissive: 0x3fbf8f, emissiveIntensity: 0.4 })), 0, 237, 0));
        windows(g, 40, 225, 40, 18, 6, 0xcfefff);
        return { g, L: 42, H: 249 };
      }
      const MODELOS = { "PUERTA": casa, "CANASTA": canasta, "JIRAFA": jirafa, "EDIFICIO DE 3 PLANTAS": edificio, "BALLENA AZUL": ballena, "GIRALDA": giralda, "SAGRADA FAMILIA": sagrada, "TORRE DE CRISTAL": cristal };
      const comps = [];
      for (const a of anchors) {
        const fab = MODELOS[a.hito.etiqueta];
        if (!fab) continue;
        const m = fab(); m.a = a; m.desde = a.hito.etiqueta === "PUERTA" ? -1 : a.t - 0.35;
        m.g.add(shadow(m.L * 0.6, m.L * 0.35)); m.g.visible = false; scene.add(m.g); comps.push(m);
      }
      comps.forEach((m, i) => {
        m.fin = comps[i + 1] ? comps[i + 1].a.t - 0.3 : Infinity;
        // stand just left of where the character will be at its widest while this one is on stage
        const hMax = V(C.yAt(Math.min(m.fin, D)));
        m.x = -(0.26 * hMax + Math.max(0.35, 0.06 * hMax) + m.L / 2);
      });

      const labPos = { "TÚ, A LOS 84 AÑOS": [kid, v3(0, 7.0, 0)] };
      for (const m of comps) labPos[m.a.hito.etiqueta] = [m.g, m.top || v3(m.L * 0.2, m.H, 0)];
      labPos["PUERTA"] = [comps[0].g, v3(0.6, 2.03, -0.6)];
      labPos["TECHO DE CASA"] = [comps[0].g, v3(1.2, 2.56, 0)];
      C.etiquetas(labPos, [kid, v3(0, 7.0, 0)]);

      const SKY = [[0, "#4fbfff", "#cfefff"], [20, "#3aaeff", "#bfe8ff"], [24, "#ff9a5a", "#ffe0b8"]];

      function renderAt(t) {
        const y = C.yAt(t), h = V(y), k = 0.246 * (h / 1.7);
        kid.scale.setScalar(k); kidShadow.scale.set(0.3 * h, 0.18 * h, 1);
        P.animar(t);
        head.rotation.y = 0.2 + Math.sin(t * 0.7) * 0.2; head.rotation.x = Math.sin(t * 0.9) * 0.05;
        // landmarks rise out of the ground with a little overshoot, and sink when the next one comes
        let left = -0.32 * h, objH = 0;
        for (const m of comps) {
          const kin = m.desde < 0 ? 1 : clamp((t - m.desde) / 0.6), kout = clamp((t - m.fin) / 0.35);
          const vis = kin * (1 - kout);
          m.g.visible = vis > 0.001;
          if (!m.g.visible) continue;
          const up = kin < 1 ? 1 - Math.pow(1 - kin, 3) + 0.12 * Math.sin(Math.PI * kin) : 1;
          m.g.position.set(m.x, 0, 0);
          m.g.scale.set(1, Math.max(0.001, up * (1 - ease(kout))), 1);
          left = Math.min(left, lerp(-0.32 * h, m.x - m.L / 2 - 0.2, ease(kin) * (1 - ease(kout))));
          objH = Math.max(objH, m.H * vis);
        }
        // frame the character and the landmark between the HUD and the captions
        const right = 0.32 * h, width = right - left, hS = Math.max(h, objH);
        const Hv = Math.max((width / 0.5625) * 1.12, hS / 0.25), cx = (left + right) / 2;
        const sway = Math.sin(t * 0.5) * 0.015 * Hv;
        const dist = (Hv / 0.6886) * (1 + 0.12 * ramp(t, D - 4.5, D - 1));
        camera.position.set(cx + sway, hS * 0.5 + Hv * 0.14, dist);
        camera.lookAt(cx, hS * 0.5, 0);
        camera.updateMatrixWorld(); C.escala(v3(cx, hS * 0.5, 0), dist);
        // haze starts beyond the subject, whatever the zoom
        scene.fog.near = Math.max(300, dist * 1.4); scene.fog.far = Math.max(3000, dist * 6);
        const [, bot] = C.fondo(SKY, y); scene.fog.color.set(bot);
        C.pintar(t, y);
      }
      await C.arrancar(renderAt);
    </script>
