      rasca.add(at(cyl(2.5, 6, 88, mat(0xe8eef5, { metalness: 0.5, roughness: 0.3 }), 8), 0, 784, 0));
      const punta = new THREE.Object3D(); punta.position.set(0, 828, 0); rasca.add(punta);
      // clouds between 1.1 and 1.6 km, never right next to the column
      const nubes = new THREE.Group(); scene.add(nubes);
      for (let i = 0; i < 60; i++) {
        const ang = hash(i + 400) * Math.PI * 2, r = 150 + hash(i + 410) * 2600, cx = 3 + Math.cos(ang) * r, cz = Math.sin(ang) * r;
        // keep the line of sight from the top of the column to the skyscraper clear
        const dAng = Math.abs(((ang - Math.atan2(RZ, RX - 3)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI);
        if (dAng < 0.45 && r > 400 && r < 1600) continue;
        const n = new THREE.Group(); n.position.set(cx, 1100 + hash(i + 420) * 500, cz);
        for (let k = 0; k < 4; k++) n.add(at(new THREE.Mesh(new THREE.IcosahedronGeometry(30 + hash(i * 4 + k) * 30, 0), mat(0xffffff, { roughness: 1 })), (k - 1.5) * 38, hash(i * 7 + k) * 14, (hash(i * 9 + k) - 0.5) * 30));
        nubes.add(n);
      }

      // ---------- the column of empty cans: the top 260 are real cans, below them a plain column ----------
      const COLX = 3.1, COLZ = -0.3, NT = 260;
      const geoCuerpo = new THREE.CylinderGeometry(0.033, 0.033, 0.1, 16), geoBanda = new THREE.CylinderGeometry(0.0333, 0.0333, 0.026, 16), geoTapa = new THREE.CylinderGeometry(0.029, 0.033, 0.008, 16);
      const tCuerpo = new THREE.InstancedMesh(geoCuerpo, CARAMELO, NT), tBanda = new THREE.InstancedMesh(geoBanda, CREMA, NT), tTapa = new THREE.InstancedMesh(geoTapa, PLATA, NT);
      [tCuerpo, tBanda, tTapa].forEach((m) => { m.frustumCulled = false; m.count = 0; scene.add(m); });
      const fuste = new THREE.Mesh(new THREE.CylinderGeometry(0.033, 0.033, 1, 12), mat(0x7a3a1e, { roughness: 0.4, metalness: 0.15 })); fuste.visible = false; scene.add(fuste);
      function columna(Ht) {
        const n = Math.min(NT, Math.ceil(Ht / ALTO_LATA));
        [tCuerpo, tBanda, tTapa].forEach((m) => (m.count = n));
        for (let k = 0; k < n; k++) {
          const y0 = Ht - (k + 1) * ALTO_LATA;
          tCuerpo.setMatrixAt(k, m4.makeTranslation(COLX, y0 + 0.0576, COLZ));
          tBanda.setMatrixAt(k, m4.makeTranslation(COLX, y0 + 0.064, COLZ));
          tTapa.setMatrixAt(k, m4.makeTranslation(COLX, y0 + 0.1112, COLZ));
        }
        [tCuerpo, tBanda, tTapa].forEach((m) => (m.instanceMatrix.needsUpdate = true));
        const resto = Ht - NT * ALTO_LATA;
        fuste.visible = resto > 0.01;
        if (fuste.visible) { fuste.scale.set(1, resto, 1); fuste.position.set(COLX, resto / 2, COLZ); }
      }

      // ---------- labels: their own format (grams, decimals) ----------
      const labPos = { "PERSONA ADULTA": [kid, v3(0, 7.3, 0)], "1 AÑO": [cima, v3(0, 0, 0)], "A LOS 84": [cima, v3(0, 0, 0)] };
      for (const c of comps) labPos[c.a.hito.etiqueta] = [c.ancla, v3(0, 0, 0)];
      C.etiquetas(labPos, [cima, v3(0, 0, 0)]);
      const labEls = [...document.querySelectorAll("#labels .lab")];
      const TEXTOS = { "UNA LATA": "UNA LATA · <b>35 g</b>", "PAQUETE DE AZÚCAR": "PAQUETE DE AZÚCAR · <b>1 kg</b>", "1 AÑO": "1 AÑO · <b>12,8 kg</b>", "MALETA FACTURADA": "MALETA FACTURADA · <b>23 kg</b>", "PERSONA ADULTA": "PERSONA ADULTA · <b>70 kg</b>", "VACA": "VACA · <b>600 kg</b>", "A LOS 84": "A LOS 84 · <b>844 kg</b>" };
      anchors.filter((a) => a.hito.etiqueta).forEach((a, i) => { if (labEls[i]) labEls[i].innerHTML = TEXTOS[a.hito.etiqueta]; });
      const marcas = [...document.querySelectorAll("#leaders line, #leaders circle")];
      const altEl = document.getElementById("alt"), sinceEl = document.getElementById("since"), clockEl = document.getElementById("clock");
      const extraEl = document.getElementById("extra"), hudEl = document.getElementById("hud"), edadEl = document.getElementById("edad"), rascaEl = document.getElementById("rasca");
      const lineas = [...document.querySelectorAll("#leaders line")];

      // the years go by: the afternoon turns golden towards 84; up the column the sky gets deeper
      const SKY = [[0, "#4fbfff", "#cfefff"], [22, "#4fbfff", "#cfefff"], [29.6, "#ffb36b", "#ffe2b8"]];
      const SKY2 = [[0, "#ffb36b", "#ffe2b8"], [12, "#f7a868", "#ffdcb0"], [24, "#5a8fe0", "#ffc89a"], [34.5, "#2f5fc4", "#f7b989"]];
      const tAmigo = (buscar("amigo", 15) || { s: 19 }).s;
      // the hook framing (him and his can) stays through "una lata normal de cola", then goes down to the floor for the 35 g
      const tZ1 = tDe(A["UNA LATA"], 12) - 0.3, tZ0 = Math.max(L[0] ? L[0].e + 0.6 : 2.6, tZ1 - 3);
      const toScreen = (p) => { const q = p.clone().project(camera); return { x: (q.x + 1) * 0.5 * W, y: (1 - q.y) * 0.5 * H, z: q.z }; };
      const tmp = new THREE.Vector3(), camA = new THREE.Vector3(), mirA = new THREE.Vector3(), camB = new THREE.Vector3(), mirB = new THREE.Vector3();

      function renderAt(t) {
        const m = kilosAt(t), y = Y(m), dias = m / LATA, edad = 18 + dias / DIA;
        const Ht = torreAt(t), kRide = smooth(clamp((t - tL) / 1.6));
        // ---- comparisons: drop in with a bounce, pop out when the next one arrives ----
        let objH = 0, objL = 0, left = -0.12;
        for (const c of comps) {
          c.kin = clamp((t - (c.a.t - 0.35)) / 0.55); c.kout = clamp((t - c.fin) / 0.3); c.vis = c.kin * (1 - c.kout);
          objL = Math.max(objL, c.L * c.vis); objH = Math.max(objH, c.H * c.vis);
        }
        const Rw = Rm(m), S = Math.max(1, Math.cbrt(m / MN)), Rl = Rm(Math.min(m, MN));
        const gap = 0.05 + 0.35 * clamp(Math.max(Rw, objL * 0.5) / 1.2);
        for (const c of comps) {
          c.ancla.position.set(-gap - c.L / 4, c.H, c.z);
          c.g.visible = c.vis > 0.001;
          if (!c.g.visible) continue;
          const squash = c.kin > 0.7 ? 0.25 * Math.sin((Math.PI * (c.kin - 0.7)) / 0.3) : 0;
          c.g.position.set(-gap - c.L / 2, (1 - ease(c.kin)) * c.H * 2.5, c.z);
          c.g.scale.set(1 + squash * 0.5, 1 - squash, 1 + squash * 0.5).multiplyScalar(1 - ease(c.kout));
          left = Math.min(left, lerp(-0.12, -gap - c.L - 0.05, ease(c.kin) * (1 - ease(c.kout))));
        }
        const charVis = A["PERSONA ADULTA"] ? ramp(t, A["PERSONA ADULTA"].t - 0.7, A["PERSONA ADULTA"].t + 0.2) : 1;
        kid.position.x = lerp(-0.35, 0, clamp((gap - 0.1) / 0.2));
        left = Math.min(left, lerp(-0.12, kid.position.x - 0.7, charVis));
        // ---- sugar mound ----
        const hx = gap + Rw;
        heap.position.set(hx, 0, 0); heap.scale.setScalar(S);
        core.visible = Rl > 0.03; core.scale.set(Rl * 0.93, HK * Rl, Rl * 0.93);
        const n = m <= 0 ? 0 : Math.min(NI, 1 + Math.floor(m / MI));
        for (const T of TIPOS) { let k = 0; while (k < T.lista.length && T.lista[k].i < n) k++; T.mesh.count = k; }
        const s0 = Math.cbrt(clamp(m / MI)) * primero.s * 1.6;
        T0.mesh.setMatrixAt(0, m4.compose(v3(0, T0.hy * s0, 0), primero.q, v3(s0, s0, s0))); T0.mesh.instanceMatrix.needsUpdate = true;
        const topL = HK * Rl + 0.02, Hw = topL * S;
        cima.position.set(hx, Hw + 0.02 * S, 0);
        cayendo.forEach((f, i) => {
          const k = (t * 1.1 + i / 3) % 1, caida = Math.max(0.3, 1.6 * Rl) * S;
          f.visible = m > 2 && t < tL && k < 0.95;
          f.position.set(hx + (hash(i + 40) - 0.5) * 0.4 * Rl * S, Hw + (1 - k * k) * caida, (hash(i + 41) - 0.5) * 0.3 * Rl * S);
          f.rotation.set(t * (1 + i), t * 0.7, 0.3 * Math.sin(t * 3 + i));
        });
        // ---- the character: holds his can, looks at each new object, gets older ----
        P.animar(t);
        const sb = 0;
        // the arm holding the can, forearm forward; the can bobs a little with it
        const bob = 0.04 * Math.sin(t * 1.3);
        arms[1].rotation.x = -1.5 + bob; arms[1].rotation.z = 0.15;
        lataMano.position.y = 1.68 + bob * 1.8;
        const mira = comps.reduce((s, c) => Math.max(s, ramp(t, c.a.t - 0.2, c.a.t + 0.3) * (1 - ramp(t, c.a.t + 1.8, c.a.t + 2.4))), 0);
        head.rotation.y = lerp(0.45, -0.55, mira) * (1 - sb) + Math.sin(t * 0.9) * 0.06;
        head.rotation.x = lerp(lerp(0.3, -0.35, clamp(Hw / 2.2)), -0.22, sb);
        const kB = smooth(clamp((edad - 21) / 5));
        barba.visible = kB > 0.02; barba.scale.set(1, Math.max(0.02, kB), Math.max(0.3, kB));
        cBarba.copy(BR).lerp(GR, smooth(clamp((edad - 48) / 18))).lerp(BL, smooth(clamp((edad - 66) / 16)));
        BARBA.color.copy(cBarba);
        const kGaf = clamp((edad - 44.5) / 0.6);
        gafas.visible = kGaf > 0; gafas.scale.setScalar(kGaf < 1 ? 1 + 0.25 * Math.sin(Math.PI * kGaf) : 1);
        body.rotation.x = 0.1 * smooth(clamp((edad - 62) / 22));

        // ---- the column of cans ----
        columna(Ht);

        // ---- camera A: heap + objects (+ the whole character from "persona adulta" on), between the HUD and the captions ----
        const estab = 1 - ramp(t, tZ0, tZ1);
        const right = Math.max(hx + Rw * 1.08 + 0.04, Ht > 0 ? COLX + 0.3 : -9);
        const hS = Math.max(Hw, objH, 1.85 * charVis, Math.min(Ht, 2.2), lerp(0.07, 0.83, estab));
        const width = Math.max(right - left, lerp(0, 1.1, estab));
        const cx = lerp((left + right) / 2, -0.15, estab);
        const Hv = Math.max((width / 0.5625) * 1.12, hS / 0.25);
        const sway = Math.sin(t * 0.5) * 0.015 * Hv;
        const distA = Hv / 0.6886;
        const kChico = clamp((1.4 - Hv) / 0.9);
        // the hook frames him from the chest up, with his can
        const cyA = lerp(hS * 0.5, 1.1, estab);
        camA.set(cx + sway, cyA + Hv * (0.14 + 0.5 * kChico * (1 - estab)), distA);
        mirA.set(cx, cyA, 0);

        // ---- camera B: riding the top of the column; it looks ahead at first, then down at everything below ----
        const kAbajo = smooth(clamp((Y(Ht) - Y(400)) / (Y(ALTO_TORRE) - Y(400))));
        const off = lerp(1.6, 2.4, kAbajo);
        camB.set(COLX + 0.55, Ht + 0.12 + 0.6 * kAbajo, COLZ + off);
        const giro = 0.018 * Math.max(0, t - tTop);
        const pitch = lerp(-10, -50, kAbajo) * RAD, yaw = Math.atan2(RX - COLX, -(RZ - COLZ)) - giro;
        camB.set(COLX + 0.55 * Math.cos(giro) + off * Math.sin(giro), camB.y, COLZ + off * Math.cos(giro) - 0.55 * Math.sin(giro));
        mirB.set(camB.x + Math.sin(yaw) * Math.cos(pitch) * 10, camB.y + Math.sin(pitch) * 10, camB.z - Math.cos(yaw) * Math.cos(pitch) * 10);
        // low on the column the camera looks at its top from the front, so the hand-over from camera A is smooth
        const kCerca = 1 - smooth(clamp((Ht - 0.5) / 6));
        const mirTop = v3(COLX, Math.max(0.3, Ht - 0.25), COLZ);
        mirB.lerp(mirTop, kCerca);
        camB.lerp(v3(COLX + 0.4, Math.max(0.6, Ht + 0.2), COLZ + 2.6), kCerca);

        const cam = camA.clone().lerp(camB, kRide), mir = mirA.clone().lerp(mirB, kRide);
        camera.fov = lerp(38, 62, kRide * kAbajo); camera.updateProjectionMatrix();
        camera.position.copy(cam); camera.lookAt(mir);
        camera.updateMatrixWorld();
        const dCam = cam.distanceTo(mir);
        C.escala(mir, lerp(distA, 3, kRide));
        if (kRide > 0) { camera.near = lerp(camera.near, 0.25 + 0.15 * kAbajo, kRide); camera.far = Math.max(camera.far, Ht * 3 + 6000); camera.updateProjectionMatrix(); }
        scene.fog.near = kRide > 0.5 ? 4000 : Math.max(120, distA * 1.4); scene.fog.far = kRide > 0.5 ? 16000 : Math.max(900, distA * 6);
        const [, bot] = kRide > 0 ? C.fondo(SKY2, Y(Ht)) : C.fondo(SKY, y);
        scene.fog.color.set(bot);
        scene.updateMatrixWorld();

        // ---- HUD: grams, then kilos; the time it took; the cans. Up the column: its height and its cans ----
        let txt;
        if (t < tL + 0.6) txt = dias >= 1 ? `= ${miles(Math.floor(dias + 1e-6))} ${Math.floor(dias + 1e-6) === 1 ? "lata" : "latas"}` : "";
        else txt = `= ${miles(m)} kg de azúcar`;
        extraEl.textContent = txt; extraEl.style.opacity = txt ? 1 : 0; extraEl.style.transform = "none";
        C.pintar(t, y);
        if (t < tL + 0.6) {
          const [num, unit] = fmt(m);
          altEl.innerHTML = `${num}<small>${unit}</small>`;
          const porEdad = L[9] && t >= L[9].s - 0.2;
          sinceEl.textContent = porEdad ? "AZÚCAR A LOS" : C.ESC.desde;
          clockEl.textContent = porEdad ? plural(Math.floor(edad + 1e-6), "año", "años") : reloj(dias);
        } else {
          altEl.innerHTML = `${miles(Ht)}<small>m</small>`;
          sinceEl.textContent = "TORRE DE LATAS";
          clockEl.textContent = `${miles(Math.min(N_LATAS, Ht / ALTO_LATA))} latas`;
        }
        // labels never go under the HUD; and up the column they leave
        const topMin = hudEl.offsetTop + hudEl.offsetHeight + 18, fuera = 1 - ramp(t, tL, tL + 0.5);
        labEls.forEach((el, k) => {
          if (!(parseFloat(el.style.opacity) > 0)) return;
          el.style.opacity = parseFloat(el.style.opacity) * fuera;
          const top = parseFloat(el.style.top);
          if (top < topMin) { el.style.top = topMin + "px"; if (lineas[k]) lineas[k].setAttribute("y2", topMin + el.offsetHeight / 2); }
        });
        if (fuera < 1) marcas.forEach((e) => e.setAttribute("opacity", parseFloat(e.getAttribute("opacity") || 1) * fuera));

        // ---- his age above his head (from "nuestro amigo" until the ride) ----
        head.getWorldPosition(tmp); tmp.y += 0.45;
        const otras = labEls.reduce((s, el) => Math.max(s, parseFloat(el.style.opacity) || 0), 0);
        const pe = toScreen(tmp), kE = ramp(t, tAmigo, tAmigo + 0.4) * (1 - ramp(t, tL, tL + 0.5)) * (1 - clamp(otras * 3));
        edadEl.textContent = `${Math.floor(edad + 1e-6)} AÑOS`;
        edadEl.style.opacity = kE;
        edadEl.style.left = clamp(pe.x - edadEl.offsetWidth / 2, 30, W - 30 - edadEl.offsetWidth) + "px";
        edadEl.style.top = clamp(pe.y - edadEl.offsetHeight - 26, topMin, 1150) + "px";
        // ---- the skyscraper's label, pointing at its spire, once the column is high ----
        punta.getWorldPosition(tmp);
        const pr = toScreen(tmp), kR = ramp(Ht, 250, 500) * (pr.z < 1 && pr.y > 0 && pr.y < H ? 1 : 0);
        rascaEl.style.opacity = kR;
        rascaEl.style.left = clamp(pr.x - rascaEl.offsetWidth / 2, 30, W - 30 - rascaEl.offsetWidth) + "px";
        rascaEl.style.top = clamp(pr.y - rascaEl.offsetHeight - 24, topMin, 1500) + "px";
      }
      await C.arrancar(renderAt);
    </script>
