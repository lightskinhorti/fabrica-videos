        caderas[0].rotation.x = 0.5 * Math.sin(paso); caderas[1].rotation.x = -0.5 * Math.sin(paso);
        P.arms[0].rotation.x += -0.45 * Math.sin(paso); P.arms[1].rotation.x += 0.45 * Math.sin(paso);
        head.rotation.y = 0.18 * Math.sin(t * 0.7); head.rotation.x = -0.05;
        palomas.forEach((p, i) => (p.userData.cab.position.y = 0.26 - 0.08 * Math.max(0, Math.sin(t * 5 + i * 2))));

        // ---- camera: by the counter, then the Moon reveal and the final zoom by time ----
        K[0] = { T: kid.position.clone().add(v3(0, 0.95, 0)), d: 11.5, dir: dirAzEl(26, 8), up: UP };
        let cam;
        if (y >= YK[6]) cam = K[6];
        else {
          let i = 0; while (i < 5 && y >= YK[i + 1]) i++;
          const k = (y - YK[i]) / (YK[i + 1] - YK[i]);
          cam = mezcla(K[i], K[i + 1], k);
          // leaving the square: rise first, swing round once above the roofs
          if (i === 0) cam = { ...cam, dir: dirAzEl(lerp(26, 72, smooth(clamp((k - 0.3) / 0.7))), lerp(8, 42, smooth(clamp(k / 0.35)))) };
        }
        const m = smooth(clamp((t - tMitad + 0.3) / 1.8));
        cam = mezcla(cam, K7, m);
        cam = mezcla(cam, K8, (y - YK[6]) / (Y(LUNA_D) - YK[6]));
        const kz = smooth(clamp((t - tAsi - 0.1) / Math.max(1.6, Math.min(2.8, tCohete + 0.3 - tAsi - 0.1))));
        // sizes: the Earth and the Moon grow (as drawings) when both have to fit in the shot, the Earth shrinks again from the Moon
        const Se = lerp(1, SM, m) * lerp(1, 0.38, smooth(clamp((t - tAsi) / 1.5))), Sm = lerp(1, SM, m);
        tierra.scale.setScalar(Se); luna.scale.setScalar(Sm); pie.scale.setScalar(1 / Sm);
        tierra.quaternion.identity().slerp(qEspana, kz); // from the Moon, Spain turns towards us
        if (kz > 0) {
          luna.updateMatrixWorld(true);
          // the camera comes down from above the character, then tilts up to eye level with the Earth behind
          const T9 = pie.localToWorld(v3(0, 2.5, 0));
          const q = new THREE.Quaternion(); pie.getWorldQuaternion(q);
          const swing = 0.8 * Math.sin((t - tAsi) * 0.4);
          const d9 = 14 * (1 + 0.15 * ramp(t, D - 3.2, D - 0.3)), upW = UP.clone().applyQuaternion(q), eW = eH.clone().applyQuaternion(q);
          const dir9 = dirAzEl(azFin + swing, 0).applyQuaternion(q);
          const dk = Math.exp(lerp(Math.log(cam.d), Math.log(d9), kz)), wk = clamp((dk - cam.d) / (d9 - cam.d));
          const k1 = clamp(kz / 0.42), k2 = clamp((kz - 0.42) / 0.58);
          cam = { T: cam.T.clone().lerp(T9, wk), d: dk,
            dir: kz < 0.42 ? slerpDir(cam.dir, upW, smooth(k1)) : slerpDir(upW, dir9, smooth(k2)),
            up: kz < 0.42 ? slerpDir(cam.up, eW, smooth(k1)) : slerpDir(eW, upW, smooth(k2)) };
        }
        const sway = 0.035 * Math.sin(t * 0.33) * (1 - kz);
        const dir = cam.dir.clone().applyAxisAngle(cam.up, sway);
        camera.up.copy(cam.up);
        camera.position.copy(cam.T).addScaledVector(dir, cam.d);
        camera.setViewOffset(W, H, 0, 45, W, H);
        camera.lookAt(cam.T); camera.updateMatrixWorld();
        C.escala(cam.T, cam.d);
        camera.far = Math.max(camera.far, cam.d * 3000, 30000); if (kz > 0.9) camera.far = 2e9; camera.updateProjectionMatrix();
        const d = cam.d;

        // ---- what is on screen at each scale ----
        calle.visible = d < 3000; kid.visible = d < 500;
        ciudad.visible = d < 900000 && Se < 1.01; pueblos.visible = d > 3000 && d < 1.5e6 && Se < 1.01;
        const op = (a, b, c2, e) => clamp((y - a) / (b - a)) * (1 - clamp((y - c2) / (e - c2)));
        const opR = op(40, 44, 62, 65) * (Se < 1.01 ? 1 : 0); rios.visible = opR > 0.01; rios.children.forEach((l) => { l.material.opacity = opR; l.castShadow = false; });
        lToledo.hasta(v / 71000, (1 - clamp((y - 60) / 4)) * (Se < 1.01 ? 1 : 0));
        lCamino.hasta(v / 780000, op(48.6, 50.5, 66, 70) * (Se < 1.01 ? 1 : 0));
        lLazo.hasta((v / VUELTA) * PPV / (lazo.length - 1), op(58.9, 60.5, 999, 1000) * clamp(1 - kz * 3));
        const fuera = clamp(1 - kz * 3); lMoon.hasta(v / LUNA_D, m * fuera); lMoonFondo.visible = m * fuera > 0.01; lMoonFondo.material.opacity = 0.55 * m * fuera;
        luna.visible = m > 0.001 || y > YK[6] + 0.01;
        atmos.visible = d > 1.2e6;
        // markers: the walker, and the cities of each stretch
        let head3 = null, op3 = 0;
        if (m > 0.5 || y > YK[6] + 0.01) { head3 = enRuta(moonPts, v / LUNA_D); op3 = clamp((m - 0.5) * 3) * clamp(1 - kz * 5); }
        else if (v <= 71000) { head3 = enRuta(rutaToledo, v / 71000); op3 = clamp((d - 400) / 600); }
        else if (v <= 780000) { head3 = enRuta(rutaCamino, v / 780000); op3 = 1; }
        else { tierra.updateMatrixWorld(true); head3 = tierra.localToWorld(enLazo(v)); op3 = 1 - m * 2; }
        const delante = (p) => p.clone().sub(CENTER).dot(camera.position.clone().sub(p)) > 0 || d < 3e6;
        yo.position.copy(head3); yo.material.opacity = clamp(op3) * (delante(head3) ? 1 : 0); yo.visible = yo.material.opacity > 0.01;
        yo.scale.setScalar((yo.userData.px * (1 + 0.1 * Math.sin(t * 6))) / 2788);
        const ver = (s, p, o) => { s.position.copy(p); s.material.opacity = o * (delante(p) ? 1 : 0); s.visible = s.material.opacity > 0.01; };
        ver(pToledo, oToledo.position, op(45, 47, 62, 64) * (Se < 1.01 ? 1 : 0));
        ver(pSantiago, oSantiago.position, op(54, 56, 66, 69) * (Se < 1.01 ? 1 : 0));
        tierra.updateMatrixWorld(true);
        ver(pNY, oNY.getWorldPosition(tmp).clone(), op(62, 64.5, 78, 80));

        // ---- sky, fog, lights, stars ----
        const [, bot] = C.fondo(SKY, y);
        const niebla = 1 - clamp((y - 58) / 4);
        scene.fog.color.set(bot);
        scene.fog.near = niebla > 0 ? Math.max(d * 2.2, 160) / niebla : 1e15; scene.fog.far = niebla > 0 ? Math.max(d * 9, 2600) / niebla : 2e15;
        hemi.intensity = 1.25 - 0.45 * clamp((y - 58) / 8);
        stars.material.color.setScalar(clamp((y - 57) / 6)); stars.visible = y > 57;
        stars.position.copy(camera.position); stars.scale.setScalar(camera.far * 0.45);
        // nothing flat casts a shadow; the lines and the Earth never do
        for (const o of [globo, parcheIb, suelo, plaza, sueloLuna, atmos]) o.castShadow = false;
        for (const l of [lToledo, lCamino, lLazo, lMoon]) l.traverse((o) => (o.castShadow = false));
        lRio.castShadow = false; lMoonFondo.castShadow = false;

        // ---- the character on the Moon ----
        pie.visible = kz > 0.001;
        P2.animar(t);
        const ola = clamp((t - tCohete - 0.3) / 0.4);
        P2.arms[1].rotation.z = lerp(P2.arms[1].rotation.z, 2.5 + 0.35 * Math.sin(t * 9), ola);

        // ---- the 47 % tag on the way to the Moon ----
        const pct = Math.min(100, Math.round((v / LUNA_D) * 100));
        const tagOp = clamp((m - 0.6) * 4) * (1 - clamp((pct - 88) / 8)) * (1 - kz);
        tag.style.opacity = tagOp;
        if (tagOp > 0.01) {
          const s = head3.clone().project(camera), sx = (s.x + 1) * 0.5 * W, sy = (1 - s.y) * 0.5 * H;
          tag.innerHTML = `<b>${pct} %</b> DEL CAMINO`;
          tag.style.left = clamp(sx - tag.offsetWidth / 2, 60, 940 - tag.offsetWidth) + "px"; tag.style.top = sy + 34 + "px";
        }

        C.pintar(t, y);
        altEl.innerHTML = `${km(v)}<small>km</small>`;
        encajar();
        // the labels leave as soon as the camera dives towards the Moon
        if (kz > 0) labs.forEach((el, i) => { const o = parseFloat(el.style.opacity || 0) * clamp(1 - kz * 5); el.style.opacity = o; lns[i].setAttribute("opacity", o); dots[i].setAttribute("opacity", o); });
      }
      await C.arrancar(renderAt);
    </script>
  </body>
