      { const g = new THREE.Group(); g.add(at(cyl(0.6, 0.5, 0.7, mat(0xb8c4d6, { metalness: 0.5, roughness: 0.3 }), 16), 0, 0, 0)); g.add(at(cyl(0.56, 0.56, 0.04, glow(0x5bc0ff), 16), 0, 0.33, 0));
        for (let i = 0; i < 6; i++) { const b = at(ico(0.07, glow(0xdff6ff), 0), (hash(i + 30) - 0.5) * 0.8, 0.4, (hash(i + 40) - 0.5) * 0.6); g.add(b); bubbles.push(b); } place("EL AGUA HIERVE", g); }
      // burning paper
      const flames = [];
      function fire(g, n, w, h, s) {
        for (let i = 0; i < n; i++) { const f = at(new THREE.Mesh(new THREE.ConeGeometry(w * (0.6 + hash(i + s) * 0.5), h * (0.6 + hash(i + s + 9) * 0.6), 5), glow([0xff6a00, 0xffb000, 0xff3d00][i % 3])), (i - (n - 1) / 2) * w * 0.9, h * 0.35, 0); g.add(f); flames.push([f, i + s]); }
      }
      { const g = new THREE.Group(); const p = at(box(1.0, 0.02, 1.3, mat(0xfaf6ea)), 0, 0, 0); p.rotation.x = 0.5; g.add(p); const f = new THREE.Group(); fire(f, 4, 0.22, 0.7, 10); f.position.set(0.1, 0.1, 0.2); g.add(f); place("EL PAPEL ARDE", g); }
      // lead: an ingot melting into a puddle
      { const g = new THREE.Group(); const LEAD = mat(0x8a8f99, { metalness: 0.7, roughness: 0.35 }); g.add(at(box(0.9, 0.35, 0.45, LEAD), -0.15, 0.1, 0)); g.add(at(cyl(0.7, 0.75, 0.05, LEAD, 14), 0.25, -0.06, 0.1)); place("PLOMO FUNDIDO", g); }
      // pizza oven: a brick dome with a glowing mouth and a pizza
      { const g = new THREE.Group(); g.add(at(new THREE.Mesh(new THREE.SphereGeometry(0.9, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xb5532e)), 0, -0.3, 0)); g.add(at(box(0.6, 0.45, 0.1, glow(0xff8a2b)), 0, -0.08, 0.86));
        const pz = at(cyl(0.38, 0.38, 0.05, mat(0xf2c14e), 14), 0.1, -0.28, 1.15); g.add(pz); for (let i = 0; i < 5; i++) pz.add(at(cyl(0.06, 0.06, 0.03, mat(0xc0392b), 8), (hash(i + 60) - 0.5) * 0.5, 0.04, (hash(i + 70) - 0.5) * 0.5)); place("HORNO DE PIZZA", g); }
      // glowing red: a heater element
      { const g = new THREE.Group(); for (let i = 0; i < 4; i++) g.add(at(box(1.3, 0.08, 0.08, glow(0xff3020)), 0, i * 0.22 - 0.33, 0)); g.add(at(box(1.5, 1.0, 0.1, mat(0x3b4260)), 0, 0, -0.12)); place("BRILLA EN ROJO", g); }
      // aluminium: an ingot melting into a shiny puddle
      { const g = new THREE.Group(); const ALU = mat(0xd0d4dc, { metalness: 0.8, roughness: 0.25 }); const bar = at(box(0.85, 0.3, 0.42, ALU), -0.15, 0.1, 0); bar.rotation.z = 0.12; g.add(bar); g.add(at(cyl(0.65, 0.7, 0.05, ALU, 14), 0.25, -0.08, 0.1)); place("ALUMINIO FUNDIDO", g); }
      // lava: a small volcano with a glowing crater
      { const g = new THREE.Group(); g.add(at(new THREE.Mesh(new THREE.ConeGeometry(1.1, 1.2, 7), mat(0x3a2a2a)), 0, -0.2, 0)); g.add(at(cyl(0.22, 0.3, 0.1, glow(0xff5a1a), 8), 0, 0.38, 0));
        const flow = at(box(0.16, 0.9, 0.06, glow(0xff7a1a)), 0.28, -0.05, 0.55); flow.rotation.z = 0.5; flow.rotation.x = -0.6; g.add(flow); place("LAVA", g); }
      // iron: a crucible pouring a glowing stream
      { const g = new THREE.Group(); const cru = at(cyl(0.42, 0.3, 0.6, mat(0x4a4f5c, { metalness: 0.4 }), 12), -0.3, 0.45, 0); cru.rotation.z = -0.7; g.add(cru); g.add(at(cyl(0.07, 0.07, 0.9, glow(0xffc04d), 8), 0.05, -0.05, 0)); g.add(at(cyl(0.45, 0.5, 0.06, glow(0xffa02b), 14), 0.1, -0.5, 0)); place("HIERRO FUNDIDO", g); }
      // the Sun: a big blazing ball beside the phone
      const sun = new THREE.Group(); sun.position.set(2.4, yDe("SUPERFICIE DEL SOL") + 0.4, -6); scene.add(sun);
      sun.add(ico(2.6, glow(0xffd23a), 2));

      props["SUPERFICIE DEL SOL"] = sun;

      // ---------- embers rising faster as it heats up ----------
      const embers = new THREE.Group(); scene.add(embers); const emberMat = new THREE.MeshBasicMaterial({ color: 0xffb04d, transparent: true, opacity: 0, depthWrite: false, toneMapped: false });
      for (let i = 0; i < 60; i++) embers.add(at(box(0.06, 0.06, 0.06, emberMat), (hash(i + 100) - 0.5) * 10, 0, -1 - hash(i + 200) * 6));

      // background: cool room -> warm -> red hot -> white hot
      const SKY = [[14, "#3d4f86", "#8fa6d8"], [20, "#e0703a", "#ffc58a"], [27, "#a3201a", "#ff6a2e"], [32, "#ff5a00", "#ffbf4d"], [37.5, "#fff1c9", "#ffffff"]];

      const GLOW = [[400, 0x000000], [525, 0x5a0800], [700, 0xff2a00], [1000, 0xff6a00], [1500, 0xffaa33], [3000, 0xffe2a6], [5500, 0xfff8ee]];
      const glowAt = (T) => { let i = 0; while (i < GLOW.length - 2 && T > GLOW[i + 1][0]) i++; const a = GLOW[i], b = GLOW[i + 1]; return new THREE.Color(a[1]).lerp(new THREE.Color(b[1]), clamp((T - a[0]) / (b[0] - a[0]))); };

      for (const [etq, g] of Object.entries(props)) labPos[etq] = [g, v3(0, 0.6, 0)];

      function renderAt(t) {

        const worry = clamp((T - 34) / 40);

        mouth.scale.set(1 - 0.4 * worry, 1 + 1.6 * worry, 1);
        eyes.forEach((e) => (e.scale.y = 1 - 0.75 * clamp((T - 300) / 300)));
        drops.forEach((d, i) => { const k = ((t * 0.7 + i * 0.5) % 1); d.visible = T > 35 && T < 400; d.position.y = 1.6 - i * 0.3 - k * 0.5; });
        SCREEN.color.set(new THREE.Color(0x63c7ff).lerp(new THREE.Color(0xffd0a0), clamp((T - 200) / 600)));
        const g = glowAt(T); BODY.emissive.copy(g);
        heat.color.copy(g.clone().lerp(new THREE.Color(0xff6a2b), 0.3)); heat.intensity = 6 * clamp((T - 450) / 600) + 10 * hot;
        halo.material.color.copy(g); halo.material.opacity = 0.25 * clamp((T - 600) / 900);
        // camera follows the phone up the thermometer
        const dist = 13.5 + 3 * ramp(t, D - 4.5, D - 1);
        const sway = Math.sin(t * 0.6) * 0.5;
        camera.position.set(0.9 + sway * 0.6, y + 2.0, dist);
        camera.lookAt(0.15, y + 0.95, 0);
        camera.updateMatrixWorld();
        C.escala(v3(0.15, y + 1, 0), dist);
        hemi.intensity = 1.3 + 0.4 * hot; rim.color.set(new THREE.Color(0x9fe4ff).lerp(new THREE.Color(0xffb04d), clamp((T - 100) / 400)));
        P.animar(t);
        head.rotation.x = -0.25 - 0.3 * clamp((y - y0) / 2); head.rotation.y = 0.3 + Math.sin(t * 0.9) * 0.15;
        C.fondo(SKY, y);
        // moving bits
        bubbles.forEach((b, i) => (b.position.y = 0.36 + ((t * 0.8 + hash(i + 50)) % 1) * 0.35));
        flames.forEach(([f, s]) => (f.scale.y = 0.85 + 0.25 * Math.sin(t * 9 + s * 1.7)));
        sun.rotation.y = t * 0.1;
        emberMat.opacity = clamp((T - 200) / 300) * 0.9;
        embers.children.forEach((e, i) => { e.position.y = y - 3 + (((t * (1.2 + hash(i) * 1.5 + yv * 2) + hash(i + 50) * 9) % 9)); });
        C.pintar(t, y);
      }
      await C.arrancar(renderAt);
    </script>
