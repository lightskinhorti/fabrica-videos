      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: canvasTex(256, 256, (g, w, h) => {
          const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
          r.addColorStop(0, "rgba(255,190,110,1)"); r.addColorStop(0.25, "rgba(255,140,50,0.55)"); r.addColorStop(1, "rgba(255,100,20,0)");
          g.fillStyle = r; g.fillRect(0, 0, w, h);
        }).tex,
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0,
      }));
      halo.position.set(CHIP.x, LT + 0.3, CHIP.z); halo.scale.set(1.7, 1.7, 1);
      card.add(halo);

      // current particles along the coil
      const NP = 70;
      const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffb060, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      const sparks = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 10, 8), sparkMat, NP);
      card.add(sparks);
      const dummy = new THREE.Object3D();

      // ---------- payment terminal ----------
      const pos = new THREE.Group();
      scene.add(pos);
      const termMat = new THREE.MeshPhysicalMaterial({ color: 0x1a1b1e, roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.25 });
      const body = new THREE.Mesh(new RoundedBoxGeometry(7.6, 1.6, 15, 4, 0.6), termMat);
      body.position.y = 0.8; body.castShadow = true; body.receiveShadow = true;
      pos.add(body);
      const bezel = new THREE.Mesh(new RoundedBoxGeometry(6.2, 0.06, 5.0, 3, 0.25), new THREE.MeshPhysicalMaterial({ color: 0x050506, roughness: 0.15, clearcoat: 1 }));
      bezel.position.set(0, 1.6, -3.7); pos.add(bezel);
      const scr = canvasTex(1160, 920, () => {});
      function drawScreen(state) {
        const g = scr.g, w = 1160, h = 920;
        g.fillStyle = "#0b0d10"; g.fillRect(0, 0, w, h);
        g.textAlign = "center";
        if (state === 0) {
          g.fillStyle = "#f4f4f4"; g.font = "700 150px Inter"; g.fillText("12,50 €", w / 2, 360);
          g.strokeStyle = "#ffae5c"; g.lineWidth = 16; g.lineCap = "round";
          for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(w / 2 - 60, 600, 40 + i * 38, -0.8, 0.8); g.stroke(); }
          g.fillStyle = "rgba(255,255,255,0.55)"; g.font = "400 58px Inter"; g.fillText("Acerque la tarjeta", w / 2, 840);
        } else {
          g.fillStyle = "#2fbf71"; g.beginPath(); g.arc(w / 2, 400, 180, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "#0b0d10"; g.lineWidth = 34; g.lineCap = "round"; g.lineJoin = "round";
          g.beginPath(); g.moveTo(w / 2 - 80, 405); g.lineTo(w / 2 - 15, 470); g.lineTo(w / 2 + 95, 330); g.stroke();
          g.fillStyle = "#f4f4f4"; g.font = "700 110px Inter"; g.fillText("Pagado", w / 2, 760);
        }
        scr.tex.needsUpdate = true;
      }
      let screenState = -1;
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(5.8, 4.6), new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: scr.tex, emissiveIntensity: 0.85, roughness: 0.2 }));
      screen.rotation.x = -Math.PI / 2; screen.position.set(0, 1.64, -3.7);
      pos.add(screen);
      const keyMat = new THREE.MeshPhysicalMaterial({ color: 0x2b2d31, roughness: 0.5, clearcoat: 0.3 });
      const keys = new THREE.InstancedMesh(new RoundedBoxGeometry(1.55, 0.22, 0.95, 2, 0.12), keyMat, 12);
      for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) {
        dummy.position.set((c - 1) * 2.0, 1.66, 0.9 + r * 1.3); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix();
        keys.setMatrixAt(r * 3 + c, dummy.matrix);
      }
      keys.castShadow = true; pos.add(keys);

      pos.position.set(2.6, 0, -2.6);
      pos.rotation.y = 0.32;
      pos.updateMatrixWorld();
      const R = pos.localToWorld(v3(0, 1.64, -3.7));

      // magnetic field rings
      const NR = 7;
      const ringMat = [];
      const rings = [];
      for (let i = 0; i < NR; i++) {
        const m = new THREE.MeshBasicMaterial({ color: 0xff9a3c, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.018, 8, 160), m);
        ring.rotation.x = Math.PI / 2;
        pos.add(ring);
        rings.push(ring); ringMat.push(m);
      }

      // ---------- finger ----------
      const prof = [];
      for (let i = 0; i <= 16; i++) { const a = (i / 16) * (Math.PI / 2); prof.push(new THREE.Vector2(0.82 * Math.sin(a) + 0.0001, 0.82 * (1 - Math.cos(a)))); }
      prof.push(new THREE.Vector2(0.86, 1.8), new THREE.Vector2(0.88, 3.0), new THREE.Vector2(0.93, 3.4), new THREE.Vector2(0.92, 4.4), new THREE.Vector2(0.97, 7), new THREE.Vector2(1.02, 12));
      const fGeo = new THREE.LatheGeometry(prof, 64);
      fGeo.scale(1, 1, 0.84);
      const skin = new THREE.MeshPhysicalMaterial({ color: 0xd9ad98, roughness: 0.62, sheen: 0.45, sheenRoughness: 0.7, sheenColor: new THREE.Color(0xffd2bd), clearcoat: 0.08, clearcoatRoughness: 0.7, emissive: 0x3a1408, emissiveIntensity: 0.18 });
      const finger = new THREE.Group();
      const fMesh = new THREE.Mesh(fGeo, skin); fMesh.castShadow = true; finger.add(fMesh);
      const nail = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 20), new THREE.MeshPhysicalMaterial({ color: 0xe3b4a6, roughness: 0.3, clearcoat: 0.9, clearcoatRoughness: 0.2 }));
      nail.scale.set(0.5, 0.78, 0.085); nail.position.set(0, 1.12, 0.61); nail.rotation.x = -0.12;
      finger.add(nail);
      scene.add(finger);
      const UP = v3(0, 1, 0);
      function placeFinger(contact, dir, away) {
        const d = dir.clone().normalize();
        const z = UP.clone().sub(d.clone().multiplyScalar(d.dot(UP))).normalize();
        const x = new THREE.Vector3().crossVectors(d, z).normalize();
        const m = new THREE.Matrix4().makeBasis(x, d, z);
        finger.quaternion.setFromRotationMatrix(m);
        const origin = contact.clone().add(UP.clone().multiplyScalar(0.72)).sub(d.clone().multiplyScalar(0.8)).add(d.clone().multiplyScalar(away));
        finger.position.copy(origin);
      }

      // ---------- post ----------
      const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
      const composer = new EffectComposer(renderer, rt);
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.6, 0.55, 0.86);
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      // ---------- story constants ----------
      const C0 = { p: v3(-2.4, 0, 3.4), yaw: -1.15 };
      const C1 = { p: v3(-3.2, 0, 4.4), yaw: -0.95 };
      const C2 = { p: R.clone().add(v3(0, 2.6, 0)), yaw: 0.32 };
      // timed to the Gemini voice (es-es-concierge-12); keep in sync with sonido.py
      const T_TAP = 0.69, T_SLIDE0 = 2.63, T_SLIDE1 = 4.77, T_CUT = 5.96, T_FIELD = 9.53, T_LIFT0 = 12.62, T_LIFT1 = 14.56, T_CURRENT = 15.23, T_CHIP = 18.35, T_PAID = 19.92;

      const CAM = [
        { t: 0.0, p: v3(-0.2, 10.6, 14.2), q: v3(-2.2, 0.2, 2.5) },
        { t: 2.16, p: v3(-0.6, 9.8, 13.0), q: v3(-2.2, 0.2, 2.5) },
        { t: 3.23, p: v3(0.6, 18.8, 18.6), q: v3(-0.6, 0.4, 0.9) },
        { t: 5.84, p: v3(0.2, 18.0, 17.8), q: v3(-0.8, 0.4, 1.1) },
        { t: 6.49, p: C1.p.clone().add(v3(-0.6, 13.8, 10.6)), q: C1.p.clone().add(v3(0.0, 0.9, -0.2)) },
        { t: 9.22, p: C1.p.clone().add(v3(-0.3, 13.1, 9.9)), q: C1.p.clone().add(v3(0.0, 0.9, -0.2)) },
        { t: 9.96, p: R.clone().add(v3(-0.6, 9.5, 12.0)), q: R.clone().add(v3(0.0, 1.8, 1.0)) },
        { t: 12.29, p: R.clone().add(v3(-1.0, 9.2, 11.2)), q: R.clone().add(v3(0.0, 1.8, 1.0)) },
        { t: 13.11, p: R.clone().add(v3(-4.6, 12.5, 12.5)), q: R.clone().add(v3(-0.4, 2.2, 0.6)) },
        { t: 16.93, p: R.clone().add(v3(-4.0, 11.6, 11.4)), q: R.clone().add(v3(-0.4, 2.2, 0.6)) },
        { t: 17.86, p: R.clone().add(v3(-3.6, 11.0, 10.2)), q: R.clone().add(v3(-0.9, 2.0, 0.0)) },
        { t: 19.51, p: R.clone().add(v3(-3.3, 10.6, 9.8)), q: R.clone().add(v3(-0.8, 2.0, 0.1)) },
        { t: 21.2, p: R.clone().add(v3(0.4, 13.6, 11.2)), q: R.clone().add(v3(0.0, 0.8, -0.2)) },
      ];
      function camAt(t) {
        let i = 0;
        while (i < CAM.length - 2 && t > CAM[i + 1].t) i++;
        const a = CAM[i], b = CAM[i + 1];
        const k = ease(clamp((t - a.t) / (b.t - a.t)));
        return { p: a.p.clone().lerp(b.p, k), q: a.q.clone().lerp(b.q, k) };
      }

      // ---------- captions ----------
      const ICON = {
        bat: '<svg class="ico" viewBox="0 0 34 18"><rect x="1.5" y="1.5" width="27" height="15" rx="3" fill="none" stroke="#fff" stroke-width="3"/><rect x="30" y="6" width="3" height="6" rx="1" fill="#fff"/><rect x="5" y="5" width="5" height="8" rx="1" fill="#ff5a4a"/></svg>',
        bolt: '<svg class="ico" viewBox="0 0 14 22"><path d="M8.5 0 0 12.5h5.5L4.5 22 14 8.8H8.2z" fill="#ffb347"/></svg>',
      };
      const ICON_FOR = { "batería.": "bat", "energía": "bolt", "corriente": "bolt" };
      const BREAKS = { l1: [2], l2: [1, 4, 6], l3: [2, 6, 9], l4: [2, 5], l5: [2, 4, 7, 10], l6: [3, 6, 8] };
      const chunks = [];
      for (const L of VOZ.lines) {
        const cuts = [0, ...BREAKS[L.id], L.words.length];
        for (let i = 0; i < cuts.length - 1; i++) chunks.push(L.words.slice(cuts[i], cuts[i + 1]));
      }
      const capsEl = document.getElementById("caps");
      const chunkEls = chunks.map((ws, ci) => {
        const line = document.createElement("div");
        line.className = "line"; line.style.display = "none";
        ws.forEach((w, wi) => {
          const span = document.createElement("span");
          span.className = "w" + (w.key ? " key" : "");
          const ico = ICON_FOR[w.w] ? ICON[ICON_FOR[w.w]] : "";
          span.innerHTML = (w.key ? '<span class="box"></span><span class="h1"></span><span class="h2"></span>' : "") + ico + '<span class="txt">' + w.w + "</span>";
          line.appendChild(span);
        });
        capsEl.appendChild(line);
        return line;
      });
      function drawCaps(t) {
        let active = -1;
        for (let i = 0; i < chunks.length; i++) if (t >= chunks[i][0].s - 0.06) active = i;
        chunkEls.forEach((el, i) => (el.style.display = i === active ? "block" : "none"));
        if (active < 0) return;
        const ws = chunks[active];
        let last = -1;
        ws.forEach((w, i) => { if (t >= w.s - 0.04) last = i; });
        [...chunkEls[active].children].forEach((span, i) => {
          const w = ws[i];
          const k = clamp((t - (w.s - 0.04)) / 0.12);
          span.style.opacity = k;
          span.style.transform = `translateY(${(1 - ease(k)) * 10}px)`;
          span.classList.toggle("now", i === last);
          if (w.key) {
            const ks = ease(clamp((t - w.s) / 0.14));
            for (const c of span.querySelectorAll(".box,.h1,.h2")) c.style.opacity = ks;
            span.querySelector(".box").style.transform = `scale(${0.9 + 0.1 * ks})`;
          }
        });
      }

      // ---------- labels ----------
      const labA = document.getElementById("labA"), labB = document.getElementById("labB");
      const toScreen = (p) => { const v = p.clone().project(camera); return { x: (v.x + 1) * 0.5 * W, y: (1 - v.y) * 0.5 * H }; };
      function drawLabel(labEl, gId, anchorLocal, dx, dy, alpha) {
        const g = document.getElementById(gId);
        g.setAttribute("opacity", alpha.toFixed(3));
        labEl.style.opacity = alpha;
        if (alpha <= 0) return;
        const a = toScreen(card.localToWorld(anchorLocal.clone()));
        const sx = a.x > W * 0.55 ? -Math.abs(dx) : Math.abs(dx); const lx = clamp(a.x + sx, 80, W - 80), ly = a.y + dy; dx = sx;
        const l = document.getElementById(gId + "-l"), d = document.getElementById(gId + "-d");
        l.setAttribute("x1", a.x); l.setAttribute("y1", a.y); l.setAttribute("x2", lx); l.setAttribute("y2", ly + 14);
        d.setAttribute("cx", a.x); d.setAttribute("cy", a.y);
        labEl.style.left = lx - (dx < 0 ? labEl.offsetWidth : 0) + "px";
        labEl.style.top = ly - 18 + "px";
      }

      // ---------- frame ----------
      function renderAt(t) {
        // card placement
        const slide = ramp(t, T_SLIDE0, T_SLIDE1);
        const lift = ramp(t, T_LIFT0, T_LIFT1);
        const p = C0.p.clone().lerp(C1.p, slide);
        let yaw = lerp(C0.yaw, C1.yaw, slide);
        yaw = lerp(yaw, -1.45, ramp(t, T_CUT - 0.1, T_CUT + 0.9));
        if (lift > 0) { p.lerp(C2.p, lift); p.y += Math.sin(lift * Math.PI) * 0.9; yaw = lerp(yaw, C2.yaw, lift); }
        p.y += lift >= 1 ? Math.sin((t - T_LIFT1) * 1.6) * 0.05 : 0;
        const away2 = ramp(t, T_PAID - 0.25, T_PAID + 0.6);
        p.add(v3(-5.2 * away2, 1.4 * away2, -1.6 * away2));
        card.position.copy(p);
        card.rotation.set(Math.sin(lift * Math.PI) * -0.12, yaw, 0);

        // cutaway: top layer lifts, then becomes x-ray
        const open = ramp(t, T_CUT, T_CUT + 1.1);
        const settle = ramp(t, 11.57, 12.37);
        topGroup.position.y = LT + 1.9 * open * (1 - settle);
        topGroup.rotation.z = 0.06 * open * (1 - settle);
        const op = lerp(1, lerp(0.3, 0.14, settle), open);
        topMat.opacity = op; coreMat.opacity = op;
        topMat.depthWrite = op > 0.95;
        topMat.emissive.setHex(0x8a919c); topMat.emissiveIntensity = 0.12 * open * (1 - settle) + 0.05 * settle;
        topMat.clearcoat = lerp(0.8, 0.1, open);
        top.castShadow = op > 0.6;

        // field, current, chip, screen
        const fieldOn = ramp(t, T_FIELD, T_FIELD + 0.6) * (1 - ramp(t, T_PAID + 0.2, T_PAID + 0.9));
        rings.forEach((ring, i) => {
          const ph = (((t - T_FIELD) * 0.42 + i / NR) % 1 + 1) % 1;
          const r = 1.2 + ph * 5.2;
          ring.scale.set(r, r, 1);
          ring.position.set(0, 1.7 + ph * 4.2, -3.7);
          ringMat[i].opacity = fieldOn * Math.sin(Math.PI * ph) * 0.85;
        });
        const cur = ramp(t, T_CURRENT, T_CURRENT + 0.5);
        copper.emissiveIntensity = 0.55 * cur * (0.85 + 0.15 * Math.sin(t * 9));
        sparkMat.opacity = cur;
        for (let i = 0; i < NP; i++) {
          const u = (((i / NP) + (t - T_CURRENT) * 0.11) % 1 + 1) % 1;
          dummy.position.copy(coilCurve.getPointAt(u)); dummy.position.y += 0.02;
          const s = cur * (0.8 + 0.5 * hash(i));
          dummy.scale.set(s, s, s); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
          sparks.setMatrixAt(i, dummy.matrix);
        }
        sparks.instanceMatrix.needsUpdate = true;
        const chipOn = ramp(t, T_CHIP, T_CHIP + 0.3);
        gold.emissiveIntensity = 0.55 * chipOn;
        halo.material.opacity = chipOn * (0.6 + 0.08 * Math.sin(t * 7));
        const st = t >= T_PAID ? 1 : 0;
        if (st !== screenState) { drawScreen(st); screenState = st; }

        // finger
        const tapIn = ramp(t, 0.0, T_TAP), tapOut = ramp(t, T_TAP + 0.35, T_TAP + 0.9);
        const goneSlide = ramp(t, T_SLIDE1 + 0.25, T_SLIDE1 + 0.9);
        const back = ramp(t, 13.11, 13.89);
        let away = 0;
        if (t < T_SLIDE0 - 0.4) away = (1 - tapIn) * 7 + tapOut * 1.2;
        else if (t < 13.11) away = lerp(1.2, 0, ramp(t, T_SLIDE0 - 0.4, T_SLIDE0)) + goneSlide * 12;
        else away = (1 - back) * 7;
        const contactLocal = v3(1.6, LT * 2 + 0.01 + (topGroup.position.y - LT), 0.6);
        const contact = card.localToWorld(contactLocal.clone());
        placeFinger(contact, v3(-0.5, 0.72, -0.48), away);
        finger.visible = away < 11.5;

        // camera
        const c = camAt(t);
        camera.position.copy(c.p); camera.lookAt(c.q); camera.updateMatrixWorld();
        key.target.position.copy(c.q);

        composer.render();

        // overlays
        drawCaps(t);
        const aA = ramp(t, 6.91, 7.2) * (1 - ramp(t, 9.14, 9.37));
        drawLabel(labA, "leadA", v3(CW / 2 - i0 - 0.12, LT + 0.04, 0.9), 70, -230, aA);
        const aB = ramp(t, 18.37, 18.7) * (1 - ramp(t, T_PAID - 0.4, T_PAID - 0.1));
        drawLabel(labB, "leadB", v3(CHIP.x, LT + 0.08, CHIP.z), -60, -220, aB);
        const note = document.getElementById("note");
        let txt = "", na = 0;
        if (t >= 6.06 && t < 9.31) { txt = "Ilustración ampliada"; na = ramp(t, 6.06, 6.46); }
        else if (t >= 9.68 && t < 15.18) { txt = "Campo mostrado en ámbar, invisible a la vista"; na = ramp(t, 9.68, 10.08); }
        else if (t >= 15.18) { txt = "Corriente mostrada en ámbar · Valores ilustrativos"; na = ramp(t, 15.28, 15.68); }
        note.textContent = txt; note.style.opacity = na;
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      await document.fonts.ready;
      renderAt(0);
      window.__renderAt = renderAt;
      window.__tarjetaReady();
    </script>
  </body>
