<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #050403; }
      #root { position: relative; width: 1080px; height: 1080px; }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1080px; }
      #shade {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 52%, rgba(0, 0, 0, 0) 48%, rgba(0, 0, 0, 0.65) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1080" data-fps="30">
      <canvas id="gl" class="clip" data-start="0" data-duration="1" data-track-index="0" width="1080" height="1080"></canvas>
      <div id="shade" class="clip" data-start="0" data-duration="1" data-track-index="1"></div>
    </div>

    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.perfil = new Promise((r) => (window.__perfilReady = r));
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>

    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const S = 1080;
      const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(S, S, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070504);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.35;

      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
      camera.position.set(-2.4, 12.8, 9.6); camera.lookAt(0.2, 0, 0.35);

      const key = new THREE.DirectionalLight(0xffd9b0, 2.2); key.position.set(-6, 9, 4); scene.add(key);
      const back = new THREE.DirectionalLight(0x7fb4ff, 1.6); back.position.set(5, 3, -7); scene.add(back);

      // warm wooden table, very dark
      const table = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x120b07, roughness: 0.85 }));
      table.rotation.x = -Math.PI / 2; table.position.y = -0.2; scene.add(table);

      // phone: solid aluminium frame + almost clear back glass
      const phone = new THREE.Group(); phone.rotation.y = 0.42; scene.add(phone);
      const W = 3.3, L = 6.6;
      function rr(w, h, r) {
        const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
        s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
        s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
        s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
        return s;
      }
      const outer = rr(W, L, 0.46); outer.holes.push(rr(W - 0.2, L - 0.2, 0.38));
      const frameGeo = new THREE.ExtrudeGeometry(outer, { depth: 0.36, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3, curveSegments: 24 });
      frameGeo.rotateX(-Math.PI / 2); frameGeo.translate(0, -0.18, 0);
      phone.add(new THREE.Mesh(frameGeo, new THREE.MeshStandardMaterial({ color: 0x4a4e57, metalness: 1, roughness: 0.3 })));
      const glass = new THREE.Mesh(new THREE.ExtrudeGeometry(rr(W - 0.16, L - 0.16, 0.4), { depth: 0.02, bevelEnabled: false, curveSegments: 24 }),
        new THREE.MeshPhysicalMaterial({ color: 0xbfd6ff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.1, clearcoat: 1, depthWrite: false }));
      glass.geometry.rotateX(-Math.PI / 2); glass.position.y = 0.17; phone.add(glass);

      // inside: battery, board with chips, camera module
      const battery = new THREE.Mesh(new RoundedBoxGeometry(2.5, 0.12, 3.3, 4, 0.08),
        new THREE.MeshStandardMaterial({ color: 0x15171c, metalness: 0.3, roughness: 0.6 }));
      battery.position.set(0, -0.02, 0.85); phone.add(battery);
      const board = new THREE.Mesh(new RoundedBoxGeometry(2.6, 0.06, 1.9, 3, 0.06), new THREE.MeshStandardMaterial({ color: 0x0f2a1e, roughness: 0.5 }));
      board.position.set(0, -0.03, -2.05); phone.add(board);
      const gold = new THREE.MeshStandardMaterial({ color: 0xd8a64a, metalness: 1, roughness: 0.25, emissive: 0xffb347, emissiveIntensity: 0.25 });
      for (const [x, z, w, d] of [[0.35, -2.0, 0.8, 0.8], [-0.7, -2.35, 0.45, 0.35], [-0.7, -1.7, 0.45, 0.3], [0.95, -2.55, 0.3, 0.3]]) {
        const chip = new THREE.Mesh(new RoundedBoxGeometry(w, 0.08, d, 2, 0.02), gold); chip.position.set(x, 0.03, z); phone.add(chip);
      }
      const lensMat = new THREE.MeshPhysicalMaterial({ color: 0x0a0c10, metalness: 0.5, roughness: 0.1, clearcoat: 1 });
      for (const [x, z] of [[-0.95, -2.85], [-0.95, -2.2]]) {
        const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.2, 40), lensMat); lens.position.set(x, 0.05, z); phone.add(lens);
      }

      // the star: copper charging coil, glowing
      const pts = [];
      const TURNS = 11, R0 = 0.32, R1 = 1.18;
      for (let i = 0; i <= TURNS * 64; i++) {
        const k = i / (TURNS * 64), a = k * TURNS * Math.PI * 2, r = R0 + (R1 - R0) * k;
        pts.push(v3(Math.cos(a) * r, 0.12, Math.sin(a) * r + 0.9));
      }
      const copper = new THREE.MeshStandardMaterial({ color: 0xd9824a, metalness: 1, roughness: 0.25, emissive: 0xff7a1f, emissiveIntensity: 1.05 });
      const coil = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), TURNS * 64, 0.032, 8, false), copper);
      phone.add(coil);
      const lead = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([v3(1.18, 0.12, 0.9), v3(1.25, 0.1, -0.4), v3(0.9, 0.06, -1.3), v3(0.6, 0.06, -1.75)]), 40, 0.03, 8, false), copper);
      phone.add(lead);

      // amber field rings rising from the coil
      for (let i = 0; i < 3; i++) {
        const r = 1.5 + i * 0.5;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 8, 160),
          new THREE.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.6 - i * 0.18, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
        ring.rotation.x = Math.PI / 2; ring.position.set(0, 0.45 + i * 0.38, 0.9); phone.add(ring);
      }

      const composer = new EffectComposer(renderer);
      composer.setPixelRatio(1); composer.setSize(S, S);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(S / 2, S / 2), 0.7, 0.4, 0.8));
      composer.addPass(new OutputPass());

      function renderAt() { composer.render(); }
      window.addEventListener("hf-seek", () => renderAt());
      await document.fonts.ready;
      renderAt();
      window.__perfilReady();
    </script>
  </body>
</html>
