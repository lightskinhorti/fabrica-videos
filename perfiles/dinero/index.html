<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #f4eee2; }
      #root { position: relative; width: 1080px; height: 1080px; font-family: "Inter", sans-serif; }
      #art { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1080" data-fps="30">
      <svg id="art" class="clip" data-start="0" data-duration="1" data-track-index="0" width="1080" height="1080" viewBox="0 0 1080 1080">
        <rect width="1080" height="1080" fill="#f4eee2" />
        <path id="lio" fill="none" stroke="#e5383b" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="738" cy="558" r="225" fill="#1d2a44" />
        <circle cx="720" cy="540" r="225" fill="#f2b705" stroke="#1d2a44" stroke-width="20" />
        <circle cx="720" cy="540" r="176" fill="none" stroke="#c98f00" stroke-width="11" />
        <text x="724" y="549" text-anchor="middle" dominant-baseline="central" font-size="280" font-weight="700" fill="#1d2a44">€</text>
      </svg>
    </div>

    <script>
      // the knot ("lío") untangles into a straight line that reaches the coin
      const pts = [];
      for (let i = 0; i <= 700; i++) {
        const t = (i / 700) * Math.PI * 7;
        pts.push([
          255 + 100 * Math.cos(t) + 42 * Math.cos(t * 2.7 + 0.5),
          540 + 96 * Math.sin(t * 1.3) + 40 * Math.sin(t * 3.1),
        ]);
      }
      const [lx, ly] = pts[pts.length - 1];
      const d = "M" + pts.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L")
        + ` C ${lx + 70} ${ly}, 360 540, 420 540 L 620 540`;
      document.getElementById("lio").setAttribute("d", d);

      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 1 }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
